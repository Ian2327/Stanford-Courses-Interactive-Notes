registerAssignment({
  id:'hw1', number:1, title:'Attention cost, compute-optimal training, entropy and KL',
  summary:'42 points plus 2 optional. Three problems that back up Lectures 2, 3 and 5: exact operation counts and gradients for attention and softmax, the compute-optimal model under inference demand, and an axiomatic derivation of entropy leading to the decomposition of next-token log loss.',
  intro:String.raw`<p><b>Notation.</b> Logarithms are natural and vectors are column vectors. For a matrix or vector \(A\), \(A^\top\) is its transpose and \(\nabla_AL\) is the gradient of a real-valued function \(L\), with entries \(\partial L/\partial A_{ij}\) for a matrix and \(\partial L/\partial A_i\) for a vector. You may use a result requested in an earlier part even if you have not proved it.</p>
  <p>Each problem has a <b>Compare with the answer key</b> panel that checks the submitted write-up against the official solutions part by part, with the points available. Verdicts are an informal read, not a grade.</p>
  <p>Statements are reproduced from the assignment. Each solution is the submitted write-up, cleaned up for reading; where a step was missing or had a typo, a yellow note says what was added. Try each part before opening its solution.</p>`,
  problems:[
  /* ---------------- Problem 1 ---------------- */
  {id:'p1a', key:String.raw`<table class="t"><thead><tr><th>Part</th><th class="r">Points</th><th>Key</th><th>Submitted</th><th>Verdict</th></tr></thead><tbody>
<tr><td>Three counts</td><td class="r">6</td><td>\(n^2(2d-1)+n(3n-1)+np(2n-1)\); \(n^2(2d-1)+np(2n-1)\); \(dp(2n-1)+np(2d-1)\)</td><td>Same three counts (\(3n^2-n = n(3n-1)\))</td><td>Matches</td></tr>
<tr><td>Dimensions</td><td class="r">—</td><td>All \(n\times p\); intermediates \(n\times n\) and \(d\times p\)</td><td>All \(n\times p\)</td><td>Matches</td></tr></tbody></table>
<p class="small">The key adds the asymptotics: the first two are \(\Theta(n^2(d+p))\), the third \(\Theta(ndp)\). Worth stating, but not asked for.</p>`, title:'Problem 1(a): operation counts for attention (6 points)', lectures:['l2','l5','l7'], blurb:'exact cost of softmax(QKᵀ)V and why reordering a softmax-free product is linear in n',
   statement:String.raw`<p>Let \(Q, K\in\mathbb R^{n\times d}\) and \(V\in\mathbb R^{n\times p}\), and let softmax act on each row: \([\operatorname{softmax}(S)]_{ij} = e^{S_{ij}}/\sum_{k=1}^n e^{S_{ik}}\) for \(S\in\mathbb R^{n\times n}\). Count each scalar addition, multiplication, division and exponentiation as one operation, and treat transposes as free. Count the operations needed to evaluate each expression below on its own, multiplying matrices by the row–column rule and, within softmax, computing each exponential and each row sum once:</p>
   $$ \operatorname{softmax}(QK^\top)V,\qquad (QK^\top)V,\qquad Q(K^\top V). $$
   <p>State the dimensions of each output.</p>`,
   hint:String.raw`<p>A dot product of two length-\(m\) vectors costs \(m\) multiplications and \(m-1\) additions, so \(2m-1\) operations. An \((a\times m)(m\times b)\) product therefore costs \(ab(2m-1)\).</p>`,
   solution:String.raw`<p><b>\(\operatorname{softmax}(QK^\top)V\).</b> Each of the \(n^2\) entries of \(QK^\top\) is a dot product of length \(d\): \(n^2(2d-1)\) operations. The softmax needs \(n^2\) exponentials, \(n(n-1)\) additions for the \(n\) row sums (each computed once), and \(n^2\) divisions: \(3n^2-n\). Multiplying the \(n\times n\) result by \(V\) costs \(np(2n-1)\). Total:</p>
   $$ n^2(2d-1) + np(2n-1) + 3n^2 - n. $$
   <p><b>\((QK^\top)V\).</b> The same two products without the softmax: \(n^2(2d-1) + np(2n-1)\).</p>
   <p><b>\(Q(K^\top V)\).</b> \(K^\top V\) is \((d\times n)(n\times p)\): \(dp(2n-1)\). Then \(Q\) times the \(d\times p\) result: \(np(2d-1)\). Total \(dp(2n-1)+np(2d-1) = 4npd - dp - np\).</p>
   <p>All three outputs are \(n\times p\). The first two are quadratic in \(n\); the third is linear in \(n\), because the \(n\times n\) matrix never forms. Associativity makes the last two equal, but the softmax sits between \(QK^\top\) and \(V\), so the cheap order is not available for real attention. Linear-attention methods remove or replace the softmax precisely to regain it.</p>`,
   after:String.raw`<div data-widget="opcount"></div>`},
  {id:'p1b', key:String.raw`<table class="t"><thead><tr><th>Part</th><th class="r">Points</th><th>Key</th><th>Submitted</th><th>Verdict</th></tr></thead><tbody>
<tr><td>\(\nabla_AL,\ \nabla_BL\)</td><td class="r">2</td><td>\(GB^\top\in\mathbb R^{m\times n}\), \(A^\top G\in\mathbb R^{n\times p}\)</td><td>\(GB^\top\), \(A^\top G\) via the same entrywise chain rule</td><td>Matches</td></tr></tbody></table>
<p class="small">The key’s mnemonic: each factor’s gradient multiplies \(G\) by the transpose of the other factor, on the side where that factor appears. (The key indexes \(Z_{ij} = \sum_kA_{ik}B_{kj}\); the write-up uses \(Z_{ik} = \sum_jA_{ij}B_{jk}\). Same result.)</p>`, title:'Problem 1(b): gradients of a matrix product (2 points)', lectures:['l2','l3','l7'], blurb:'∇_A L = GBᵀ and ∇_B L = AᵀG, the rule backpropagation applies to every linear layer',
   statement:String.raw`<p>Let \(A\in\mathbb R^{m\times n}\), \(B\in\mathbb R^{n\times p}\) and \(Z = AB\). A differentiable loss \(L\) depends on \(A, B\) through \(Z\). Given \(G = \nabla_Z L\), compute \(\nabla_A L\) and \(\nabla_B L\) in terms of \(A\), \(B\) and \(G\).</p>`,
   hint:String.raw`<p>Write \(Z_{ik} = \sum_j A_{ij}B_{jk}\) and apply the chain rule entry by entry.</p>`,
   solution:String.raw`<p>We have \(G_{ik} = \partial L/\partial Z_{ik}\) and \(Z_{ik} = \sum_{j} A_{ij}B_{jk}\), so \(\partial Z_{ik}/\partial A_{ij} = B_{jk}\) and \(\partial Z_{ik}/\partial B_{jk} = A_{ij}\).</p>
   $$ \frac{\partial L}{\partial A_{ij}} = \sum_k G_{ik}B_{jk} = \sum_k G_{ik}(B^\top)_{kj} = (GB^\top)_{ij}\quad\Longrightarrow\quad \nabla_A L = GB^\top . $$
   $$ \frac{\partial L}{\partial B_{jk}} = \sum_i G_{ik}A_{ij} = \sum_i (A^\top)_{ji}G_{ik} = (A^\top G)_{jk}\quad\Longrightarrow\quad \nabla_B L = A^\top G . $$
   <p>Shapes check: \(GB^\top\) is \((m\times p)(p\times n) = m\times n\), like \(A\); \(A^\top G\) is \(n\times p\), like \(B\). In a linear layer \(Z = XW\), this gives the weight gradient \(X^\top G\) that Lecture 3’s optimizers consume, and Muon’s update orthogonalises exactly such a matrix.</p>`},
  {id:'p1c', key:String.raw`<table class="t"><thead><tr><th>Part</th><th class="r">Points</th><th>Key</th><th>Submitted</th><th>Verdict</th></tr></thead><tbody>
<tr><td>(i)</td><td class="r">2</td><td>\(p_i(\mathbb 1_{i=j}-p_j)\), by the quotient rule</td><td>Same, by the product rule, as two cases</td><td>Matches</td></tr>
<tr><td>(ii)</td><td class="r">2</td><td>\(p\odot(g-(p^\top g)\mathbf 1_n)\)</td><td>Same</td><td>Matches</td></tr>
<tr><td>(iii)</td><td class="r">2</td><td>\(p-y\), using \(p^\top g = -1\)</td><td>\(p-y\), using \(\sum_iy_i=1\) entrywise</td><td>Matches</td></tr></tbody></table>`, title:'Problem 1(c): the softmax Jacobian and cross-entropy gradient (6 points)', lectures:['l2'], blurb:'∂pᵢ/∂xⱼ = pᵢ(δᵢⱼ − pⱼ), and cross-entropy’s gradient collapses to p − y',
   statement:String.raw`<p>For \(x\in\mathbb R^n\), set \(p_i = e^{x_i}/\sum_j e^{x_j}\). Let \(L\) be a differentiable function of \(p\), with \(g = \nabla_p L\).</p>
   <ol type="i"><li>Compute \(\partial p_i/\partial x_j\) for every \(i, j\).</li><li>Compute \(\nabla_x L\) in terms of \(p\) and \(g\).</li><li>Let \(y_i\ge 0\), \(\sum_i y_i = 1\), and \(L = -\sum_i y_i\log p_i\). Use (ii) to compute \(\nabla_x L\) in terms of \(p\) and \(y\).</li></ol>`,
   solution:String.raw`<p><b>(i)</b> Let \(\alpha = \sum_j e^{x_j}\), so \(\partial\alpha/\partial x_j = e^{x_j}\) and \(p_i = e^{x_i}\alpha^{-1}\). By the product rule,</p>
   $$ \frac{\partial p_i}{\partial x_j} = \frac{\partial e^{x_i}}{\partial x_j}\,\alpha^{-1} - \frac{e^{x_i}e^{x_j}}{\alpha^2} = \begin{cases} p_i(1-p_i) & i=j,\\ -p_ip_j & i\ne j,\end{cases}\qquad\text{i.e. } \frac{\partial p_i}{\partial x_j} = p_i(\delta_{ij}-p_j). $$
   <p><b>(ii)</b> By the chain rule,</p>
   $$ \frac{\partial L}{\partial x_j} = \sum_i g_i\frac{\partial p_i}{\partial x_j} = \sum_i g_i\,p_i(\delta_{ij}-p_j) = g_jp_j - p_j\sum_i g_ip_i = p_j\,(g_j - g^\top p), $$
   $$ \nabla_x L = p\odot\big(g - (g^\top p)\mathbf 1\big). $$
   <p>Each coordinate of \(g\) is centred by its \(p\)-weighted mean and then scaled by \(p\). Adding a constant to every \(g_i\) changes nothing, reflecting that softmax ignores a constant shift of its inputs.</p>
   <p><b>(iii)</b> Here \(g_i = -y_i/p_i\), so \(g^\top p = -\sum_i y_i = -1\) and</p>
   $$ \frac{\partial L}{\partial x_j} = p_j\Big(-\frac{y_j}{p_j} + 1\Big) = p_j - y_j\quad\Longrightarrow\quad \nabla_x L = p - y. $$
   <p>This is the gradient that flows from the next-token loss into the vocabulary scores in Lecture 2: predicted probabilities minus the target distribution.</p>`,
   after:String.raw`<div data-widget="loss-decomp"></div>`},
  /* ---------------- Problem 2 ---------------- */
  {id:'p2', key:String.raw`<table class="t"><thead><tr><th>Part</th><th class="r">Points</th><th>Key</th><th>Submitted</th><th>Verdict</th></tr></thead><tbody>
<tr><td>(a)</td><td class="r">3</td><td>Feasibility forces \(N>N_{\min}\); \(D(N) = (b/(\ell-aN^{-\alpha}))^{1/\beta}\); cost strictly increasing in \(D\)</td><td>Same formula and argument</td><td>Matches</td></tr>
<tr><td>(b)</td><td class="r">4</td><td>\(N_0,D_0\) as given, ratio \(\beta/\alpha\); uniqueness because \(1-\frac{\alpha aN^{-\alpha}}{\beta(\ell-aN^{-\alpha})}\) increases strictly from \(-\infty\) to 1</td><td>Correct \(N_0, D_0\) and ratio via the log-derivative. Uniqueness asserted (“\(C_0'<0\) before, \(>0\) after”) without showing why; one line has a “3aα” typo</td><td>Correct; uniqueness justification thin</td></tr>
<tr><td>(c)</td><td class="r">3</td><td>Add the two optimality inequalities; \(D(N)\) decreasing gives \(D_{T_2}\ge D_{T_1}\)</td><td>Same; uses \(D\) decreasing without saying why</td><td>Matches</td></tr>
<tr><td>(d)</td><td class="r">3</td><td>\(T_{\text{break}} = 3(N_sD_s-N_0D_0)/(N_0-N_s)>0\); below it \((N_0,D_0)\) is cheaper, above it \((N_s,D_s)\)</td><td>Equivalent formula and a correct positivity proof. <b>Does not say which option is cheaper on each side.</b></td><td>Incomplete: last question unanswered</td></tr></tbody></table>
<p class="small">The key gets (b) by implicit differentiation, \(D'(N) = -\frac{\alpha a}{\beta b}N^{-\alpha-1}D(N)^{\beta+1}\), rather than by differentiating \(\log C_0\); both routes reach the same sign condition. The worked solution on this page uses the key’s uniqueness argument.</p>`, title:'Problem 2: compute-optimal training with inference demand (13 points)', lectures:['l1','l2'], blurb:'the Chinchilla balance condition, and why heavy inference favours smaller models trained longer',
   statement:String.raw`<p>Suppose a model with \(N>0\) parameters trained on \(D>0\) tokens has excess loss \(L(N,D) = aN^{-\alpha} + bD^{-\beta}\) over a fixed baseline, where \(a,b,\alpha,\beta>0\) and \(N,D\) can be any positive reals. Training costs \(6N\) operations per token and inference costs \(2N\) per token. Given a target \(\ell>0\) and \(T\ge 0\) expected inference tokens, we minimise total compute:</p>
   $$ C_T(N,D) = 6ND + 2NT\quad\text{subject to}\quad L(N,D)\le\ell. $$
   <ol type="a">
   <li>Let \(N_{\min} = (a/\ell)^{1/\alpha}\). For \(N>N_{\min}\), find the least feasible \(D\), denoted \(D(N)\). Prove that the problem reduces to minimising \(C_T(N, D(N))\) over \(N>N_{\min}\).</li>
   <li>For \(T=0\), find the unique minimiser \((N_0, D_0)\) and the ratio \(aN_0^{-\alpha}/(bD_0^{-\beta})\).</li>
   <li>For \(T\ge0\), let \((N_T, D_T)\) be a minimiser (assume one exists). For \(T_2>T_1\), prove \(N_{T_2}\le N_{T_1}\) and \(D_{T_2}\ge D_{T_1}\). (Hint: compare the two pairs under each demand, then add the optimality inequalities.)</li>
   <li>Let \(N_s\in(N_{\min}, N_0)\) and \(D_s = D(N_s)\). Find the demand \(T_{\text{break}}\) at which \((N_s,D_s)\) and \((N_0,D_0)\) cost the same. Prove \(T_{\text{break}}>0\). Which is cheaper on each side?</li></ol>`,
   hint:String.raw`<p>For (b), minimise \(\log C_0\) rather than \(C_0\). For (c), write both optimality inequalities and add them; the \(6ND\) terms cancel.</p>`,
   solution:String.raw`<p><b>(a)</b> \(aN^{-\alpha}+bD^{-\beta}\le\ell \iff D^{-\beta}\le(\ell-aN^{-\alpha})/b\). If \(N\le N_{\min}\) then \(\ell - aN^{-\alpha}\le 0\) and no \(D>0\) satisfies this, so every feasible point has \(N>N_{\min}\); note \(N>N_{\min}\iff N^\alpha>a/\ell\iff \ell-aN^{-\alpha}>0\). For such \(N\),</p>
   $$ D \ge D(N) := \Big(\frac{b}{\ell - aN^{-\alpha}}\Big)^{1/\beta}. $$
   <p>For fixed \(N\), \(C_T\) is increasing and linear in \(D\) with slope \(6N>0\), so the inner minimum over feasible \(D\) is attained at \(D(N)\). Hence \(\min_{\text{feasible}}C_T = \min_{N>N_{\min}} C_T(N, D(N))\).</p>
   <p><b>(b)</b> With \(T=0\), minimise \(\log C_0 = \log 6 + \log N + \tfrac1\beta\big(\log b - \log(\ell - aN^{-\alpha})\big)\). Differentiating,</p>
   $$ \begin{aligned} \frac{d}{dN}\log C_0 &= \frac1N - \frac{a\alpha N^{-\alpha-1}}{\beta(\ell - aN^{-\alpha})} = 0\\ &\iff \beta(\ell - aN^{-\alpha}) = a\alpha N^{-\alpha} \iff N_0 = \Big(\frac{a(\alpha+\beta)}{\beta\ell}\Big)^{1/\alpha}. \end{aligned} $$
   <p>\(N_0>N_{\min}\) since \((\alpha+\beta)/\beta>1\). Substituting \(aN_0^{-\alpha} = \beta\ell/(\alpha+\beta)\) gives \(\ell - aN_0^{-\alpha} = \alpha\ell/(\alpha+\beta)\), so</p>
   $$ D_0 = \Big(\frac{b(\alpha+\beta)}{\alpha\ell}\Big)^{1/\beta},\qquad \frac{aN_0^{-\alpha}}{bD_0^{-\beta}} = \frac{\beta\ell/(\alpha+\beta)}{\alpha\ell/(\alpha+\beta)} = \frac\beta\alpha . $$
   <p>Uniqueness: \(N\cdot\frac{d}{dN}\log C_0 = 1 - \frac{\alpha aN^{-\alpha}}{\beta(\ell - aN^{-\alpha})}\), and as \(N\) increases the fraction’s numerator falls while its denominator rises, so this expression increases strictly from \(-\infty\) (as \(N\downarrow N_{\min}\)) to 1. It therefore changes sign exactly once, at \(N_0\): negative before, positive after, so \(N_0\) is the unique global minimiser on \((N_{\min},\infty)\). This is Lecture 2’s balance condition \(\alpha AN^{-\alpha} = \beta BD^{-\beta}\), rearranged.</p>
   <div class="fix">The submitted derivative line read “3aα” in one place; the coefficient is \(a\alpha\), as above. The final answer was unaffected.</div>
   <p><b>(c)</b> Optimality gives \(C_{T_1}(N_{T_1},D_{T_1})\le C_{T_1}(N_{T_2},D_{T_2})\) and \(C_{T_2}(N_{T_2},D_{T_2})\le C_{T_2}(N_{T_1},D_{T_1})\). Adding them, the \(6ND\) terms cancel:</p>
   $$ \begin{aligned} &2N_{T_1}T_1 + 2N_{T_2}T_2 \le 2N_{T_2}T_1 + 2N_{T_1}T_2\\ \iff\ &2(N_{T_1}-N_{T_2})(T_1-T_2)\le 0 . \end{aligned} $$
   <p>Since \(T_1-T_2\lt 0\), \(N_{T_1}-N_{T_2}\ge0\), i.e. \(N_{T_2}\le N_{T_1}\). At an optimum \(D_T = D(N_T)\), and \(D(N)\) is decreasing in \(N\) (\(\ell-aN^{-\alpha}\) increases with \(N\)), so \(D_{T_2}\ge D_{T_1}\).</p>
   <p><b>(d)</b> Setting \(6N_sD_s + 2N_sT = 6N_0D_0 + 2N_0T\):</p>
   $$ T_{\text{break}} = \frac{3(N_0D_0 - N_sD_s)}{N_s - N_0}. $$
   <p>The denominator is negative because \(N_s\lt N_0\). By (b), \((N_0,D_0)\) is the unique minimiser of \(6ND(N)\), so \(N_sD_s>N_0D_0\) and the numerator is negative too. Hence \(T_{\text{break}}>0\).</p>
   <p><b>Which is cheaper.</b> \(\Delta(T) := C_T(N_s,D_s) - C_T(N_0,D_0) = 6(N_sD_s - N_0D_0) + 2(N_s-N_0)T\) is positive at \(T=0\), decreasing in \(T\), and zero at \(T_{\text{break}}\). So for \(T\lt T_{\text{break}}\) the Chinchilla-style pair \((N_0,D_0)\) is cheaper, and for \(T>T_{\text{break}}\) the smaller model trained longer, \((N_s,D_s)\), is cheaper.</p>
   <div class="fix">The submitted write-up stopped after proving \(T_{\text{break}}>0\); the last paragraph answers the final question.</div>`,
   after:String.raw`<div data-widget="hw2-compute"></div>`},
  /* ---------------- Problem 3 ---------------- */
  {id:'p3', key:String.raw`<table class="t"><thead><tr><th>Part</th><th class="r">Points</th><th>Key</th><th>Submitted</th><th>Verdict</th></tr></thead><tbody>
<tr><td>(a)(i)</td><td class="r">3</td><td>Proves \(H_1(1)=0\) first; induction on \(k\) groups assuming all \(w_i>0\), then continuity for zero weights; then \(A(mn)=A(m)+A(n)\)</td><td>Induction correct in structure; uses \(H_1(1)=0\) without proving it, and divides by \(1-p_{k+1}\) without handling \(p_{k+1}=1\) or zero weights</td><td>Right idea, small gaps</td></tr>
<tr><td>(a)(ii)</td><td class="r">1</td><td>\(A(1)=0\) from (i) with \(m=n=1\); then repeat \(A(2n)=A(2)+A(n)\)</td><td>\(A(2^k) = \sum A(2) = k\log2\); the \(k=0\) case (\(A(1)=0\)) not addressed</td><td>Essentially matches</td></tr>
<tr><td>(a)(iii)</td><td class="r">3</td><td>Sandwich \(2^{r_k}\le n^k<2^{r_k+1}\), divide by \(k\), let \(k\to\infty\)</td><td>Same sandwich argument</td><td>Matches</td></tr>
<tr><td>(b)</td><td class="r">4</td><td>Grouped additivity gives \(-\sum p_i\log p_i\); density of rationals and continuity extend it to all \(p\), unique with \(0\log0=0\)</td><td>Correct derivation for rational \(p\); no extension to all \(p\)</td><td>Matches what was asked; extension missing</td></tr>
<tr><td>(c), optional</td><td class="r">2</td><td>Sum over \(S=\{i:p_i>0\}\); equality needs \(q_i=p_i\) on \(S\) and \(\sum_Sq_i=1\), so \(p=q\)</td><td>Proves \(\mathrm{KL}\ge0\), but sums over all \(i\) (dividing by \(p_i\) that may be 0) and <b>omits the equality case</b></td><td>Partial</td></tr>
<tr><td>(d)</td><td class="r">4</td><td>Chain-rule factorisation, sum of per-position KLs; equality iff \(P=Q\), i.e. conditionals agree at every prefix of positive \(P\)-probability</td><td>Same derivation and conclusion; the “positive probability” qualifier is not stated</td><td>Matches</td></tr></tbody></table>
<p class="small">Sources named by the key: Problem 2 follows Sardana et al. (2024), Section 2, extending Hoffmann et al. (2022); Problem 3 follows Shannon (1948), Theorem 2, for entropy and Leinster (2019) for KL divergence.</p>`, title:'Problem 3: entropy from axioms, KL divergence, and log loss (15 points + 2 optional)', lectures:['l2'], blurb:'why next-token log loss equals entropy plus a sum of per-position KL terms',
   statement:String.raw`<p>Entropy and KL divergence appear throughout machine learning; for instance, the next-token log loss is closely related to both (part (d)). We derive entropy from natural axioms and study KL divergence through a similar characterisation.</p>
   <p>Write \(\Delta_n = \{p\in\mathbb R^n: p_i\ge0, \sum_ip_i=1\}\) for the probability simplex, \(u_n = (1/n,\dots,1/n)\) for the uniform distribution, and \((x,y)\) for concatenation. We seek a measure \(H_n(p)\) of the uncertainty of \(p\in\Delta_n\) satisfying:</p>
   <ul><li><b>(E1) Continuity and invariance.</b> For every \(n\), \(H_n\) is continuous and permutation invariant.</li>
   <li><b>(E2) Monotonicity.</b> \(H_n(u_n)\) is nondecreasing in \(n\).</li>
   <li><b>(E3) Additivity.</b> For positive integers \(m,n\), \(p\in\Delta_m\), \(r\in\Delta_n\) and \(t\in[0,1]\): \(H_{m+n}(tp,(1-t)r) = H_2(t,1-t) + tH_m(p) + (1-t)H_n(r)\). A term with zero weight contributes zero.</li></ul>
   <p>Fix the unit by \(H_2(u_2) = \log 2\). Think of \(H_n(p)\) as the uncertainty resolved by observing a draw from \(p\): it should change little when \(p\) changes little and not depend on labels; more equally likely outcomes should not make a draw less uncertain; and observing a draw in two stages (first its group, with probabilities \(t, 1-t\), then the outcome within the group) should resolve the first stage’s uncertainty plus the expected uncertainty of the second.</p>
   <ol type="a">
   <li>Let \(A(n) = H_n(u_n)\). (i) Prove \(A(mn) = A(m)+A(n)\) (hint: extend additivity to any finite number of groups by induction). (ii) Deduce \(A(2^k) = k\log 2\). (iii) Use monotonicity to prove \(A(n) = \log n\) (hint: compare \(n^k\) with consecutive powers of 2 and let \(k\to\infty\)).</li>
   <li>Suppose \(p_i = a_i/N\) with positive integers \(a_i\) summing to \(N\). Derive \(H_n(p)\) by splitting outcome \(i\) into \(a_i\) equally likely outcomes.</li>
   <li><i>Kullback–Leibler divergence.</i> Analogous axioms characterise a measure of mismatch between a data distribution \(p\in\Delta_n\) and a model distribution \(q\in\Delta_n\) with positive coordinates: \(\mathrm{KL}(p\|q) = \sum_ip_i\log(p_i/q_i)\), where terms with \(p_i=0\) contribute zero. <b>(Optional, 2 points.)</b> Prove \(\mathrm{KL}(p\|q)\ge0\), with equality exactly when \(p=q\) (hint: \(\log x\le x-1\), with equality exactly at \(x=1\)).</li>
   <li>Let \(P, Q\) be distributions on sequences \(X = (X_1,\dots,X_T)\in V^T\) over a finite vocabulary \(V\), with \(Q\) positive on every sequence. Let \(p_t(\cdot\mid x_{\lt t})\) and \(q_t(\cdot\mid x_{\lt t})\) be their next-token distributions, where \(p_t\) is arbitrary at prefixes of probability zero under \(P\). For \(H(P) = -\sum_xP(x)\log P(x)\), prove
   $$ \mathbb E_{X\sim P}[-\log Q(X)] - H(P) = \mathrm{KL}(P\|Q) = \sum_{t=1}^T \mathbb E_{X_{\lt t}\sim P}\big[\mathrm{KL}\big(p_t(\cdot\mid X_{\lt t})\,\|\,q_t(\cdot\mid X_{\lt t})\big)\big]. $$
   Deduce when the expected log loss equals \(H(P)\).</li></ol>`,
   solution:String.raw`<p><b>(a)(i)</b> Claim \(P(k)\): \(H_{n_1+\dots+n_k}(p_1x_1,\dots,p_kx_k) = H_k(p_1,\dots,p_k) + \sum_{i=1}^k p_iH_{n_i}(x_i)\). \(P(2)\) is (E3). Assume \(P(k)\) and write \(s = 1-p_{k+1}\). Group the first \(k\) blocks against the last with (E3), then apply \(P(k)\) inside the first group:</p>
   $$ \begin{aligned} H(p_1x_1,\dots,p_{k+1}x_{k+1}) &= H_2(s, p_{k+1}) + s\,H\Big(\tfrac{p_1}{s}x_1,\dots,\tfrac{p_k}{s}x_k\Big) + p_{k+1}H_{n_{k+1}}(x_{k+1})\\ &= H_2(s,p_{k+1}) + s\,H_k\Big(\tfrac{p_1}{s},\dots,\tfrac{p_k}{s}\Big) + \sum_{i=1}^{k+1} p_iH_{n_i}(x_i). \end{aligned} $$
   <p>Applying (E3) the same way to the point masses \(x_i = (1)\), with \(H_1(1) = 0\), the first two terms equal \(H_{k+1}(p_1,\dots,p_{k+1})\). So \(P(k+1)\) holds. Now take \(k=m\), \(p_i = 1/m\), \(n_i = n\), \(x_i = u_n\): the left side is \(H_{mn}(u_{mn})\), so \(A(mn) = A(m) + A(n)\).</p>
   <div class="fix">\(H_1(1) = 0\) follows from (E3) with \(m=n=1\), \(t=1\): \(H_2(1,0) = H_2(1,0) + H_1(1)\), using the zero-weight convention.</div>
   <p><b>(ii)</b> Taking \(m=n=1\) in (i) gives \(A(1) = 2A(1)\), so \(A(1) = 0\), which is the case \(k=0\). Applying \(A(2n) = A(2)+A(n)\) repeatedly with \(A(2)=\log2\) gives \(A(2^k) = k\log2\).</p>
   <p><b>(iii)</b> For any \(k\), choose \(j\) with \(2^j\le n^k\lt 2^{j+1}\). Monotonicity and (ii) give \(j\log2\le A(n^k)\le(j+1)\log2\), and (i) gives \(A(n^k) = kA(n)\). So \(\tfrac jk\log2\le A(n)\le\tfrac{j+1}k\log2\). Also \(\tfrac jk\le\log_2n\lt \tfrac{j+1}k\). Both \(A(n)/\log2\) and \(\log_2n\) lie in an interval of width \(1/k\); letting \(k\to\infty\), \(A(n) = \log_2n\cdot\log2 = \log n\).</p>
   <p><b>(b)</b> Split outcome \(i\) into \(a_i\) outcomes of probability \(1/N\) each. By the grouped additivity of (a)(i),</p>
   $$ \log N = H_N(u_N) = H_n(p) + \sum_i p_iH_{a_i}(u_{a_i}) = H_n(p) + \sum_ip_i\log a_i . $$
   <p>With \(\log a_i = \log p_i + \log N\) and \(\sum_ip_i = 1\): \(H_n(p) = \log N - \sum_ip_i\log p_i - \log N = -\sum_ip_i\log p_i\). By continuity (E1) this extends from rational to all \(p\).</p>
   <p><b>(c)</b> \(\mathrm{KL}(p\|q) = \sum_ip_i\log(p_i/q_i)\), summing over \(i\) with \(p_i>0\). With \(x = q_i/p_i\), \(\log(q_i/p_i)\le q_i/p_i - 1\); multiply by \(p_i>0\):</p>
   $$ -p_i\log\frac{p_i}{q_i}\le q_i - p_i\quad\Longrightarrow\quad \mathrm{KL}(p\|q)\ge\sum_{i:p_i>0}(p_i - q_i) = 1 - \sum_{i:p_i>0}q_i\ \ge\ 0 . $$
   <p>Equality needs \(q_i = p_i\) for every \(i\) with \(p_i>0\) (equality in \(\log x\le x-1\) only at \(x=1\)) and \(\sum_{i:p_i>0}q_i = 1\), so \(q\) puts no mass elsewhere: \(q = p\). Conversely \(p=q\) gives zero.</p>
   <div class="fix">The submitted proof showed \(\mathrm{KL}\ge0\) but not the equality case or the terms with \(p_i = 0\); the last two sentences add them.</div>
   <p><b>(d)</b> First equality: \(\mathbb E_P[-\log Q] - H(P) = \sum_xP(x)\big(\log P(x) - \log Q(x)\big) = \mathrm{KL}(P\|Q)\). For the second, factor both distributions by the chain rule, \(P(x) = \prod_tp_t(x_t\mid x_{\lt t})\) and \(Q(x) = \prod_tq_t(x_t\mid x_{\lt t})\):</p>
   $$ \begin{aligned} \mathrm{KL}(P\|Q) &= \sum_xP(x)\sum_{t=1}^T\log\frac{p_t(x_t\mid x_{\lt t})}{q_t(x_t\mid x_{\lt t})}\\ &= \sum_{t=1}^T\sum_{x_{\lt t}}P(x_{\lt t})\sum_{x_t}p_t(x_t\mid x_{\lt t})\log\frac{p_t(x_t\mid x_{\lt t})}{q_t(x_t\mid x_{\lt t})}\\ &= \sum_{t=1}^T\mathbb E_{X_{\lt t}\sim P}\Big[\mathrm{KL}\big(p_t(\cdot\mid X_{\lt t})\,\|\,q_t(\cdot\mid X_{\lt t})\big)\Big], \end{aligned} $$
   <p>where summing out \(x_{>t}\) leaves the marginal \(P(x_{\lt t},x_t) = P(x_{\lt t})p_t(x_t\mid x_{\lt t})\). By (c) every term is nonnegative, so the expected log loss equals \(H(P)\) exactly when \(Q = P\), equivalently when \(q_t(\cdot\mid x_{\lt t}) = p_t(\cdot\mid x_{\lt t})\) at every prefix with \(P(x_{\lt t})>0\). The model is only judged on prefixes the data actually produces, which is why next-token training can match the data distribution without being told what to do elsewhere.</p>`}
  ]
});
</script>
<script>
/* =====================================================================
   5. WIDGETS — widget('name', (el, opts) => {...})
   Each widget owns its element; use box() first to get the frame.
   ===================================================================== */

/* ---- Lecture 1 / 2: lifetime compute of A vs B ---- */
widget('lifetime', (el, o) => {
  box(el, 'Lifetime compute: training plus serving', 'C<sub>life</sub> ≈ 6ND + 2NR for model A (280B params, 300B tokens) and model B (70B, 1.4T). Move the number of tokens served, R.');
  const A={N:280e9,D:300e9}, B={N:70e9,D:1.4e12};
  const cost=(m,R)=>6*m.N*m.D+2*m.N*R;
  const Rb = 3*(B.N*B.D-A.N*A.D)/(A.N-B.N);
  const c=h('div',{class:'ctrls'}); el.append(c);
  const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  const sl=slider(c,{label:'Tokens served R',min:9,max:14,step:.05,value:12,fmt:v=>big(10**v),oninput:draw});
  function draw(){
    const R=10**sl.get(); const xs=[]; for(let e=9;e<=14;e+=.05) xs.push(10**e);
    chart(svg,{w:640,h:o.compact?220:270,x:{min:1e9,max:1e14,log:true,label:'tokens served over the model’s life, R',fmt:v=>big(v)},y:{min:1e23,max:1e26,log:true,label:'total FLOPs'},
      series:[{pts:xs.map(x=>[x,cost(A,x)]),color:'#9B1C1C',label:'A: 280B params, 300B tokens'},{pts:xs.map(x=>[x,cost(B,x)]),color:'#0F766E',label:'B: 70B params, 1.4T tokens'}],
      vlines:[{x:R,color:'#1B2433'},{x:Rb,color:'#64748B',label:'break-even'}], legend:true,
      marks:[{x:R,y:cost(A,R),color:'#9B1C1C'},{x:R,y:cost(B,R),color:'#0F766E'}]});
    const a=cost(A,R), b=cost(B,R);
    ro.innerHTML=`A: <b>${sci(a)}</b> FLOPs &nbsp; B: <b>${sci(b)}</b> FLOPs. ${b<a?`B is cheaper by ${(a/b).toFixed(2)}×`:`A is cheaper by ${(b/a).toFixed(2)}×`}. B costs more to train, but each served token costs 2N: 140 GFLOPs for B against 560 for A, so B wins beyond R ≈ ${big(Rb)} tokens.`;
  }
  draw();
});

/* ---- router: scores, top-k, weights, noise, Switch weighting, shared expert ---- */
widget('router', (el, o) => {
  box(el, 'Route one token', 'Scores s = W<sub>r</sub>h for each expert. Keep the top k, then turn the kept scores into mixing weights.');
  const E = o.compact? 6 : 8;
  const tokens = { keys:[2.1,1.0,0.3,-0.5,0.6,-1.0,0.2,-0.3], cabinet:[0.2,1.8,-0.4,1.5,-0.6,0.1,-1.2,0.4], are:[-0.3,0.4,2.4,0.1,1.9,-0.8,0.0,-0.5], the:[0.5,0.3,0.1,0.4,0.2,0.6,0.35,0.45] };
  let tok='keys', k=2, mode='picked', noise=false, shared=false, eps=new Array(8).fill(0);
  const c1=h('div',{class:'ctrls'}), c2=h('div',{class:'ctrls'}); el.append(c1,c2);
  seg(c1, Object.keys(tokens).map(t=>({label:`“${t}”`,value:t})), tok, v=>{tok=v;draw();}, 'Token');
  slider(c1,{label:'k',min:1,max:3,value:2,oninput:v=>{k=v;draw();}});
  seg(c2,[{label:'Softmax over picked',value:'picked'},{label:'Full softmax (Switch)',value:'full'}],mode,v=>{mode=v;draw();},'Weights');
  const nb=h('button',{class:'btn',type:'button',onclick:()=>{noise=!noise; eps=eps.map(()=>randn()); nb.textContent=noise?'Remove noise':'Add noise'; draw();}},'Add noise');
  const rb=h('button',{class:'btn',type:'button',onclick:()=>{eps=eps.map(()=>randn()); draw();}},'Resample');
  const sb=h('label',{}, h('input',{type:'checkbox',onchange:e=>{shared=e.target.checked;draw();}}),'Shared expert F₀');
  c2.append(nb,rb,sb);
  const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  function draw(){
    const sc = tokens[tok].slice(0,E).map((v,i)=>v + (noise? 0.7*eps[i] : 0));
    const order=[...sc.keys()].sort((a,b)=>sc[b]-sc[a]); const pick=order.slice(0,k);
    const full=softmax(sc); const sub=softmax(pick.map(i=>sc[i]));
    const w = new Array(E).fill(0); pick.forEach((i,j)=> w[i] = mode==='picked'? sub[j] : full[i]);
    svg.setAttribute('viewBox',`0 0 640 ${o.compact?190:210}`); svg.classList.add('chart'); svg.innerHTML='';
    const bw=640/E, base=110, sc0=28;
    svg.append(s('line',{x1:0,x2:640,y1:base,y2:base,stroke:'#1B2433'}));
    sc.forEach((v,i)=>{
      const x=i*bw+bw*.2, wd=bw*.6, isP=pick.includes(i);
      const y=v>=0? base-v*sc0 : base, hh=Math.abs(v)*sc0;
      svg.append(s('rect',{x,y,width:wd,height:hh,rx:3,fill:isP?'#B45309':'#D3D9E0'}));
      svg.append(s('text',{x:x+wd/2,y:v>=0?y-5:y+hh+13,'text-anchor':'middle','font-size':11,fill:'#1B2433'},v.toFixed(2)));
      svg.append(s('text',{x:x+wd/2,y:base+ (v<0? hh+28 : 18),'text-anchor':'middle','font-size':12,'font-weight':isP?700:400,fill:isP?'#B45309':'#4A5568'},`F${i+1}`));
      if (isP) svg.append(s('text',{x:x+wd/2,y:(o.compact?182:200),'text-anchor':'middle','font-size':12,'font-weight':600,fill:'#B45309'},`w=${w[i].toFixed(2)}`));
    });
    const terms = pick.map(i=>`${w[i].toFixed(2)}·F${i+1}(h)`).join(' + ');
    const sumw = pick.reduce((a,i)=>a+w[i],0);
    ro.innerHTML = `y = ${shared?'F₀(h) + ':''}${terms}${o.compact?'':`<br>Weights sum to ${sumw.toFixed(2)}. ${k===1&&mode==='picked'?'With k = 1 and softmax over the picked expert, w = 1 exactly: a constant, so the task loss sends the router <b>no gradient</b>.':mode==='full'?'Full-softmax weights keep a gradient even at k = 1; unpicked experts still get none from the task loss.':'The task loss reaches the router only through the weights of picked experts.'} ${noise?'Noise can change which experts are picked; that is how Shazeer et al. let the router try experts it would skip.':''}`}`;
  }
  draw();
});

/* ---- rotation before quantization ---- */
widget('rotation-quant', (el) => {
  box(el,'Quantize with and without a random rotation','A 32-dimensional vector with a few outlier coordinates. Each coordinate is rounded to b bits on a grid scaled to the largest coordinate. Rotation spreads the energy so the grid is used well.');
  const d=32; let R, x, y;
  const c=h('div',{class:'ctrls'}); el.append(c);
  const bits=slider(c,{label:'Bits per coordinate',min:2,max:8,value:3,oninput:draw});
  const out=slider(c,{label:'Outlier size',min:1,max:30,value:12,oninput:()=>{make();draw();}});
  c.append(h('button',{class:'btn',type:'button',onclick:()=>{R=rot();draw();}},'New rotation'));
  const cols=h('div',{class:'cols'}); el.append(cols); const s1=s('svg'), s2=s('svg'); cols.append(h('div',{},s1), h('div',{},s2));
  const ro=h('div',{class:'readout'}); el.append(ro);
  function rot(){ // random orthogonal by Gram–Schmidt
    const M=[]; for(let i=0;i<d;i++){ let v=Array.from({length:d},randn);
      for(const u of M){ const p=v.reduce((a,vi,j)=>a+vi*u[j],0); v=v.map((vi,j)=>vi-p*u[j]); }
      const n=Math.hypot(...v); M.push(v.map(vi=>vi/n)); } return M; }
  const mul=(M,v)=>M.map(r=>r.reduce((a,rij,j)=>a+rij*v[j],0));
  const mulT=(M,v)=>v.map((_,j)=>M.reduce((a,r,i)=>a+r[j]*v[i],0));
  function make(){ x=Array.from({length:d},()=>randn()*.6); x[3]=out.get(); x[17]=-out.get()*.7; y=Array.from({length:d},randn); }
  function q(v,b){ const m=Math.max(...v.map(Math.abs)); const L=2**b-1; return v.map(t=>{ const u=(t+m)/(2*m); return Math.round(u*L)/L*2*m-m; }); }
  function bars(svg,v,vq,title,color){
    svg.setAttribute('viewBox','0 0 320 170'); svg.classList.add('chart'); svg.innerHTML='';
    const m=Math.max(...x.map(Math.abs))*1.05, bw=300/d, mid=90;
    svg.append(s('text',{x:10,y:14,'font-size':12,'font-weight':600,fill:'#1B2433'},title));
    svg.append(s('line',{x1:10,x2:310,y1:mid,y2:mid,stroke:'#9AA6B4'}));
    v.forEach((t,i)=>{ const hh=Math.abs(t)/m*68; svg.append(s('rect',{x:10+i*bw+1,y:t>0?mid-hh:mid,width:bw-2,height:hh,fill:color,opacity:.85})); 
      const qh=vq[i]/m*68; svg.append(s('line',{x1:10+i*bw,x2:10+(i+1)*bw,y1:mid-qh,y2:mid-qh,stroke:'#1B2433','stroke-width':1.5})); });
    svg.append(s('text',{x:10,y:166,'font-size':10.5,fill:'#4A5568'},'bars: coordinates; black ticks: quantized values'));
  }
  function draw(){
    const b=bits.get(); const xq=q(x,b); const z=mul(R,x); const zq=q(z,b); const xr=mulT(R,zq);
    bars(s1,x,xq,'Original coordinates','#9B1C1C'); bars(s2,z,zq,'After rotation z = Rx','#0F766E');
    const mse=(a,c)=>a.reduce((s0,ai,i)=>s0+(ai-c[i])**2,0)/d; const ip=(a,c)=>a.reduce((s0,ai,i)=>s0+ai*c[i],0);
    const e1=mse(x,xq), e2=mse(x,xr); const t=ip(x,y);
    ro.innerHTML=`Reconstruction error (mean squared): direct <b>${e1.toFixed(4)}</b>, rotate-then-quantize <b>${e2.toFixed(4)}</b> (${(e1/e2).toFixed(1)}× smaller). Inner product with a random y: exact ${t.toFixed(2)}, direct ${ip(xq,y).toFixed(2)}, rotated ${ip(xr,y).toFixed(2)}. ‖Rx‖ = ‖x‖ = ${Math.hypot(...x).toFixed(2)}.`;
  }
  R=rot(); make(); draw();
});

/* ---- attack success vs budget ---- */
widget('asr-curve', (el)=>{
  box(el,'Robustness is a curve, not a number','Two toy defences against 100 behaviours. Defence A resists each attempt well but uniformly; defence B fails easily on 30 behaviours and never on the rest.');
  const pA=Array(100).fill(0.01), pB=[...Array(30).fill(0.3),...Array(70).fill(0)];
  const asr=(p,Q)=>p.reduce((a,pi)=>a+(1-(1-pi)**Q),0)/p.length;
  const c=h('div',{class:'ctrls'}); el.append(c); const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  const sl=slider(c,{label:'Attacker query budget Q',min:0,max:3,step:.02,value:0,fmt:v=>Math.round(10**v),oninput:draw});
  function draw(){ const Q=Math.round(10**sl.get()); const xs=[]; for(let e=0;e<=3;e+=.02) xs.push(10**e);
    chart(svg,{w:640,h:240,x:{min:1,max:1000,log:true,label:'query budget Q',fmt:v=>v>=1?v.toFixed(0):v},y:{min:0,max:1,label:'robust fraction 1 − ASR(Q)',fmt:v=>v.toFixed(1)},
      series:[{pts:xs.map(q=>[q,1-asr(pA,q)]),color:'#9B1C1C',label:'Defence A'},{pts:xs.map(q=>[q,1-asr(pB,q)]),color:'#0F766E',label:'Defence B'}],legend:true,vlines:[{x:Q,color:'#1B2433'}]});

});

/* ---- Chinchilla isoFLOP ---- */
const CHIN={E:1.69,A:406.4,B:410.7,a:0.34,b:0.28};
const chinL=(N,D)=>CHIN.E+CHIN.A*N**-CHIN.a+CHIN.B*D**-CHIN.b;
const chinOpt=C=>{ const G=C/6; const N=(CHIN.a*CHIN.A/(CHIN.b*CHIN.B))**(1/(CHIN.a+CHIN.b))*G**(CHIN.b/(CHIN.a+CHIN.b)); return {N,D:G/N}; };
widget('isoflop',(el)=>{
  box(el,'IsoFLOP curves from the Chinchilla fit','L̂(N, D) = 1.69 + 406.4 N<sup>−0.34</sup> + 410.7 D<sup>−0.28</sup> with D = C/(6N). Each curve fixes compute; its lowest point is the best model size. This parametric fit (Chinchilla’s third approach) puts the optimum at smaller models than the roughly 20 tokens per parameter of their other two approaches and their actual run: estimates vary by fitting method.');
  const c=h('div',{class:'ctrls'}); el.append(c);
  const sl=slider(c,{label:'Compute budget C',min:18,max:25,step:.05,value:Math.log10(5.9e23),fmt:v=>sci(10**v)+' FLOPs',oninput:draw});
  const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  function curve(C){ const pts=[]; for(let e=7;e<=13;e+=.03){ const N=10**e; pts.push([N,chinL(N,C/(6*N))]); } return pts; }
  function draw(){ const C=10**sl.get(); const o=chinOpt(C);
    const ref=[1e19,1e21,1e23,1e25].map(cc=>({pts:curve(cc),color:'#C9CED6',width:1.3}));
    const NA=280e9, NB=70e9;
    chart(svg,{w:640,h:300,x:{min:1e7,max:1e13,log:true,label:'parameters N',fmt:big},y:{min:1.8,max:4,label:'predicted loss (nats)',fmt:v=>v.toFixed(1)},
      series:[...ref,{pts:curve(C),color:'#9B1C1C',width:2.5}],
      marks:[{x:o.N,y:chinL(o.N,o.D),color:'#9B1C1C',label:'optimum'},{x:NA,y:chinL(NA,C/(6*NA)),color:'#1B2433',fill:'#fff',stroke:'#1B2433',r:4,label:'A: 280B',dy:18},{x:NB,y:chinL(NB,C/(6*NB)),color:'#1B2433',fill:'#fff',stroke:'#1B2433',r:4,label:'B: 70B',dx:0,anchor:'middle',dy:20}]});
    ro.innerHTML=`Best size <b>${big(o.N)}</b> parameters on <b>${big(o.D)}</b> tokens (${(o.D/o.N).toFixed(0)} tokens per parameter), loss ${chinL(o.N,o.D).toFixed(3)}. At this budget a 280B model would see ${big(C/(6*NA))} tokens (loss ${chinL(NA,C/(6*NA)).toFixed(3)}); a 70B model ${big(C/(6*NB))} tokens (loss ${chinL(NB,C/(6*NB)).toFixed(3)}). Grey curves: 10¹⁹, 10²¹, 10²³, 10²⁵ FLOPs.`; }
  draw();
});

/* ---- Porian corrections ---- */
widget('porian',(el)=>{
  box(el,'Three corrections that turn 0.835 into 0.497','Allocation exponent a in N* ∝ C<sup>a</sup>, as Porian et al. apply corrections cumulatively to a Kaplan-style setup. Select a step.');
  const st=[{n:'Kaplan-style baseline',a:.835,t:'The reproduction on RefinedWeb starts close to Kaplan’s 0.88.'},
    {n:'Count the output head',a:.706,t:'The head has |V|·d weights. In small models it is a large share of FLOPs, so leaving it out makes small models look cheaper than they are.'},
    {n:'Match warmup to the run',a:.602,t:'A fixed warmup takes a large share of a short run. At fixed compute, larger models get the shortest runs, so they are hurt most at small budgets, which inflates the exponent.'},
    {n:'Tune the optimizer at each scale',a:.497,t:'Retune batch size, learning rate and other settings per scale. The exponent lands on Chinchilla’s 0.5.'}];
  let k=3; const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  const c=h('div',{class:'ctrls'}); el.append(c);
  const dS=slider(c,{label:'Width d',min:7,max:13,step:1,value:9,fmt:v=>2**v,oninput:draw});
  const lS=slider(c,{label:'Blocks L',min:2,max:96,step:2,value:8,oninput:draw});
  const hr=h('div',{class:'readout'}); el.append(hr);
  function draw(){
    svg.setAttribute('viewBox','0 0 640 200'); svg.classList.add('chart'); svg.innerHTML='';
    const y0=170, sc=180; svg.append(s('line',{x1:20,x2:620,y1:y0-.5*sc,y2:y0-.5*sc,stroke:'#0F766E','stroke-dasharray':'4 4'})); svg.append(s('text',{x:22,y:y0-.5*sc-6,'font-size':11,fill:'#0F766E'},'Chinchilla ≈ 0.5'));
    st.forEach((x,i)=>{ const g=s('g',{style:'cursor:pointer',tabindex:0,role:'button','aria-label':x.n}); const X=40+i*150;
      g.append(s('rect',{x:X,y:y0-x.a*sc,width:100,height:x.a*sc,rx:4,fill:i<=k?(i===k?'#9B1C1C':'#C98B8B'):'#E6EAEE'}));
      g.append(s('text',{x:X+50,y:y0-x.a*sc-6,'text-anchor':'middle','font-size':13,'font-weight':600},x.a.toFixed(3)));
      g.append(s('text',{x:X+50,y:y0+16,'text-anchor':'middle','font-size':11},x.n.length>22?x.n.slice(0,20)+'…':x.n));
      g.addEventListener('click',()=>{k=i;draw();}); g.addEventListener('keydown',e=>{if(e.key==='Enter'){k=i;draw();}}); svg.append(g); });
    ro.innerHTML=`<b>${st[k].n}.</b> ${st[k].t} At 10× compute this exponent puts ${(10**st[k].a).toFixed(1)}× into parameters.`;
    const d=2**dS.get(), L=lS.get(), V=50000, head=V*d, body=12*L*d*d;
    hr.innerHTML=`Output head share of weight FLOPs with |V| = 50,000 and body 12Ld²: <b>${(100*head/(head+body)).toFixed(head/(head+body)<.01?2:1)}%</b>. (d = 512, L = 8 gives 50.4%; d = 8,192, L = 80 gives 0.63%.)`;
  }
  draw();
});
</script>
<script>
/* ---- Lecture 3 ---- */
widget('sgd-batch',(el)=>{
  box(el,'Averaging B noisy gradients','Each dot is one minibatch gradient in two coordinates. The cross marks the true gradient; the circle has radius one standard deviation, which shrinks like 1/√B.');
  const svg=s('svg'); el.append(svg); const c=h('div',{class:'ctrls'}); el.append(c);

widget('optim-playground',(el)=>{
  box(el,'Optimizer playground on f(w) = ½(100w₁² + w₂²)','All methods start at (1, 1). Gradient descent and momentum share η; AdaGrad and Adam share η<sub>adaptive</sub>. Momentum uses μ = 0.9; Adam uses β₁ = 0.9, β₂ = 0.999. w₁ (horizontal) is the steep direction.');
  const M={gd:{n:'Gradient descent',c:'#64748B',on:true},mom:{n:'Momentum',c:'#B45309',on:true},ada:{n:'AdaGrad',c:'#0F766E',on:true},adam:{n:'Adam',c:'#9B1C1C',on:true}};
  const c=h('div',{class:'ctrls'}), c2=h('div',{class:'ctrls'}); el.append(c,c2);
  const lr=slider(c,{label:'η',min:-3,max:0,step:.05,value:Math.log10(0.015),fmt:v=>(10**v).toPrecision(2),oninput:draw});
  const lra=slider(c,{label:'η adaptive',min:-3,max:0,step:.05,value:-1,fmt:v=>(10**v).toPrecision(2),oninput:draw});
  const st=slider(c,{label:'Steps',min:10,max:200,step:5,value:60,oninput:draw});
  const nz=slider(c,{label:'Gradient noise σ',min:0,max:5,step:.25,value:0,fmt:v=>v.toFixed(2),oninput:draw});
  Object.entries(M).forEach(([k,m])=>c2.append(h('label',{}, h('input',{type:'checkbox',checked:'',onchange:e=>{m.on=e.target.checked;draw();}}), h('span',{style:`color:${m.c};font-weight:600`},m.n))));
  const cols=h('div',{class:'cols'}); el.append(cols); const s1=s('svg'), s2=s('svg'); cols.append(h('div',{},s1),h('div',{},s2));
  const ro=h('div',{class:'readout'}); el.append(ro);
  const f=w=>.5*(100*w[0]**2+w[1]**2);
  function run(k,eta,T,sig,seed){
    let rng=seed; const rnd=()=>{ rng=(rng*16807)%2147483647; return rng/2147483647; }; const gn=()=>{ const u=rnd()||1e-9,v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
    let w=[1,1], m=[0,0], v=[0,0], s0=[0,0]; const path=[w.slice()], loss=[f(w)];
    for(let t=1;t<=T;t++){ const g=[100*w[0]+sig*gn(), w[1]+sig*gn()];
      if(k==='gd') w=w.map((x,i)=>x-eta*g[i]);
      if(k==='mom'){ m=m.map((x,i)=>.9*x+.1*g[i]); w=w.map((x,i)=>x-eta*m[i]); }
      if(k==='ada'){ s0=s0.map((x,i)=>x+g[i]**2); w=w.map((x,i)=>x-eta*g[i]/Math.sqrt(s0[i]+1e-8)); }
      if(k==='adam'){ m=m.map((x,i)=>.9*x+.1*g[i]); v=v.map((x,i)=>.999*x+.001*g[i]**2); const mh=m.map(x=>x/(1-.9**t)), vh=v.map(x=>x/(1-.999**t)); w=w.map((x,i)=>x-eta*mh[i]/(Math.sqrt(vh[i])+1e-8)); }
      if(!w.every(isFinite)||Math.abs(w[0])>1e6){ path.push([NaN,NaN]); loss.push(Infinity); break; }
      path.push(w.slice()); loss.push(f(w)); }
    return {path,loss};
  }
  function draw(){ const eta=10**lr.get(), etaA=10**lra.get(), T=st.get(), sig=nz.get();
    s1.setAttribute('viewBox','0 0 320 320'); s1.classList.add('chart'); s1.innerHTML='';
    const X=v=>160+v*125, Y=v=>160-v*125;
    s1.append(s('rect',{x:0,y:0,width:320,height:320,fill:'#F7F8FA'}));
    [0.5,2,8,25,60].forEach(cv=>s1.append(s('ellipse',{cx:160,cy:160,rx:Math.sqrt(2*cv/100)*125,ry:Math.sqrt(2*cv)*125,fill:'none',stroke:'#C9CED6'})));
    s1.append(s('text',{x:310,y:174,'text-anchor':'end','font-size':11,fill:'#4A5568'},'w₁'));s1.append(s('text',{x:166,y:14,'font-size':11,fill:'#4A5568'},'w₂'));
    s1.append(s('line',{x1:0,x2:320,y1:160,y2:160,stroke:'#D3D9E0'}));s1.append(s('line',{x1:160,x2:160,y1:0,y2:320,stroke:'#D3D9E0'}));
    const series=[], txt=[];
    Object.entries(M).forEach(([k,m])=>{ if(!m.on) return; const r=run(k,(k==='ada'||k==='adam')?etaA:eta,T,sig,12345);
      const pts=r.path.filter(p=>isFinite(p[0])).map(p=>[Math.max(-1.25,Math.min(1.25,p[0])),Math.max(-1.25,Math.min(1.25,p[1]))]);
      s1.append(s('path',{d:pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(''),fill:'none',stroke:m.c,'stroke-width':1.6,opacity:.9}));
      pts.forEach(p=>s1.append(s('circle',{cx:X(p[0]),cy:Y(p[1]),r:1.6,fill:m.c})));
      series.push({pts:r.loss.map((l,i)=>[i,l]),color:m.c,label:m.n}); const fin=r.loss[r.loss.length-1];
      txt.push(`<span style="color:${m.c};font-weight:600">${m.n}</span> ${isFinite(fin)&&fin<1e6?sci(fin):'diverged'}`); });
    s1.append(s('circle',{cx:X(1),cy:Y(1),r:4,fill:'#1B2433'}));
    chart(s2,{w:320,h:320,margin:{l:48,b:40},x:{min:0,max:T,label:'step'},y:{min:1e-8,max:1e4,log:true,label:'loss f(w)',fmt:v=>'10'+sup(Math.round(Math.log10(v)))},series,legend:false});
    ro.innerHTML=`Final loss: ${txt.join(' &nbsp; ')}. ${eta>0.02?'With η > 0.02, plain GD diverges along w₁ because |1 − 100η| > 1; momentum stays stable up to η ≈ 0.38.':'GD is stable here but crawls along w₂, shrinking it by only (1 − η) per step. Try η = 0.05: GD diverges, momentum does not.'}`; }
  draw();
});

widget('muon-svd',(el)=>{
  box(el,'What polar(G) = UVᵀ does to a matrix','Set a 2×2 gradient matrix G. Left: G maps the unit circle to an ellipse with semi-axes σ₁u₁ and σ₂u₂. Right: UVᵀ keeps those directions but maps the circle to itself. Newton–Schulz iterations approximate UVᵀ without an SVD.');
  const G=[[1.6,0.6],[0.2,0.5]]; const c=h('div',{class:'ctrls'}); el.append(c);
  [['g₁₁',0,0],['g₁₂',0,1],['g₂₁',1,0],['g₂₂',1,1]].forEach(([l,i,j])=>slider(c,{label:l,min:-2,max:2,step:.05,value:G[i][j],fmt:v=>v.toFixed(2),oninput:v=>{G[i][j]=v;draw();}}));
  const ns=slider(c,{label:'Newton–Schulz steps',min:0,max:12,step:1,value:5,oninput:draw});
  const cols=h('div',{class:'cols'}); el.append(cols); const s1=s('svg'),s2=s('svg'); cols.append(h('div',{},s1),h('div',{},s2)); const ro=h('div',{class:'readout'}); el.append(ro);
  const mm=(A,B)=>[[A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],[A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]];
  const tr=A=>[[A[0][0],A[1][0]],[A[0][1],A[1][1]]];
  function svd(A){ const M=mm(tr(A),A); const th=.5*Math.atan2(2*M[0][1],M[0][0]-M[1][1]);
    let v1=[Math.cos(th),Math.sin(th)], v2=[-Math.sin(th),Math.cos(th)];
    const Av=v=>[A[0][0]*v[0]+A[0][1]*v[1],A[1][0]*v[0]+A[1][1]*v[1]];
    let a1=Av(v1),a2=Av(v2); let s1v=Math.hypot(...a1), s2v=Math.hypot(...a2);
    if(s2v>s1v){ [v1,v2]=[v2,v1]; [a1,a2]=[a2,a1]; [s1v,s2v]=[s2v,s1v]; }
    const u1=s1v>1e-9?a1.map(x=>x/s1v):[1,0]; let u2=s2v>1e-9?a2.map(x=>x/s2v):[-u1[1],u1[0]];
    return {s:[s1v,s2v],u:[u1,u2],v:[v1,v2]}; }
  function panel(svg,A,title,axes){ svg.setAttribute('viewBox','0 0 320 300'); svg.classList.add('chart'); svg.innerHTML='';
    const S=55, cx=160, cy=150; svg.append(s('text',{x:10,y:16,'font-size':12,'font-weight':600},title));
    svg.append(s('circle',{cx,cy,r:S,fill:'none',stroke:'#C9CED6','stroke-dasharray':'4 3'}));
    const pts=[]; for(let i=0;i<=72;i++){ const t=i/72*2*Math.PI, x=[Math.cos(t),Math.sin(t)]; const y=[A[0][0]*x[0]+A[0][1]*x[1],A[1][0]*x[0]+A[1][1]*x[1]]; pts.push([cx+y[0]*S,cy-y[1]*S]); }
    svg.append(s('path',{d:pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(''),fill:'rgba(15,118,110,.12)',stroke:'#0F766E','stroke-width':2}));
    axes.forEach(([v,col,l])=>{ svg.append(s('line',{x1:cx,y1:cy,x2:cx+v[0]*S,y2:cy-v[1]*S,stroke:col,'stroke-width':2.5})); svg.append(s('text',{x:cx+v[0]*S*1.08+4,y:cy-v[1]*S*1.08,'font-size':11,fill:col},l)); }); }
  function draw(){ const d=svd(G); const P=mm([[d.u[0][0],d.u[1][0]],[d.u[0][1],d.u[1][1]]], [[d.v[0][0],d.v[0][1]],[d.v[1][0],d.v[1][1]]]);
    panel(s1,G,'G = UΣVᵀ',[[d.u[0].map(x=>x*d.s[0]),'#9B1C1C','σ₁u₁'],[d.u[1].map(x=>x*d.s[1]),'#B45309','σ₂u₂']]);
    panel(s2,P,'polar(G) = UVᵀ',[[d.u[0],'#9B1C1C','u₁'],[d.u[1],'#B45309','u₂']]);
    const fn=Math.hypot(G[0][0],G[0][1],G[1][0],G[1][1])||1; let X=G.map(r=>r.map(x=>x/fn));
    for(let k=0;k<ns.get();k++){ const XXtX=mm(mm(X,tr(X)),X); X=X.map((r,i)=>r.map((x,j)=>1.5*x-.5*XXtX[i][j])); }
    const dx=svd(X);
    ro.innerHTML=`Singular values of G: <b>${d.s[0].toFixed(3)}</b>, <b>${d.s[1].toFixed(3)}</b> → of UVᵀ: 1, 1. polar(G) = [[${P[0].map(x=>x.toFixed(2)).join(', ')}], [${P[1].map(x=>x.toFixed(2)).join(', ')}]]. After ${ns.get()} Newton–Schulz step${ns.get()===1?'':'s'} (X ← 1.5X − 0.5XXᵀX from G/‖G‖<sub>F</sub>), singular values are ${dx.s[0].toFixed(3)} and ${dx.s[1].toFixed(3)}.`; }
  draw();
});

widget('balance-sim',(el)=>{

  const E=8,T=64,k=2,gam=.08; let bias=new Array(E).fill(0), method='none', hist=[];
  const c=h('div',{class:'ctrls'}),c2=h('div',{class:'ctrls'}); el.append(c,c2);
  const sk=slider(c,{label:'Preference skew',min:0,max:2,step:.1,value:1.2,fmt:v=>v.toFixed(1),oninput:()=>batch(1)});

  seg(c2,[{label:'No balancing',value:'none'},{label:'Router biases',value:'bias'}],'none',v=>{method=v; if(v==='none') bias.fill(0); hist=[]; batch(1);},'Method');
  c2.append(h('button',{class:'btn',type:'button',onclick:()=>batch(1)},'Run one batch'), h('button',{class:'btn primary',type:'button',onclick:()=>batch(25)},'Run 25 batches'), h('button',{class:'btn',type:'button',onclick:()=>{bias.fill(0);hist=[];batch(1);}},'Reset biases'));

    const load=new Array(E).fill(0), imp=new Array(E).fill(0);
    for(let t=0;t<T;t++){ const sc=pref.map(p=>p+randn()); const sel=sc.map((x,e)=>x+bias[e]);
      const pick=[...sel.keys()].sort((a,b)=>sel[b]-sel[a]).slice(0,k); const w=softmax(pick.map(e=>sc[e]));

    s1.append(s('line',{x1:10,x2:315,y1:base-16*sc,y2:base-16*sc,stroke:'#0F766E','stroke-dasharray':'4 4'}));
    s1.append(s('line',{x1:10,x2:315,y1:base-C*sc,y2:base-C*sc,stroke:'#9B1C1C'}));
    s1.append(s('line',{x1:10,x2:315,y1:base,y2:base,stroke:'#1B2433'}));
    s1.append(s('text',{x:12,y:12,'font-size':10.5,fill:'#4A5568'},'bars: load; dots: importance × 2; faded red: dropped'));
    chart(s2,{w:320,h:230,margin:{l:44},x:{min:0,max:60,label:'recent batches'},y:{min:0,max:4,label:'max / mean load',fmt:v=>v.toFixed(0)},series:[{pts:hist.map((v,i)=>[i,v]),color:'#B45309'}],hlines:[{y:1,color:'#0F766E',label:'perfect'}]});
    const mx=Math.max(...load);

widget('attn-patterns',(el)=>{
  box(el,'Which cached entries does each query read?','32 positions. Rows are queries, columns are keys. Dark cells are read; teal blocks are learned summaries.');
  const N=32; let mode='window'; const idx=Array.from({length:N},()=>Array.from({length:N},()=>Math.random()));
  for(let t=0;t<N;t++){ idx[t][3]+=.6; idx[t][11]+=.5; }
  const c=h('div',{class:'ctrls'}), c2=h('div',{class:'ctrls'}); el.append(c,c2);
  seg(c,[{label:'Full',value:'full'},{label:'Sliding window',value:'window'},{label:'DSA top-K',value:'dsa'},{label:'Summaries + window',value:'comp'}],mode,v=>{mode=v;draw();},'Pattern');
  const W=slider(c2,{label:'Window W',min:2,max:16,step:1,value:6,oninput:draw});
  const K=slider(c2,{label:'Top K',min:1,max:12,step:1,value:6,oninput:draw});
  const B=slider(c2,{label:'Block c',min:2,max:8,step:1,value:4,oninput:draw});
  const Ls=slider(c2,{label:'Layers stacked',min:1,max:8,step:1,value:3,oninput:draw});
  const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  function reads(t){ const w=W.get(),k=K.get(),cb=B.get();
    if(mode==='full') return {tok:[...Array(t+1).keys()],sum:[]};
    if(mode==='window') return {tok:[...Array(t+1).keys()].filter(j=>j>t-w),sum:[]};
    if(mode==='dsa'){ const cand=[...Array(t+1).keys()]; return {tok:cand.sort((a,b)=>idx[t][b]-idx[t][a]).slice(0,k),sum:[]}; }
    const ready=Math.floor((t+1)/cb); const sum=[...Array(ready).keys()]; return {tok:[...Array(t+1).keys()].filter(j=>j>t-w && j>=0),sum}; }
  function draw(){ svg.setAttribute('viewBox','0 0 660 360'); svg.classList.add('chart'); svg.innerHTML='';
    const cs=10, x0=40, y0=20; let total=0, stored=N;
    for(let t=0;t<N;t++){ const r=reads(t); total+=r.tok.length+r.sum.length;
      for(let j=0;j<N;j++) svg.append(s('rect',{x:x0+j*cs,y:y0+t*cs,width:cs-1,height:cs-1,fill:j>t?'#FFFFFF':'#EEF1F4'}));
      r.sum.forEach(b=>svg.append(s('rect',{x:x0+b*B.get()*cs,y:y0+t*cs+1,width:B.get()*cs-1,height:cs-3,fill:'#0F766E',opacity:.55,rx:2})));
      r.tok.forEach(j=>svg.append(s('rect',{x:x0+j*cs,y:y0+t*cs,width:cs-1,height:cs-1,fill:'#1B2433'}))); }
    svg.append(s('text',{x:x0,y:y0+N*cs+16,'font-size':11,fill:'#4A5568'},'keys and values →'));
    svg.append(s('text',{x:x0-6,y:y0+8,'font-size':11,fill:'#4A5568','text-anchor':'end'},'q₁'));
    svg.append(s('text',{x:x0-6,y:y0+N*cs,'font-size':11,fill:'#4A5568','text-anchor':'end'},'q₃₂'));
    // right: explanation panel with reach diagram for windows
    const rx=400; const w=W.get(), L=Ls.get();
    let text;
    if(mode==='window'){ const reach=Math.min(N, L*(w-1)+1);
      for(let l=0;l<=L;l++){ const y=y0+20+(L-l)*(240/L); svg.append(s('text',{x:rx,y:y+4,'font-size':10.5,fill:'#4A5568'},l===0?'input':'layer '+l));
        for(let j=0;j<N;j++){ const reached = j>=N-Math.min(N,l*(w-1)+1); svg.append(s('rect',{x:rx+44+j*6.5,y:y-4,width:5.5,height:8,fill:reached?'#9B1C1C':'#D3D9E0'})); } }
      text=`Each layer sees its last W = ${w} positions. After ${L} stacked layers the last token can be influenced by <b>${reach}</b> positions: about L·(W − 1) + 1. Mistral 7B: W = 4,096 and 32 layers give about 131K tokens of reach.`;
      stored=Math.min(N,w);
    } else {
      const info={full:['Every earlier entry is stored and read.','Reads grow linearly per token, quadratically per sequence.'],
        dsa:['A lightning indexer scores every stored entry; main attention reads only the top K.','Every entry stays stored, so a later query can still pick one an earlier query skipped.'],
        comp:['Each complete block of c positions becomes one learned summary (teal), plus the last W positions uncompressed.','Like HCA: summaries replace old entries, so stored entries shrink to about T/c + W. Merged detail cannot be recovered.']}[mode];
      info.forEach((tx,i)=>{ const fo=document.createElementNS(SVGNS,'foreignObject'); fo.setAttribute('x',rx); fo.setAttribute('y',y0+i*90); fo.setAttribute('width',250); fo.setAttribute('height',90); fo.innerHTML=`<div xmlns="http://www.w3.org/1999/xhtml" style="font:13px var(--sans);color:#1B2433;line-height:1.4">${tx}</div>`; svg.append(fo); });
      if(mode==='comp') stored=Math.floor(N/B.get())+w; if(mode==='dsa') stored=N;
      text='';
    }
    ro.innerHTML=`${text} Entries read, summed over all 32 queries: <b>${total}</b> (full attention: ${N*(N+1)/2}). Entries stored for the last query: <b>${stored}</b> of ${N}.`; }
  draw();
});

  function draw(){ svg.setAttribute('viewBox','0 0 660 220'); svg.classList.add('chart'); svg.innerHTML='';

    for(let j=0;j<g;j++){ const kx=30+(j+.5)*(600/g)-28; svg.append(s('rect',{x:kx,y:120,width:56,height:36,rx:5,fill:cols[j]+'22',stroke:cols[j],'stroke-width':2})); svg.append(s('text',{x:kx+28,y:142,'text-anchor':'middle','font-size':12},'k,v'+(g>1?j+1:''))); }
    svg.append(s('text',{x:630,y:182,'text-anchor':'end','font-size':11,fill:'#4A5568'},'only the bottom row is cached'));
    ro.innerHTML=`Cache per token per layer: <b>${g}/8</b> of MHA. Numbers read per decode step: ${g}/8 of MHA. Multiply-adds: unchanged, every query head still scores every position.`; }

widget('mla-bars',(el)=>{
  box(el,'Numbers cached per entry, per layer, DeepSeek-V3 shape','128 heads, key/value content width 128, latent d<sub>c</sub> = 512, 2 bytes per number. Below: one head’s decode cost with and without the query-absorption trick.');
  const D=[['MHA (128 KV heads)',32768],['GQA-8',2048],['MQA (1 KV head)',256],['MLA: 512 latent + 64 RoPE',576]];
  const mx=Math.log10(32768);
  el.append(h('div',{html:`<table class="t"><tbody>${D.map(([n,v],i)=>`<tr><td style="width:13rem">${n}</td><td><div style="height:16px;border-radius:3px;width:${(100*Math.log10(v)/mx).toFixed(1)}%;background:${i===3?'#9B1C1C':'#9AA6B4'}"></div></td><td class="r" style="width:9rem">${v.toLocaleString()} · ${bytes(v*2)}</td></tr>`).join('')}</tbody></table><p class="small">Bars on a log scale. MLA is 3.6× smaller than GQA-8 and 57× smaller than MHA. Source: Zhao et al. (2025), Table 1, recomputed from configurations.</p>`}));
  const c=h('div',{class:'ctrls'}); el.append(c); const svg=s('svg'); el.append(svg);
  const t=slider(c,{label:'Cached positions T',min:2,max:6,step:.05,value:4,fmt:v=>big(10**v),oninput:draw});
  function draw(){ const dc=512,dk=128,dv=128; const xs=[]; for(let e=2;e<=6;e+=.05) xs.push(10**e);
    const nat=T=>T*dc*(dk+dv)+T*(dk+dv), abs=T=>dc*dk+2*T*dc+dc*dv; const T=10**t.get();
    chart(svg,{w:640,h:230,x:{min:100,max:1e6,log:true,label:'cached positions T',fmt:big},y:{min:1e4,max:1e12,log:true,label:'multiply-adds per head'},
      series:[{pts:xs.map(x=>[x,nat(x)]),color:'#64748B',label:'rebuild every k, v: O(Td²)'},{pts:xs.map(x=>[x,abs(x)]),color:'#9B1C1C',label:'absorb into query and output: O(d² + Td)'}],legend:true,
      marks:[{x:T,y:nat(T),color:'#64748B'},{x:T,y:abs(T),color:'#9B1C1C',label:`${(nat(T)/abs(T)).toFixed(0)}× fewer`,dy:18}]}); }
  draw();
});

widget('rope',(el)=>{
  box(el,'Rotary position embedding','Left: one coordinate pair. The query is rotated by tθ and the key by jθ. Right: a score summed over four pairs with different rates, as a function of the offset t − j.');
  const c=h('div',{class:'ctrls'}); el.append(c);
  const tq=slider(c,{label:'Query position t',min:0,max:40,step:1,value:12,oninput:draw});
  const jk=slider(c,{label:'Key position j',min:0,max:40,step:1,value:7,oninput:draw});
  c.append(h('button',{class:'btn',type:'button',onclick:()=>{ if(tq.get()<=36&&jk.get()<=36){ tq.set(tq.get()+4); jk.set(jk.get()+4); draw(); } }},'Shift both by 4'));
  const cols=h('div',{class:'cols'}); el.append(cols); const s1=s('svg'),s2=s('svg'); cols.append(h('div',{},s1),h('div',{},s2)); const ro=h('div',{class:'readout'}); el.append(ro);
  const th=[.3,.12,.05,.02], q0=[[1,.2],[.8,.5],[.6,-.4],[.9,.1]], k0=[[.9,.3],[.7,.4],[.5,-.2],[.8,.3]];
  const rot=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a), v[0]*Math.sin(a)+v[1]*Math.cos(a)];
  const score=(t,j)=>th.reduce((a,w,i)=>{ const q=rot(q0[i],t*w), k=rot(k0[i],j*w); return a+q[0]*k[0]+q[1]*k[1]; },0);
  function draw(){ const t=tq.get(), j=jk.get();
    s1.setAttribute('viewBox','0 0 320 260'); s1.classList.add('chart'); s1.innerHTML='';
    const cx=160,cy=130,S=95; s1.append(s('circle',{cx,cy,r:S,fill:'none',stroke:'#D3D9E0'}));
    const q=rot(q0[0],t*th[0]), k=rot(k0[0],j*th[0]);
    [[q,'#9B1C1C','q̂ₜ'],[k,'#0F766E','k̂ⱼ']].forEach(([v,col,l])=>{ const n=Math.hypot(...v); s1.append(s('line',{x1:cx,y1:cy,x2:cx+v[0]/n*S,y2:cy-v[1]/n*S,stroke:col,'stroke-width':3})); s1.append(s('text',{x:cx+v[0]/n*S*1.12,y:cy-v[1]/n*S*1.12+4,'text-anchor':'middle','font-size':13,fill:col,'font-weight':600},l)); });
    s1.append(s('text',{x:10,y:252,'font-size':11,fill:'#4A5568'},`angle between them depends on (t − j)θ = ${((t-j)*th[0]).toFixed(2)} rad`));
    const offs=[]; for(let o=-40;o<=40;o++) offs.push([o,score(o,0)]);
    chart(s2,{w:320,h:260,margin:{l:40},x:{min:-40,max:40,label:'offset t − j'},y:{min:-4,max:4,label:'score',fmt:v=>v.toFixed(0)},series:[{pts:offs,color:'#0F766E'}],marks:[{x:t-j,y:score(t,j),label:`${score(t,j).toFixed(3)}`}]});
    ro.innerHTML=`Score q̂ₜᵀk̂ⱼ at t = ${t}, j = ${j}: <b>${score(t,j).toFixed(4)}</b>. Shift both positions and it does not change: the score depends only on t − j = ${t-j}.`; }
  draw();
});
</script>
<script>
/* ---- widgets added for full slide coverage and the homework page ---- */

    if(top) svg.append(s('text',{x:x+w/2,y:i===0?y+62:y+64,'text-anchor':'middle','font-size':11,fill:'#9B1C1C'},top)); });
  [[200,34,250,72],[200,120,250,82],[400,77,420,77],[580,77,600,77]].forEach(([a,b2,c,d])=>svg.append(s('path',{d:`M${a} ${b2} L${c-2} ${d}`,stroke:'#1B2433','stroke-width':1.5,'marker-end':'url(#pah)'})));
});

  draw();

widget('lr-schematic',(el)=>{
  box(el,'Same compute, three learning rates','A toy run: noisy SGD on a narrow valley, the same number of steps for each learning rate.');
  const svg=s('svg'); el.append(svg); const c=h('div',{class:'ctrls'}); el.append(c);
  c.append(h('button',{class:'btn',type:'button',onclick:draw},'Rerun'));
  function run(lr){ let w=[2,2]; const out=[]; for(let t=0;t<300;t++){ const g=[20*w[0]+randn()*.6, w[1]+randn()*.6]; w=[w[0]-lr*g[0], w[1]-lr*g[1]]; const L=.5*(20*w[0]**2+w[1]**2); out.push([t,Math.min(L,1e3)]); if(!isFinite(L)) break; } return out; }
  function draw(){ chart(svg,{w:640,h:240,x:{min:0,max:300,label:'training steps (fixed budget)'},y:{min:1e-3,max:1e3,log:true,label:'training loss'},
      series:[{pts:run(.004),color:'#64748B',label:'too small'},{pts:run(.098),color:'#B45309',label:'too large'},{pts:run(.05),color:'#0F766E',label:'well tuned'}],legend:true}); }
  draw();
});

widget('loss-contours',(el)=>{
  box(el,'Loss contours and the budget line','Contours of the Chinchilla fit L̂(N, D) over parameters and tokens (log axes). The straight line is C = 6ND; the dot is where it touches the lowest contour.');
  const c=h('div',{class:'ctrls'}); el.append(c); const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  const sl=slider(c,{label:'Compute C',min:19,max:25,step:.1,value:23,fmt:v=>sci(10**v)+' FLOPs',oninput:draw});
  function draw(){ const C=10**sl.get(); const o=chinOpt(C); const L0=chinL(o.N,o.D);
    const series=[]; const levels=[2.0,2.1,2.2,2.4,2.7,3.1,3.6];
    levels.forEach(Lv=>{ const pts=[]; for(let e=7;e<=13;e+=.02){ const N=10**e; const r=Lv-CHIN.E-CHIN.A*N**-CHIN.a; if(r<=0) continue; const D=(CHIN.B/r)**(1/CHIN.b); if(D<=1e18) pts.push([N,D]); } series.push({pts,color:'#C9CED6',width:1.2}); });
    series.push({pts:[[1e7,C/6e7],[1e13,C/6e13]],color:'#9B1C1C',width:2});
    const lv=[]; for(let e=7;e<=13;e+=.02){ const N=10**e; const r=L0-CHIN.E-CHIN.A*N**-CHIN.a; if(r>0) lv.push([N,(CHIN.B/r)**(1/CHIN.b)]); }
    series.push({pts:lv,color:'#0F766E',width:2});
    chart(svg,{w:640,h:300,x:{min:1e7,max:1e13,log:true,label:'parameters N',fmt:big},y:{min:1e8,max:1e15,log:true,label:'training tokens D',fmt:big},series,marks:[{x:o.N,y:o.D,label:'optimum'}]});
    ro.innerHTML=`Grey: contours at loss ${levels.join(', ')}. Teal: the contour through the optimum (loss ${L0.toFixed(3)}). Red: the budget line. At the tangency, N = ${big(o.N)}, D = ${big(o.D)}; there αAN<sup>−α</sup> = ${(CHIN.a*CHIN.A*o.N**-CHIN.a).toFixed(4)} and βBD<sup>−β</sup> = ${(CHIN.b*CHIN.B*o.D**-CHIN.b).toFixed(4)}.`; }
  draw();
});

widget('optim-tree',(el)=>{
  box(el,'Optimizers in deep learning','Each optimizer builds on ideas from earlier ones. Select one to see what it adds.');
  const N={gd:['Gradient descent',12,60,'Step against the full gradient: the best step in a Euclidean ball.'],sgd:['SGD',190,60,'Estimate the gradient from a random batch: unbiased, variance ∝ 1/B.'],
    ada:['AdaGrad',340,20,'A per-coordinate step size from the history of squared gradients.'],mom:['Momentum',340,100,'Average gradients over time; zigzags cancel and noise shrinks.'],
    adam:['Adam',490,60,'Momentum plus AdaGrad’s scaling, averaged rather than summed, with bias correction.'],sh:['Shampoo',640,10,'Matrix-aware preconditioning of each layer (named in the slides; not covered in detail).'],
    soap:['SOAP',640,60,'Matrix-aware method built on Shampoo (named in the slides; not covered in detail).'],muon:['Muon',640,110,'Orthogonalised momentum: steepest descent in the spectral norm.']};
  const E=[['gd','sgd'],['sgd','ada'],['sgd','mom'],['ada','adam'],['mom','adam'],['adam','sh'],['adam','soap'],['adam','muon']];
  const svg=s('svg',{viewBox:'0 0 760 150'}); svg.classList.add('chart'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);

  const draw=k=>{ $$('g',svg).forEach(g=>g.querySelector('rect').setAttribute('fill',g.dataset.k===k?'#F6E6E6':'#fff')); ro.innerHTML=`<b>${N[k][0]}.</b> ${N[k][3]}`; };
  Object.entries(N).forEach(([k,[n,x,y]])=>{ const g=s('g',{style:'cursor:pointer',tabindex:0,role:'button','aria-label':n}); g.dataset.k=k;
    const bw=k==='gd'?145:100; g.append(s('rect',{x,y,width:bw,height:32,rx:6,fill:'#fff',stroke:'#1B2433'})); g.append(s('text',{x:x+bw/2,y:y+21,'text-anchor':'middle','font-size':12.5,'font-weight':600},n));

  draw('gd');
});

widget('noisy-load',(el)=>{
  box(el,'A smooth estimate of load','Probability that expert e is picked, q<sub>e</sub> = Φ((s<sub>e</sub> − κ<sub>e</sub>)/σ<sub>e</sub>), as its score s<sub>e</sub> varies. Without noise this would be a step: no gradient.');
  const c=h('div',{class:'ctrls'}); el.append(c); const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  const kap=slider(c,{label:'Threshold κₑ',min:-2,max:2,step:.1,value:.5,fmt:v=>v.toFixed(1),oninput:draw});
  const sig=slider(c,{label:'Noise scale σₑ',min:.05,max:2,step:.05,value:.6,fmt:v=>v.toFixed(2),oninput:draw});
  const se=slider(c,{label:'Score sₑ',min:-3,max:3,step:.05,value:0.9,fmt:v=>v.toFixed(2),oninput:draw});
  const erf=x=>{ const t=1/(1+.3275911*Math.abs(x)); const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x); return x>=0?y:-y; };
  const Phi=z=>.5*(1+erf(z/Math.SQRT2)); const phi=z=>Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);
  function draw(){ const k=kap.get(), sg=sig.get(), sv=se.get(); const pts=[],step=[]; for(let x=-3;x<=3;x+=.02){ pts.push([x,Phi((x-k)/sg)]); step.push([x,x>k?1:0]); }
    chart(svg,{w:640,h:220,x:{min:-3,max:3,label:'router score sₑ'},y:{min:0,max:1,label:'Pr[picked]',fmt:v=>v.toFixed(1)},series:[{pts:step,color:'#C9CED6',dash:'4 4'},{pts,color:'#B45309'}],marks:[{x:sv,y:Phi((sv-k)/sg),label:`qₑ = ${Phi((sv-k)/sg).toFixed(2)}`}],vlines:[{x:k,color:'#64748B',label:'κₑ'}]});
    ro.innerHTML=`Slope ∂qₑ/∂sₑ = φ((sₑ − κₑ)/σₑ)/σₑ = <b>${(phi((sv-k)/sg)/sg).toFixed(3)}</b>: this is the gradient the load penalty sends to the router. Summing qₑ(h) over tokens gives the estimated load N̂ₑ.`; }
  draw();
});

widget('second-choice',(el)=>{
  box(el,'GShard’s random second choice','The slide’s four tokens. Each first choice always goes; the second goes with probability 2w<sub>b</sub>. Edit the second-choice weights.');
  const wb=[.1,.2,.4,.5]; const c=h('div',{class:'ctrls'}); el.append(c); const ro=h('div'); el.append(ro); let draws=null;
  wb.forEach((w,i)=>slider(c,{label:`token ${i+1} w_b`,min:0,max:.5,step:.05,value:w,fmt:v=>v.toFixed(2),oninput:v=>{wb[i]=v;draws=null;draw();}}));
  c.append(h('button',{class:'btn',type:'button',onclick:()=>{draws=wb.map(w=>Math.random()<2*w);draw();}},'Sample one routing'));
  function draw(){ const exp=4+wb.reduce((a,w)=>a+2*w,0);
    ro.innerHTML=`<table class="t"><thead><tr><th>Token</th><th class="r">w<sub>a</sub></th><th class="r">w<sub>b</sub></th><th class="r">Pr[send to b] = 2w<sub>b</sub></th>${draws?'<th>This draw</th>':''}</tr></thead><tbody>${wb.map((w,i)=>`<tr><td>${i+1}</td><td class="r">${(1-w).toFixed(2)}</td><td class="r">${w.toFixed(2)}</td><td class="r">${Math.round(200*w)}%</td>${draws?`<td>${draws[i]?'a and b':'a only: y = w<sub>a</sub>F<sub>a</sub>(h)'}</td>`:''}</tr>`).join('')}</tbody></table>
    <div class="readout">Top-2 would use 8 slots; this rule uses <b>${exp.toFixed(1)}</b> on average${draws?`, and ${4+draws.filter(Boolean).length} in this draw`:''}. Low-weight second choices are usually skipped.</div>`; }

});
