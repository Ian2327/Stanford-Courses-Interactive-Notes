widget('hw2-compute',(el)=>{
  box(el,'Explore Problem 2','Total compute C<sub>T</sub>(N, D(N)) = 6N·D(N) + 2NT for the loss target ℓ. The red dot is the minimiser N<sub>T</sub>; the grey line marks N<sub>0</sub>, the T = 0 optimum. Constants loosely follow the Chinchilla fit.');
  const a=406.4,b=410.7,al=.34,be=.28; const c=h('div',{class:'ctrls'}); el.append(c); const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  const lv=slider(c,{label:'Excess-loss target ℓ',min:.15,max:.6,step:.01,value:.3,fmt:v=>v.toFixed(2),oninput:draw});
  const Tv=slider(c,{label:'Inference tokens T',min:9,max:15,step:.05,value:12,fmt:v=>big(10**v),oninput:draw});
  const sv=slider(c,{label:'Smaller model Nₛ / N₀',min:.3,max:.99,step:.01,value:.6,fmt:v=>v.toFixed(2),oninput:draw});
  function draw(){ const l=lv.get(), T=10**Tv.get(); const Nmin=(a/l)**(1/al); const D=N=>(b/(l-a*N**-al))**(1/be); const C=(N,t)=>6*N*D(N)+2*N*t;
    const N0=(a*(al+be)/(be*l))**(1/al); const pts=[]; let best=null;
    for(let e=Math.log10(Nmin)+.005;e<=Math.log10(Nmin)+3;e+=.005){ const N=10**e, v=C(N,T); pts.push([N,v]); if(!best||v<best[1]) best=[N,v]; }
    const p0=pts.map(([N])=>[N,C(N,0)]);
    const Ns=sv.get()*N0; const Tb=3*(N0*D(N0)-Ns*D(Ns))/(Ns-N0); const ok=Ns>Nmin;
    const ys=pts.map(p=>p[1]).concat(p0.map(p=>p[1])); const ymin=Math.min(...ys)/1.5, ymax=Math.min(Math.max(...ys), Math.min(...ys)*1e3);
    chart(svg,{w:640,h:280,x:{min:Nmin,max:Nmin*1000,log:true,label:'parameters N (N > N_min)',fmt:big},y:{min:ymin,max:ymax,log:true,label:'total FLOPs'},
      series:[{pts:p0,color:'#C9CED6',label:'T = 0'},{pts,color:'#9B1C1C',label:`T = ${big(T)}`}],legend:true,vlines:[{x:N0,color:'#64748B',label:'N₀'}],marks:[{x:best[0],y:best[1],label:'N_T'}]});
    ro.innerHTML=`N<sub>min</sub> = ${big(Nmin)}, N<sub>0</sub> = ${big(N0)}, D<sub>0</sub> = ${big(D(N0))}; check: aN₀<sup>−α</sup>/(bD₀<sup>−β</sup>) = ${((a*N0**-al)/(b*D(N0)**-be)).toFixed(3)} = β/α = ${(be/al).toFixed(3)}.<br>
      With T = ${big(T)}: N<sub>T</sub> ≈ <b>${big(best[0])}</b>, D<sub>T</sub> ≈ <b>${big(D(best[0]))}</b> (part (c): smaller N, more D as T grows).<br>
      ${ok?`Part (d) with Nₛ = ${big(Ns)}: T<sub>break</sub> = <b>${sci(Tb)}</b> tokens (T = ${sci(T)}). ${T<Tb?'Here T < T<sub>break</sub>, so (N₀, D₀) is cheaper.':'Here T > T<sub>break</sub>, so the smaller model (Nₛ, Dₛ) is cheaper.'}`:'Nₛ must exceed N<sub>min</sub>; raise the ratio.'}`; }
  draw();
});
</script>
<script>
/* ---- Lecture 7 widgets ---- */
const REDUCED = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function animLoop(el, step){ let last=performance.now(), id; const f=now=>{ if(!el.isConnected) return; const dt=now-last; last=now; if(step(dt)!==false) id=requestAnimationFrame(f); }; id=requestAnimationFrame(f); return ()=>cancelAnimationFrame(id); }
const rot2=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a), v[0]*Math.sin(a)+v[1]*Math.cos(a)];
const dot=(a,b)=>a.reduce((s0,x,i)=>s0+x*b[i],0);
function seeded(seed){ let r=seed; return ()=>{ r=(r*16807)%2147483647; return r/2147483647; }; }

widget('perm-invariance',(el)=>{
  box(el,'Same words, different order','Layer 1 of one attention head, with hand-built 2-number embeddings. The query is the final “.”; bars show its attention weights.');
  const E={dog:[1,.2],bites:[.1,1],man:[.8,-.5],'.':[.5,.5]};
  const S1=['dog','bites','man','.'], S2=['man','bites','dog','.']; let pos=false;
  const c=h('div',{class:'ctrls'}); el.append(c);
  seg(c,[{label:'No position information',value:false},{label:'With RoPE (θ = 0.6 rad per token)',value:true}],false,v=>{pos=v;draw();});
  const out=h('div',{class:'cols'}); el.append(out); const ro=h('div',{class:'readout'}); el.append(ro);
  function read(S){ const T=S.length, qv=E[S[T-1]]; const q=pos?rot2(qv,(T-1)*.6):qv;
    const sc=S.map((w,j)=>dot(q,pos?rot2(E[w],j*.6):E[w])); const a=softmax(sc); const o=[0,1].map(c0=>S.reduce((s0,w,j)=>s0+a[j]*E[w][c0],0)); return {a,o}; }
  function panel(S,r){ return `<div><div style="font-family:var(--serif);font-size:1.15rem;margin-bottom:.4rem">${S.map(w=>`<span class="tok" style="cursor:default">${w}</span>`).join('')}</div>
    ${S.map((w,j)=>`<div style="display:flex;align-items:center;gap:.5rem;margin:.15rem 0"><span style="width:3.5rem">${w}</span><div style="height:14px;border-radius:3px;background:var(--attn);width:${(r.a[j]*70).toFixed(1)}%"></div><span>${r.a[j].toFixed(3)}</span></div>`).join('')}
    <p class="small">output o = (${r.o.map(x=>x.toFixed(3)).join(', ')})</p></div>`; }
  function draw(){ const r1=read(S1), r2=read(S2); out.innerHTML=panel(S1,r1)+panel(S2,r2);
    const same=Math.abs(r1.o[0]-r2.o[0])+Math.abs(r1.o[1]-r2.o[1])<1e-9;
    ro.innerHTML= same? '<b>Identical outputs.</b> Each word gets the same weight wherever it sits, because the read is a sum over a set of key–value pairs.' : '<b>Different outputs.</b> Rotating keys by position makes the same word score differently at different positions, so word order now changes the read.'; }
  draw();
});

widget('pos-map',(el)=>{
  box(el,'Where position enters','Select a stage to jump to its method.');
  const st=[['input hₜ','add pₜ before layer 1','Learned positions','learned'],['query qₜ, key kⱼ','rotate by position','RoPE','rope'],['score sₜⱼ','subtract mₕ(t − j)','ALiBi','alibi'],['softmax','weights aₜⱼ','','']];
  const svg=s('svg',{viewBox:'0 0 760 120'}); svg.classList.add('chart'); el.append(svg);
  st.forEach(([a,b2,n,id],i)=>{ const x=10+i*190; const g=s('g',{style:id?'cursor:pointer':'',tabindex:id?0:-1,role:id?'link':'presentation'});
    g.append(s('rect',{x,y:10,width:160,height:46,rx:7,fill:'#fff',stroke:'#1B2433'})); g.append(s('text',{x:x+80,y:38,'text-anchor':'middle','font-size':13,'font-weight':600},a));
    if(i<3) svg.append(s('path',{d:`M${x+160} 33 H${x+188}`,stroke:'#1B2433','stroke-width':1.5}));
    if(n){ g.append(s('rect',{x:x+10,y:70,width:140,height:40,rx:6,fill:'#F6E6E6',stroke:'#9B1C1C'})); g.append(s('text',{x:x+80,y:87,'text-anchor':'middle','font-size':12,'font-weight':600,fill:'#9B1C1C'},n)); g.append(s('text',{x:x+80,y:102,'text-anchor':'middle','font-size':10.5,fill:'#4A5568'},b2));
      const go=()=>{ location.hash=`#/lecture/l7/${id}`; }; g.addEventListener('click',go); g.addEventListener('keydown',e=>{if(e.key==='Enter')go();}); }
    svg.append(g); });
});

widget('learned-pos',(el)=>{
  box(el,'Learned positions: the score depends on absolute position','Random learned tables (d = 8) stand in for trained ones. Fix the words “man” (query) and “dog” (key); move their positions.');
  const d=8, R=seeded(7); const g=()=> (R()*2-1);
  const P=[...Array(64)].map(()=>[...Array(d)].map(g)), M=[...Array(d)].map(()=>[...Array(d)].map(()=>g()*.5));
  const eq=[...Array(d)].map(g), ek=[...Array(d)].map(g);
  const bil=(a,b)=>a.reduce((s0,ai,i)=>s0+ai*M[i].reduce((s1,mij,j)=>s1+mij*b[j],0),0);
  const c=h('div',{class:'ctrls'}); el.append(c);
  const tS=slider(c,{label:'Query position t',min:1,max:40,step:1,value:8,oninput:draw});
  const jS=slider(c,{label:'Key position j',min:1,max:40,step:1,value:6,oninput:draw});
  c.append(h('button',{class:'btn',type:'button',onclick:()=>{ if(tS.get()<=35&&jS.get()<=35){tS.set(tS.get()+5); jS.set(jS.get()+5); draw();} }},'Shift both by 5'));
  const cols=h('div',{class:'cols'}); el.append(cols); const s1=s('svg'), s2=s('svg'); cols.append(h('div',{},s1),h('div',{},s2)); const ro=h('div',{class:'readout'}); el.append(ro);
  function draw(){ const t=tS.get(), j=jS.get(); const pt=P[t-1], pj=P[j-1];
    const terms=[['word, word',bil(eq,ek)],['word, position',bil(eq,pj)],['position, word',bil(pt,ek)],['position, position',bil(pt,pj)]];
    s1.setAttribute('viewBox','0 0 320 200'); s1.classList.add('chart'); s1.innerHTML=''; s1.append(s('text',{x:10,y:16,'font-size':12,'font-weight':600},'Four terms of qₜᵀkⱼ'));
    const mid=160; s1.append(s('line',{x1:mid,x2:mid,y1:24,y2:190,stroke:'#9AA6B4'}));
    terms.forEach(([n,v],i)=>{ const y=34+i*38, w=Math.max(-150,Math.min(150,v*45)); s1.append(s('rect',{x:w<0?mid+w:mid,y,width:Math.abs(w),height:20,fill:i===0?'#64748B':'#9B1C1C',opacity:i===0?.7:.85}));
      s1.append(s('text',{x:6,y:y+14,'font-size':11},n)); s1.append(s('text',{x:w<0?mid+w-4:mid+w+4,y:y+14,'font-size':11,'text-anchor':w<0?'end':'start'},v.toFixed(2))); });
    // position table heatmap
    s2.setAttribute('viewBox','0 0 320 200'); s2.classList.add('chart'); s2.innerHTML=''; s2.append(s('text',{x:10,y:16,'font-size':12,'font-weight':600},'Position table p (rows 1–40)'));
    for(let r=0;r<40;r++) for(let k=0;k<d;k++){ const v=P[r][k]; s2.append(s('rect',{x:20+r*7,y:26+k*19,width:6.5,height:18,fill:v>0?`rgba(155,28,28,${Math.abs(v)})`:`rgba(76,81,191,${Math.abs(v)})`})); }
    [[t,'#0F766E'],[j,'#B45309']].forEach(([r,col])=>s2.append(s('rect',{x:20+(r-1)*7-1,y:24,width:8.5,height:d*19+4,fill:'none',stroke:col,'stroke-width':2})));
    s2.append(s('text',{x:20,y:192,'font-size':10.5,fill:'#4A5568'},'teal box: row t; orange box: row j'));
    const tot=terms.reduce((a,x)=>a+x[1],0);
    ro.innerHTML=`t = ${t}, j = ${j}, offset t − j = ${t-j}. Score = <b>${tot.toFixed(3)}</b>; the position–position term is ${terms[3][1].toFixed(3)}. Press “Shift both by 5”: the offset stays ${t-j}, but the three position terms change, because rows ${t} and ${j} of the table are unrelated to rows ${t+5} and ${j+5}.`; }
  draw();
});

widget('rope-anim',(el)=>{
  box(el,'RoPE in two dimensions, animated','Unit query (“man”, red) at position t and unit key (“dog”, teal) at position j, starting δ apart. Play moves both words later together; the angle between them never changes.');
  const c=h('div',{class:'ctrls'}),c2=h('div',{class:'ctrls'}); el.append(c,c2);
  const th=slider(c,{label:'θ per token',min:0,max:90,step:1,value:30,fmt:v=>v+'°',oninput:()=>draw()});
  const de=slider(c,{label:'starting gap δ',min:0,max:90,step:1,value:20,fmt:v=>v+'°',oninput:()=>draw()});
  const tS=slider(c2,{label:'t',min:0,max:20,step:1,value:3,oninput:()=>{T=tS.get();draw();}});
  const jS=slider(c2,{label:'j',min:0,max:20,step:1,value:1,oninput:()=>{J=jS.get();draw();}});
  let T=3,J=1,stop=null;
  const play=(mode)=>{ if(stop){stop();stop=null;} if(REDUCED()){ if(mode==='both'){T=Math.min(20,Math.round(T)+5);J=Math.min(20,Math.round(J)+5);} else T=Math.min(20,Math.round(T)+5); tS.set(Math.round(T)); jS.set(Math.round(J)); draw(); return; }
    const t0=T,j0=J,dur=1800; let el2=0; stop=animLoop(el,dt=>{ el2+=dt; const f=Math.min(1,el2/dur), e=f<.5?2*f*f:1-((-2*f+2)**2)/2; T=t0+5*e; if(mode==='both') J=j0+5*e; if(T>20||J>20){T=Math.min(T,20);J=Math.min(J,20);}
      draw(); if(f>=1){ T=Math.round(T); J=Math.round(J); tS.set(T); jS.set(J); draw(); return false; } }); };
  c2.append(h('button',{class:'btn primary',type:'button',onclick:()=>play('both')},'Play: shift both by 5'), h('button',{class:'btn',type:'button',onclick:()=>play('q')},'Play: move only the query'), h('button',{class:'btn',type:'button',onclick:()=>{T=3;J=1;tS.set(3);jS.set(1);draw();}},'Reset'));
  const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  function draw(){ const tr=th.get()*Math.PI/180, dr=de.get()*Math.PI/180; const qa=dr+T*tr, ka=J*tr;
    svg.setAttribute('viewBox','0 0 640 280'); svg.classList.add('chart'); svg.innerHTML='';
    const cx=180,cy=140,R=92; svg.append(s('circle',{cx,cy,r:R,fill:'#F7F8FA',stroke:'#D3D9E0'}));
    for(let k=0;k<12;k++){ const a=k*Math.PI/6; svg.append(s('line',{x1:cx+Math.cos(a)*(R-6),y1:cy-Math.sin(a)*(R-6),x2:cx+Math.cos(a)*R,y2:cy-Math.sin(a)*R,stroke:'#C9CED6'})); }
    const arcR=40; let a0=Math.min(qa,ka), a1=Math.max(qa,ka); const large=(a1-a0)%(2*Math.PI)>Math.PI?1:0;
    svg.append(s('path',{d:`M${cx+arcR*Math.cos(ka)} ${cy-arcR*Math.sin(ka)} A${arcR} ${arcR} 0 ${((qa-ka)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)>Math.PI?1:0} 0 ${cx+arcR*Math.cos(qa)} ${cy-arcR*Math.sin(qa)}`,fill:'none',stroke:'#E7B416','stroke-width':3}));
    [[ka,'#0F766E',`k̂ dog, j=${J.toFixed(1).replace('.0','')}`],[qa,'#9B1C1C',`q̂ man, t=${T.toFixed(1).replace('.0','')}`]].forEach(([a,col,l])=>{ svg.append(s('line',{x1:cx,y1:cy,x2:cx+R*Math.cos(a),y2:cy-R*Math.sin(a),stroke:col,'stroke-width':4,'stroke-linecap':'round'})); svg.append(s('text',{x:cx+(R+14)*Math.cos(a),y:cy-(R+14)*Math.sin(a)+4,'text-anchor':Math.cos(a)<-.2?'end':Math.cos(a)>.2?'start':'middle','font-size':12,'font-weight':600,fill:col},l)); });
    const gap=((qa-ka)*180/Math.PI); const sc=Math.cos(qa-ka);
    const fo=document.createElementNS(SVGNS,'foreignObject'); fo.setAttribute('x',385); fo.setAttribute('y',30); fo.setAttribute('width',250); fo.setAttribute('height',240);
    fo.innerHTML=`<div xmlns="http://www.w3.org/1999/xhtml" style="font:14px var(--sans);color:#1B2433;line-height:1.55">
      <div>query angle δ + tθ = <b>${(qa*180/Math.PI).toFixed(0)}°</b></div><div>key angle jθ = <b>${(ka*180/Math.PI).toFixed(0)}°</b></div>
      <div style="margin-top:.5rem">gap = δ + (t − j)θ = <b>${gap.toFixed(0)}°</b></div><div>score q̂ᵀk̂ = cos(gap) = <b style="color:#9B1C1C">${sc.toFixed(3)}</b></div>
      <div style="margin-top:.6rem;color:#4A5568;font-size:12.5px">offset t − j = ${(T-J).toFixed(1).replace('.0','')}</div></div>`; svg.append(fo);
    ro.innerHTML=`With δ = 20° and θ = 30°, man at 3 and dog at 1 sit 80° apart. Shift both by 5: each turns another 150°, and the gap is still 80°. Move only the query and the gap grows by 30° per token.`; }
  draw();
});

widget('rope-period',(el)=>{
  box(el,'One rotation speed repeats','Score cos((t − j)θ) of unit vectors that start aligned, for two speeds.');
  const c=h('div',{class:'ctrls'}); el.append(c); const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  const a=slider(c,{label:'Fast speed θ₁',min:5,max:90,step:1,value:30,fmt:v=>v+'°',oninput:draw});
  const b=slider(c,{label:'Slow speed θ₂',min:1,max:15,step:.5,value:3,fmt:v=>v+'°',oninput:draw});
  const both=h('label',{}, h('input',{type:'checkbox',onchange:draw}),'Show their sum (two pairs)'); c.append(both);
  function draw(){ const A=a.get()*Math.PI/180, B=b.get()*Math.PI/180; const pts=x=>[...Array(361).keys()].map(i=>[i/10,x(i/10)]); const sum=$('input',both).checked;
    const series=[{pts:pts(o=>Math.cos(o*A)),color:'#9B1C1C',label:`θ₁ = ${a.get()}° per token`},{pts:pts(o=>Math.cos(o*B)),color:'#0F766E',label:`θ₂ = ${b.get()}° per token`}];
    if(sum) series.push({pts:pts(o=>(Math.cos(o*A)+Math.cos(o*B))/2),color:'#1B2433',dash:'5 4',label:'average of the two pairs'});
    chart(svg,{w:640,h:250,x:{min:0,max:36,label:'offset t − j',ticks:[0,3,6,12,18,24,30,36]},y:{min:-1,max:1,label:'score'},series,legend:true,
      vlines:[{x:360/a.get(),color:'#9B1C1C',label:'period of θ₁'}]});
    ro.innerHTML=`θ₁ repeats every <b>${(360/a.get()).toFixed(1)}</b> tokens, so offsets 0 and ${(360/a.get()).toFixed(0)} score the same. θ₂ repeats every <b>${(360/b.get()).toFixed(0)}</b> tokens but offset 1 scores ${Math.cos(B).toFixed(4)}, almost the same as offset 0. At offset 12 with 30° and 3°: pair scores 1 and ${Math.cos(12*3*Math.PI/180).toFixed(2)}, total 1.81 against 2 at offset 0.`; }
  draw();
});

widget('rope-multi',(el)=>{
  box(el,'RoPE in d dimensions: many speeds together','θᵢ = base<sup>−2(i−1)/d</sup>. Left: average pair score of aligned unit vectors against offset. Right: how many tokens each pair takes to turn once.');
  const c=h('div',{class:'ctrls'}); el.append(c);
  const dS=slider(c,{label:'Head dimension d',min:3,max:8,step:1,value:7,fmt:v=>2**v,oninput:draw});
  const bS=slider(c,{label:'Base',min:3,max:7,step:.1,value:4,fmt:v=>big(10**v),oninput:draw});
  const fS=slider(c,{label:'Fraction of pairs rotated',min:.25,max:1,step:.25,value:1,fmt:v=>(v*100)+'%',oninput:draw});
  const cols=h('div',{class:'cols'}); el.append(cols); const s1=s('svg'),s2=s('svg'); cols.append(h('div',{},s1),h('div',{},s2)); const ro=h('div',{class:'readout'}); el.append(ro);
  function avg(o,d,base,f){ const P=d/2, R=Math.round(P*f); let a=0; for(let i=0;i<P;i++) a+= i<R? Math.cos(o*base**(-2*i/d)) : 1; return a/P; }
  function draw(){ const d=2**dS.get(), base=10**bS.get(), f=fS.get(); const xs=[]; for(let e=0;e<=5;e+=.02) xs.push(10**e);
    chart(s1,{w:320,h:260,margin:{l:44},x:{min:1,max:1e5,log:true,label:'offset t − j',fmt:big},y:{min:-.4,max:1,label:'average pair score',fmt:v=>v.toFixed(1)},
      series:[{pts:xs.map(x=>[x,avg(x,d,base,f)]),color:'#9B1C1C'},{pts:xs.map(x=>[x,avg(x,128,1e4,1)]),color:'#C9CED6',dash:'4 3'}]});
    const P=d/2; s2.setAttribute('viewBox','0 0 320 260'); s2.classList.add('chart'); s2.innerHTML='';
    const per=[...Array(P).keys()].map(i=>2*Math.PI/base**(-2*i/d)); const lmax=Math.log10(Math.max(...per)); const bw=280/P;
    per.forEach((p,i)=>{ const hh=Math.log10(p)/Math.max(lmax,1)*200; s2.append(s('rect',{x:30+i*bw,y:225-hh,width:Math.max(1,bw-1),height:hh,fill:i<Math.round(P*f)?'#0F766E':'#D3D9E0'})); });
    s2.append(s('line',{x1:28,x2:312,y1:225,y2:225,stroke:'#1B2433'})); s2.append(s('text',{x:30,y:244,'font-size':11},'pair 1')); s2.append(s('text',{x:310,y:244,'font-size':11,'text-anchor':'end'},`pair ${P}`));
    s2.append(s('text',{x:30,y:16,'font-size':11.5,'font-weight':600},'tokens per turn (log)')); s2.append(s('text',{x:310,y:16,'font-size':11,'text-anchor':'end',fill:'#4A5568'},`slowest: ${big(per[P-1])}`));
    ro.innerHTML=`Average score at offsets 1, 10, 100, 1,000, 10,000: ${[1,10,100,1e3,1e4].map(o=>`<b>${avg(o,d,base,f).toFixed(2)}</b>`).join(', ')}. Grey dashed curve: d = 128, base 10K (0.97, 0.67, 0.48, 0.16, −0.03). Pair 1 always turns once every 6.3 tokens. A larger base slows the slow pairs, which is why Gemma 3 uses base 1M in its global layers; rotating only some pairs (GLM-4.5: 32 of 64) leaves the rest position-free.`; }
  draw();
});

widget('alibi',(el)=>{
  box(el,'ALiBi: one slope per head','Slopes mₕ = 2<sup>−8h/H</sup> (eight heads: 1/2 … 1/256). Left: attention weights with equal logits, so only the penalty acts. Right: e<sup>−m(t−j)</sup> for every head.');
  const c=h('div',{class:'ctrls'}); el.append(c);
  const H=slider(c,{label:'Heads H',min:4,max:16,step:4,value:8,oninput:()=>{hd.el.max=H.get(); if(hd.get()>H.get()) hd.set(H.get()); draw();}});
  const hd=slider(c,{label:'Show head h',min:1,max:8,step:1,value:1,oninput:draw});
  const cols=h('div',{class:'cols'}); el.append(cols); const s1=s('svg'),s2=s('svg'); cols.append(h('div',{},s1),h('div',{},s2)); const ro=h('div',{class:'readout'}); el.append(ro);
  function draw(){ const Hh=H.get(), hh=Math.min(hd.get(),Hh); const m=2**(-8*hh/Hh); const N=12;
    s1.setAttribute('viewBox','0 0 320 300'); s1.classList.add('chart'); s1.innerHTML=''; const cs=22,x0=40,y0=30;
    s1.append(s('text',{x:10,y:16,'font-size':12,'font-weight':600},`head ${hh}: m = 1/${(1/m).toFixed(0)}`));
    for(let t=0;t<N;t++){ const w=softmax([...Array(t+1).keys()].map(j=>-m*(t-j)));
      for(let j=0;j<N;j++){ const a=j<=t?w[j]:null; s1.append(s('rect',{x:x0+j*cs,y:y0+t*cs,width:cs-1.5,height:cs-1.5,fill:a==null?'#F2F4F6':`rgba(15,118,110,${.06+.94*Math.min(1,a*2)})`})); } }
    s1.append(s('text',{x:x0,y:y0+N*cs+16,'font-size':11,fill:'#4A5568'},'keys j →, queries t ↓ (12 tokens)'));
    const xs=[...Array(65).keys()];
    chart(s2,{w:320,h:300,margin:{l:44},x:{min:0,max:64,label:'distance t − j'},y:{min:0,max:1,label:'e^(−m·distance)',fmt:v=>v.toFixed(1)},
      series:[...Array(Hh).keys()].map(i=>({pts:xs.map(x=>[x,Math.exp(-(2**(-8*(i+1)/Hh))*x)]),color:i+1===hh?'#9B1C1C':'#C9CED6',width:i+1===hh?2.5:1.2}))});

widget('state-capacity',(el)=>{
  box(el,'Issue 3: a fixed-size state forgets','Store n key–value pairs with random unit keys in a state with key width dₖ, then read each one back. Average squared read error, over random draws.');
  const c=h('div',{class:'ctrls'}); el.append(c); const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  const dk=slider(c,{label:'Key width dₖ',min:4,max:32,step:4,value:16,oninput:draw});
  c.append(h('button',{class:'btn',type:'button',onclick:draw},'Resample'));
  function trial(n,d,rule){ const K=[...Array(n)].map(()=>{ const v=[...Array(d)].map(randn); const nn=Math.hypot(...v); return v.map(x=>x/nn); }); const V=[...Array(n)].map(()=>randn());
    const S=Array(d).fill(0); K.forEach((k,i)=>{ const pred=dot(S,k); const err=rule==='delta'? V[i]-pred : V[i]; for(let j=0;j<d;j++) S[j]+=err*k[j]; });
    return K.reduce((a,k,i)=>a+(dot(S,k)-V[i])**2,0)/n; }
  function draw(){ const d=dk.get(); const ns=[...Array(32).keys()].map(i=>2*(i+1)); const avg=(n,r)=>{ let a=0; for(let k=0;k<12;k++) a+=trial(n,d,r); return a/12; };
    const la=ns.map(n=>[n,avg(n,'add')]), de=ns.map(n=>[n,avg(n,'delta')]);
    chart(svg,{w:640,h:250,x:{min:0,max:64,label:'pairs stored n'},y:{min:0,max:3,label:'read error'},series:[{pts:la,color:'#64748B',label:'linear attention: add'},{pts:de,color:'#0F766E',label:'delta rule: correct (β = 1)'}],legend:true,vlines:[{x:d,color:'#9B1C1C',label:'n = dₖ'}]});
    ro.innerHTML=`Values have variance 1, so error near 1 means the read is no better than guessing. The delta rule’s error stays below plain addition’s because each write corrects the current prediction, but both climb as n approaches and passes dₖ: a ${d}-wide state cannot hold more than about ${d} independent pairs, whatever the update rule. This is why Kimi K3 keeps some full-cache layers.`; }
  draw();
});

/* loopAnim: a looping animation that only runs while visible, with a pause button.
   frame(t) draws the state at time t seconds. Reduced-motion users get a paused still. */
function loopAnim(el, frame, opts={}){
  let t=opts.start||0, playing=!REDUCED(), visible=false, last=null, id=null;
  const btn=h('button',{class:'btn loopbtn',type:'button','aria-label':'Pause or play the animation'}, playing?'Pause':'Play');
  const tag=h('span',{class:'looptag'},'Looping animation');
  const bar=h('div',{class:'ctrls'},btn,tag); const wd=el.querySelector('.wd'); (wd||el.firstChild).after(bar);
  btn.onclick=()=>{ playing=!playing; btn.textContent=playing?'Pause':'Play'; last=null; kick(); };
  const io=new IntersectionObserver(es=>{ visible=es[0].isIntersecting; last=null; kick(); },{threshold:.15}); io.observe(el);
  function kick(){ if(id||!playing||!visible) return; id=requestAnimationFrame(step); }
  function step(now){ id=null; if(!el.isConnected){ io.disconnect(); return; } if(last!=null) t+=Math.min(.1,(now-last)/1000); last=now; frame(t); if(playing&&visible) id=requestAnimationFrame(step); }
  frame(t); return {bar};
}
const gpdf=(x,m=0,s=1)=>Math.exp(-((x-m)**2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
function lloydOn(xs,f,c,iters){ // returns states after each half-step
  const dx=xs[1]-xs[0], N=c.length, out=[];
  const D=(c,t)=>{ let s0=0,i=0; for(let k=0;k<xs.length;k++){ while(i<N-1&&xs[k]>t[i]) i++; s0+=(xs[k]-c[i])**2*f[k]; } return s0*dx; };
  const cent=t=>{ const num=Array(N).fill(0),den=Array(N).fill(0); let i=0; for(let k=0;k<xs.length;k++){ while(i<N-1&&xs[k]>t[i]) i++; num[i]+=xs[k]*f[k]; den[i]+=f[k]; } return num.map((n,j)=>den[j]>1e-12?n/den[j]:c[j]); };
  const mid=c=>c.slice(1).map((x,i)=>(c[i]+x)/2);
  let cc=c.slice(), tt=mid(cc);
  for(let k=0;k<iters;k++){ tt=mid(cc); out.push({c:cc.slice(),t:tt.slice(),D:D(cc,tt),step:'midpoints'}); cc=cent(tt); out.push({c:cc.slice(),t:tt.slice(),D:D(cc,tt),step:'centroids'}); }
  return {out,D,cent,mid};
}
const LMG={}; function lmGauss(b){ if(LMG[b]) return LMG[b]; const xs=[],f=[]; for(let x=-6;x<=6;x+=.004){ xs.push(x); f.push(gpdf(x)); } const N=2**b; const init=[...Array(N).keys()].map(i=>-2+4*(i+.5)/N); const r=lloydOn(xs,f,init,120); const last=r.out[r.out.length-1]; return LMG[b]={c:last.c,t:last.t,D:last.D}; }
function qLevels(v,L){ let i=0; while(i<L.t.length&&v>L.t[i]) i++; return L.c[i]; }
function fwht(v){ const a=v.slice(), n=a.length; for(let hh=1;hh<n;hh*=2) for(let i=0;i<n;i+=2*hh) for(let j=i;j<i+hh;j++){ const x=a[j],y=a[j+hh]; a[j]=(x+y)/Math.SQRT2; a[j+hh]=(x-y)/Math.SQRT2; } return a; }
const randUnit=d=>{ const g=[...Array(d)].map(randn); const n=Math.hypot(...g); return g.map(x=>x/n); };
const norm=v=>Math.hypot(...v);

widget('float-bits',(el)=>{
  box(el,'How a number is stored in each format','Type a number. Each row shows its bits (sign | exponent | fraction), the value actually stored, and the relative error.');
  const inp=h('input',{type:'text',value:'3.14159265',style:'font:1rem var(--sans);padding:.35rem .5rem;border:1px solid var(--ink);border-radius:6px;width:11rem','aria-label':'Number to encode'});
  const c=h('div',{class:'ctrls'}); c.append(h('label',{},'Value',inp)); ['0.1','65504','70000','1e-6','-2.5','448'].forEach(v=>c.append(h('button',{class:'btn',type:'button',onclick:()=>{inp.value=v;draw();}},v))); el.append(c);
  const out=h('div'); el.append(out); inp.addEventListener('input',draw);
  const dv=new DataView(new ArrayBuffer(4)); const f32b=v=>{ dv.setFloat32(0,v); return dv.getUint32(0); }, b2f=u=>{ dv.setUint32(0,u>>>0); return dv.getFloat32(0); };
  const toBF16=v=>{ if(isNaN(v)) return 0x7fc0; const u=f32b(v); return ((u+0x7fff+((u>>>16)&1))>>>16)&0xffff; };
  function toFP16(v){ const sg=(v<0||Object.is(v,-0))?1:0, a=Math.abs(v); if(isNaN(v)) return 0x7e00; if(a>=65520) return (sg<<15)|0x7c00; if(a<2**-25) return sg<<15;
    let e=Math.floor(Math.log2(a)); if(e<-14){ return (sg<<15)|Math.round(a/2**-24); } let mi=Math.round((a/2**e-1)*1024); if(mi===1024){mi=0;e++;} if(e>15) return (sg<<15)|0x7c00; return (sg<<15)|((e+15)<<10)|mi; }
  const fromFP16=x=>{ const sg=x>>15?-1:1, e=(x>>10)&31, m=x&1023; if(e===0) return sg*m*2**-24; if(e===31) return m?NaN:sg*Infinity; return sg*(1+m/1024)*2**(e-15); };
  const E4M3=(()=>{ const vals=[]; for(let e=0;e<16;e++) for(let m=0;m<8;m++){ if(e===15&&m===7) continue; vals.push({e,m,v:e===0? m/8*2**-6 : (1+m/8)*2**(e-7)}); } return vals; })();
  function toE4M3(v){ const a=Math.abs(v); let best=E4M3[0]; for(const x of E4M3) if(Math.abs(x.v-a)<Math.abs(best.v-a)) best=x; return {bits:((v<0?1:0)<<7)|(best.e<<3)|best.m, val:(v<0?-1:1)*best.v, sat:a>448}; }
  const row=(name,bits,nb,ne,val,note)=>{ const bs=bits.toString(2).padStart(nb,'0'); const cell=(ch,i)=>`<span style="display:inline-block;width:1.05em;text-align:center;border-radius:2px;margin:0 1px;background:${i===0?'#E8ECF0':i<=ne?'#F6E6E6':'#E3F0EE'};color:${i===0?'#1B2433':i<=ne?'#9B1C1C':'#0F766E'}">${ch}</span>`;
    return `<tr><td><b>${name}</b><div class="small">1 + ${ne} + ${nb-1-ne}</div></td><td style="font-family:ui-monospace,Menlo,monospace;font-size:.8rem;white-space:nowrap;overflow-x:auto">${[...bs].map(cell).join('')}</td><td class="r">${isFinite(val)?(+val.toPrecision(8)).toString():val}</td><td class="r">${note}</td></tr>`; };
  function draw(){ const v=parseFloat(inp.value); if(!isFinite(v)){ out.innerHTML='<p class="small">Enter a finite number.</p>'; return; }
    const rel=x=>v===0? (x===0?'exact':'—') : !isFinite(x)? 'overflow' : Math.abs(x-v)/Math.abs(v)<1e-12?'exact':(Math.abs(x-v)/Math.abs(v)*100).toPrecision(2)+'%';
    const f32=Math.fround(v), bf=toBF16(v), bfv=b2f(bf<<16), h16=toFP16(v), hv=fromFP16(h16), e8=toE4M3(v);
    out.innerHTML=`<div style="overflow-x:auto"><table class="t"><thead><tr><th>Format</th><th>Bits (sign | exponent | fraction)</th><th class="r">Stored value</th><th class="r">Relative error</th></tr></thead><tbody>
      ${row('FP32',f32b(v)>>>0,32,8,f32,rel(f32))}${row('BF16',bf,16,8,bfv,rel(bfv))}${row('FP16',h16,16,5,hv,rel(hv))}${row('FP8 E4M3',e8.bits,8,4,e8.val,e8.sat?'saturates at 448':rel(e8.val))}</tbody></table></div>
      <p class="small">FP16 overflows above 65,504; BF16 keeps FP32’s range with only 7 fraction bits; E4M3 tops out at 448 with 8 values per power of two.</p>`; }
  draw();
});

widget('lloyd-loop',(el)=>{

  const xs=[],f=[]; for(let x=40;x<=100;x+=.05){ xs.push(x); f.push(.65*gpdf(x,79,7.5)+.35*gpdf(x,63,8)); } const Z=f.reduce((a,b)=>a+b,0)*.05; for(let i=0;i<f.length;i++) f[i]/=Z;

  let cum=0; const pT=[]; for(let k=0;k<xs.length&&pT.length<N-1;k++){ cum+=f[k]*dx; if(cum>=(pT.length+1)/N) pT.push(xs[k]); } const pC=tmp.cent(pT);
  const Dof=(c,t)=>{ let s0=0,i=0; for(let k=0;k<xs.length;k++){ while(i<N-1&&xs[k]>t[i]) i++; s0+=(xs[k]-c[i])**2*f[k]; } return s0*dx; };

    const c=lerp(A.c,B.c), th=lerp(A.t,B.t);

    th.forEach(x=>svg.append(s('line',{x1:X(x),x2:X(x),y1:25,y2:200,stroke:'#0F766E','stroke-width':1.5})));

widget('joint-cells',(el)=>{

widget('bias-scatter',(el)=>{

  seg(c,[{label:'Rotate + optimal levels',value:'levels'},{label:'… rescaled by 1/(1 − D_b)',value:'rescale'},{label:'QJL sign sketch (1 bit)',value:'qjl'},{label:'TurboQuant',value:'turbo'}],method,v=>{method=v;draw();},'Method');

  const R0=seeded(21), gg=()=>{ let u=R0()||1e-9,v=R0(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const S=[...Array(d)].map(()=>[...Array(d)].map(gg));
  const pairs=[...Array(300)].map(()=>{ const x=(()=>{ const g=[...Array(d)].map(gg); const n=norm(g); return g.map(v=>v/n); })(); const z=(()=>{ const g=[...Array(d)].map(gg); const p=dot(g,x); const o=g.map((v,i)=>v-p*x[i]); const n=norm(o); return o.map(v=>v/n); })(); const rho=R0()*2-1; return {x,q:x.map((v,i)=>rho*v+Math.sqrt(1-rho*rho)*z[i]),t:rho}; });
  const qjl=(r,q)=>{ const nr=norm(r); if(nr<1e-12) return 0; let acc=0; for(let i=0;i<d;i++) acc+=Math.sign(dot(S[i],r))*dot(S[i],q); return Math.sqrt(Math.PI/2)/d*nr*acc; };
  function est(p){ const sd=Math.sqrt(d);
    const quant=(v,bb)=>{ const L=lmGauss(bb); return v.map(t=>qLevels(t*sd,L)/sd); };
    if(method==='levels'){ return dot(p.q,quant(p.x,bits)); }

    if(bits===1) return qjl(p.x,p.q); const xh=quant(p.x,bits-1); return dot(p.q,xh)+qjl(p.x.map((v,i)=>v-xh[i]),p.q); }

    ro.innerHTML=`<b>${names[method]}.</b> Fitted slope <b>${slope.toFixed(3)}</b>${method==='levels'?` (theory 1 − D_${bits} = ${(1-Db).toFixed(3)})`:''}; RMS error ${rmse.toFixed(3)}. ${method==='levels'?'Biased: every estimate shrinks toward 0 by the same factor.':method==='rescale'?'Unbiased again, at the cost of scaling up the noise.':'Unbiased: slope ≈ 1, with noise that falls as bits are added.'}`; }

widget('gptq-sim',(el)=>{

  const inv=A=>{ const n=A.length, M=A.map((r,i)=>[...r,...[...Array(n)].map((_,j)=>i===j?1:0)]); for(let i=0;i<n;i++){ let p=i; for(let k=i+1;k<n;k++) if(Math.abs(M[k][i])>Math.abs(M[p][i])) p=k; [M[i],M[p]]=[M[p],M[i]]; const pv=M[i][i]; for(let j=0;j<2*n;j++) M[i][j]/=pv; for(let k=0;k<n;k++) if(k!==i){ const f=M[k][i]; if(f) for(let j=0;j<2*n;j++) M[k][j]-=f*M[i][j]; } } return M.map(r=>r.slice(n)); };
  function draw(){ const r=rho.get(), m=mu.get(); const H=[...Array(d)].map((_,i)=>[...Array(d)].map((_,j)=>r**Math.abs(i-j)+m*m+(i===j?1e-6:0)));
    const coef=[], Dl=[]; for(let i=0;i<d;i++){ const B=H.slice(i).map(row=>row.slice(i)); const Bi=inv(B); Dl.push(1/Bi[0][0]); // correction for coordinate i from earlier errors: -(Bi H_{>=i,<i} e)_0
      coef.push(i===0?[]:[...Array(i).keys()].map(j=>{ let acc=0; for(let k=0;k<B.length;k++) acc+=Bi[0][k]*H[i+k][j]; return acc; })); }
    const cost=e=>{ let a=0; for(let i=0;i<d;i++) for(let j=0;j<d;j++) a+=e[i]*H[i][j]*e[j]; return a; };

    for(let a=-5;a<=5;a++) for(let b=-2;b<=2;b++){ const q=[a*g1[0]+b*g2[0],a*g1[1]+b*g2[1]]; if(Math.abs(q[0])>3.4) continue; svg.append(s('circle',{cx:X(q[0]),cy:Y(q[1]),r:3.5,fill:'#1B2433'})); }
    [[g1,'g₁'],[g2,'g₂']].forEach(([g,l])=>{ svg.append(s('line',{x1:X(0),y1:Y(0),x2:X(g[0]),y2:Y(g[1]),stroke:'#B45309','stroke-width':2.5})); svg.append(s('text',{x:X(g[0])+5,y:Y(g[1])-4,'font-size':12,'font-weight':700,fill:'#B45309'},l)); });
    svg.append(s('circle',{cx:X(P[0]),cy:Y(P[1]),r:6,fill:'#9B1C1C'})); svg.append(s('text',{x:X(P[0])+9,y:Y(P[1])-7,'font-size':12,'font-weight':700,fill:'#9B1C1C'},'p'));
    if(ph>2.2){ svg.append(s('line',{x1:X(P[0]),y1:Y(P[1]),x2:X(res.proj[0]),y2:Y(res.proj[1]),stroke:'#9B1C1C','stroke-dasharray':'4 3'})); svg.append(s('circle',{cx:X(res.proj[0]),cy:Y(res.proj[1]),r:4,fill:'#fff',stroke:'#9B1C1C','stroke-width':2})); }
    if(ph>3.4){ svg.append(s('circle',{cx:X(res.bab[0]),cy:Y(res.bab[1]),r:9,fill:'none',stroke:'#0F766E','stroke-width':3})); }
    if(ph>4.2){ svg.append(s('circle',{cx:X(res.best[0]),cy:Y(res.best[1]),r:13,fill:'none',stroke:'#E7B416','stroke-width':2.5})); }
    const same=Math.abs(res.bab[0]-res.best[0])+Math.abs(res.bab[1]-res.best[1])<1e-9;
    cap.innerHTML= ph<=1.1? 'A new target p.' : ph<=2.2? `Step 1: the nearest line is j = ${res.j}.` : ph<=3.4? 'Step 2: project p onto that line.' : ph<=4.2? 'Step 3: the nearest lattice point along the line (teal ring).' : (same? 'Babai found the closest lattice point this time.' : 'Babai’s point (teal) is not the closest (gold): like GPTQ, it is greedy and not always optimal.'); });
});

widget('calib-pipeline',(el)=>{
  box(el,'Preparing the compressed model, block by block','Calibration inputs flow in; at each block: collect second moments H, quantize with GPTQ, replay the inputs through the quantized block, pass its outputs to the next block.');
  const svg=s('svg'); el.append(svg); const cap=h('div',{class:'readout'}); el.append(cap); const B=5, per=3.2;
  const phases=['collect second moments H','quantize the block (GPTQ, row by row)','replay calibration inputs through the quantized block','pass its outputs onward as the next block’s inputs'];
  loopAnim(el,t=>{ const tt=t%(B*per+2), k=Math.min(B-1,Math.floor(tt/per)), ph=Math.min(3,Math.floor((tt-k*per)/(per/4))), done=tt>=B*per;
    svg.setAttribute('viewBox','0 0 680 170'); svg.classList.add('chart'); svg.innerHTML='';
    svg.append(s('text',{x:10,y:84,'font-size':12,'font-weight':600},'calibration')); svg.append(s('text',{x:10,y:99,'font-size':12,'font-weight':600},'inputs'));
    for(let i=0;i<B;i++){ const x=100+i*112, q=done||i<k||(i===k&&ph>=1); const cur=!done&&i===k;
      svg.append(s('rect',{x,y:55,width:90,height:60,rx:8,fill:q?'#F6E6E6':'#fff',stroke:cur?'#9B1C1C':'#9AA6B4','stroke-width':cur?2.5:1.3}));
      svg.append(s('text',{x:x+45,y:82,'text-anchor':'middle','font-size':12,'font-weight':600},`block ${i+1}`)); svg.append(s('text',{x:x+45,y:99,'text-anchor':'middle','font-size':10.5,fill:q?'#9B1C1C':'#4A5568'},q?'quantized':'16-bit'));
      if(i<B-1) svg.append(s('path',{d:`M${x+90} 85 H${x+112}`,stroke:'#1B2433','stroke-width':1.5}));
      if(cur&&ph===0){ svg.append(s('text',{x:x+45,y:42,'text-anchor':'middle','font-size':11,fill:'#0F766E','font-weight':600},'H = XXᵀ/n')); }
      if(cur&&ph===2){ for(let d0=0;d0<4;d0++){ const fx=x+((tt*120+d0*22)%90); svg.append(s('circle',{cx:fx,cy:130,r:3.5,fill:'#0F766E'})); } svg.append(s('text',{x:x+45,y:150,'text-anchor':'middle','font-size':10.5,fill:'#0F766E'},'replay')); }
      if(cur&&ph===3){ const fx=x+90+((tt*80)%22); svg.append(s('circle',{cx:fx,cy:85,r:5,fill:'#0F766E'})); } }
    svg.append(s('path',{d:'M80 85 H100',stroke:'#1B2433','stroke-width':1.5}));
    cap.innerHTML= done? 'All blocks quantized. Each block was fitted to the inputs it will actually see, after the earlier blocks were already quantized. OPT-175B: 128 segments of 2,048 tokens, about 4.2 hours on one 80 GB A100.' : `Block ${k+1}: ${phases[ph]}.`; });
});

widget('act-quant',(el)=>{
  box(el,'Activation outliers: per token, per channel, SmoothQuant, rotation','X has 16 tokens × 32 channels; channels 5 and 21 are persistently ~25× larger (like OPT-13B). We quantize the operands of WX with the chosen bits and report the error of the product. Heatmaps use square-root shading so small entries stay visible.');
  const T=16, C=32, M=12; const R=seeded(9), g=()=>{ let u=R()||1e-9,v=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const X=[...Array(C)].map((_,j)=>[...Array(T)].map(()=>g()*(j===5||j===21?25:1))); const W=[...Array(M)].map(()=>[...Array(C)].map((_,j)=>g()*(j===5||j===21?.02:.3)));
  let mode='token', bits=8; const c=h('div',{class:'ctrls'}),c2=h('div',{class:'ctrls'}); el.append(c,c2);
  seg(c,[{label:'Per token',value:'token'},{label:'Per channel (ideal, not fast)',value:'channel'},{label:'SmoothQuant',value:'smooth'},{label:'Hadamard rotation',value:'rot'}],mode,v=>{mode=v;draw();},'Scales');
  seg(c2,[{label:'INT8',value:8},{label:'INT4',value:4}],8,v=>{bits=v;draw();},'Bits');
  const al=slider(c2,{label:'SmoothQuant α',min:0,max:1,step:.05,value:.5,fmt:v=>v.toFixed(2),oninput:draw});
  const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  const mm=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((a,v,k)=>a+v*B[k][j],0)));
  const qgroup=(vals,b)=>{ const mx=Math.max(1e-12,...vals.map(Math.abs)), L=2**(b-1)-1; return vals.map(v=>Math.round(v/mx*L)/L*mx); };
  function draw(){ al.el.parentElement.style.display=mode==='smooth'?'':'none';
    let Xs=X.map(r=>r.slice()), Ws=W.map(r=>r.slice());
    if(mode==='smooth'){ const a=al.get(); for(let j=0;j<C;j++){ const mx=Math.max(...X[j].map(Math.abs)), mw=Math.max(...W.map(r=>Math.abs(r[j]))); const lam=Math.max(1e-6,mx**a/(mw**(1-a))); for(let t=0;t<T;t++) Xs[j][t]/=lam; for(let i=0;i<M;i++) Ws[i][j]*=lam; } }
    if(mode==='rot'){ const cols=[...Array(T).keys()].map(t=>fwht(X.map(r=>r[t]))); Xs=[...Array(C)].map((_,j)=>cols.map(cc=>cc[j])); Ws=W.map(r=>fwht(r)); }
    // quantize weights per output row; activations per token (columns) or per channel (rows)
    const Wq=Ws.map(r=>qgroup(r,bits)); let Xq;
    if(mode==='channel') Xq=Xs.map(r=>qgroup(r,bits)); else { const cols=[...Array(T).keys()].map(t=>qgroup(Xs.map(r=>r[t]),bits)); Xq=[...Array(C)].map((_,j)=>cols.map(cc=>cc[j])); }
    const Y=mm(W,X), Yq=mm(Wq,Xq); let n=0,dd=0; for(let i=0;i<M;i++) for(let t=0;t<T;t++){ n+=Y[i][t]**2; dd+=(Yq[i][t]-Y[i][t])**2; } const err=Math.sqrt(dd/n);
    svg.setAttribute('viewBox','0 0 680 200'); svg.classList.add('chart'); svg.innerHTML='';
    const heat=(A,ox,title,scale)=>{ svg.append(s('text',{x:ox,y:14,'font-size':12,'font-weight':600},title)); const mx=scale||Math.max(...A.flat().map(Math.abs)); A.forEach((r,j)=>r.forEach((v,t)=>svg.append(s('rect',{x:ox+t*9.5,y:22+j*5.3,width:9,height:5,fill:`rgba(155,28,28,${Math.min(1,Math.sqrt(Math.abs(v)/mx))})`})))); svg.append(s('text',{x:ox,y:196,'font-size':10.5,fill:'#4A5568'},`tokens →, channels ↓ · max ${mx.toFixed(1)}`)); };
    heat(X,10,'X as produced'); heat(Xs,250,mode==='token'?'what is quantized (same X)':mode==='channel'?'what is quantized (same X, per-channel scales)':mode==='smooth'?'Λ⁻¹X after smoothing':'ΠX after rotation');
    const per=mode==='channel'?'channel':'token'; svg.append(s('text',{x:490,y:40,'font-size':13,'font-weight':700},`output error ${(err*100).toFixed(2)}%`)); svg.append(s('text',{x:490,y:60,'font-size':11.5,fill:'#4A5568'},`INT${bits}, one scale per ${per}`)); svg.append(s('text',{x:490,y:78,'font-size':11.5,fill:'#4A5568'},'weights: one scale per output row'));
    const notes={token:'The outlier channels set every token’s scale, crushing the ordinary channels. Fast: the scale factors out of the matmul.',channel:'Accurate, but each channel’s scale lands inside every dot product, which fast low-precision matmul cannot do.',smooth:'Per-channel information folded into W offline: WX = (WΛ)(Λ⁻¹X). Run time stays per-token. α moves difficulty between activations (α → 1) and weights (α → 0). α is SmoothQuant’s migration strength; the slides only say Λ is estimated from calibration data.',rot:'WX = (WΠᵀ)(ΠX): the outlier energy is spread over all channels, so a per-token scale fits. A run-time rotation is paid on every token.'};
    ro.innerHTML=`<b>${(err*100).toFixed(2)}%</b> relative error in WX. ${notes[mode]}`; }
  draw();
});

widget('ste-loop',(el)=>{
  box(el,'The straight-through estimator, step by step','Left: rounding is a staircase, so its true derivative is 0 almost everywhere. Right: QAT keeps a full-precision latent weight (from 0.3) and copies the gradient straight through; small updates accumulate until the deployed value Q(w) flips.');
  const svg=s('svg'); el.append(svg); const cap=h('div',{class:'readout'}); el.append(cap);
  const steps=30, lat=[...Array(steps+1).keys()].map(k=>Math.min(.62,.3+k*.0106)), dep=lat.map(v=>v>=.5?1:0);
  loopAnim(el,t=>{ const tt=t%(steps*.28+2.5), k=Math.min(steps,Math.floor(tt/.28));
    svg.setAttribute('viewBox','0 0 680 240'); svg.classList.add('chart'); svg.innerHTML='';
    const X=x=>30+(x+1.5)/3*250, Y=y=>200-(y+1.5)/3*170;
    svg.append(s('text',{x:30,y:16,'font-size':12,'font-weight':600},'Q(w) = round(w)'));
    svg.append(s('line',{x1:X(-1.5),x2:X(1.5),y1:Y(0),y2:Y(0),stroke:'#E6EAEE'})); svg.append(s('line',{x1:X(0),x2:X(0),y1:Y(-1.5),y2:Y(1.5),stroke:'#E6EAEE'}));
    [-1,0,1].forEach(v=>svg.append(s('line',{x1:X(v-.5),x2:X(v+.5),y1:Y(v),y2:Y(v),stroke:'#1B2433','stroke-width':3})));
    svg.append(s('text',{x:X(.5)+4,y:Y(.5),'font-size':10.5,fill:'#9B1C1C'},'threshold 1/2')); svg.append(s('text',{x:X(-1.4),y:Y(1.3),'font-size':11,fill:'#4A5568'},"Q′(w) = 0 on every flat step"));
    svg.append(s('circle',{cx:X(lat[k]),cy:Y(dep[k]),r:6,fill:'#9B1C1C'}));
    const ox=330, ow=330, XS=i=>ox+i/steps*ow, YV=v=>200-v*150;
    svg.append(s('text',{x:ox,y:16,'font-size':12,'font-weight':600},'latent w (teal) and deployed Q(w) (red)'));
    svg.append(s('line',{x1:ox,x2:ox+ow,y1:YV(.5),y2:YV(.5),stroke:'#9AA6B4','stroke-dasharray':'4 4'})); svg.append(s('text',{x:ox+ow,y:YV(.5)-4,'text-anchor':'end','font-size':10.5,fill:'#4A5568'},'0.5'));
    svg.append(s('line',{x1:ox,x2:ox+ow,y1:200,y2:200,stroke:'#1B2433'})); [0,10,19,30].forEach(i=>svg.append(s('text',{x:XS(i),y:216,'text-anchor':'middle','font-size':10.5},i)));
    svg.append(s('path',{d:lat.slice(0,k+1).map((v,i)=>(i?'L':'M')+XS(i)+' '+YV(v)).join(''),fill:'none',stroke:'#0F766E','stroke-width':2.5}));
    svg.append(s('path',{d:dep.slice(0,k+1).map((v,i)=>(i?'L':'M')+XS(i)+' '+YV(v)).join(''),fill:'none',stroke:'#9B1C1C','stroke-width':2.5}));
    svg.append(s('text',{x:ox+ow/2,y:234,'text-anchor':'middle','font-size':11},'step'));
    cap.innerHTML=`Step ${k}: latent w = ${lat[k].toFixed(3)}, deployed Q(w) = ${dep[k]}. Forward uses Q(w); backward pretends ∂Q/∂w = 1 and updates w. ${dep[k]?'The deployed value has flipped: an update the true gradient (0) could never make.':'The deployed value has not moved yet; the latent weight is accumulating updates.'}`; });
});

widget('roofline',(el)=>{
  box(el,'When do fewer bits make a layer faster?','One 8,192 × 8,192 linear layer on an illustrative accelerator: 3.35 TB/s memory bandwidth, 1,000 TFLOP/s at 16-bit, 2× at native 8-bit, 4× at native 4-bit (W4A4). time ≈ max(bytes / bandwidth, operations / compute rate).');
  const d=8192, BW=3.35e12, base=1e15; let wb=16, ab=16; const c=h('div',{class:'ctrls'}),c2=h('div',{class:'ctrls'}); el.append(c,c2);
  const B=slider(c,{label:'Tokens per step (batch × sequence)',min:0,max:13,step:.25,value:0,fmt:v=>Math.round(2**v).toLocaleString(),oninput:draw});
  seg(c2,[{label:'W16A16',value:'16,16'},{label:'W4A16',value:'4,16'},{label:'W8A8',value:'8,8'},{label:'W4A4',value:'4,4'}],'16,16',v=>{[wb,ab]=v.split(',').map(Number);draw();},'Format');
  const svg=s('svg'); el.append(svg); const ro=h('div',{class:'readout'}); el.append(ro);
  const rate=(w,a)=> (a<=4&&w<=4)? base*4 : (a<=8&&w<=8)? base*2 : base;
  const time=(n,w,a)=>{ const bytes=d*d*w/8 + 2*n*d*a/8, ops=2*n*d*d; return {mem:bytes/BW, comp:ops/rate(w,a)}; };
  function draw(){ const n=Math.round(2**B.get()); const xs=[]; for(let e=0;e<=13;e+=.1) xs.push(2**e);
    const cfgs=[['W16A16',16,16,'#64748B'],['W4A16',4,16,'#0F766E'],['W8A8',8,8,'#B45309'],['W4A4',4,4,'#9B1C1C']];
    chart(svg,{w:640,h:270,x:{min:1,max:8192,log:true,label:'tokens per step',fmt:v=>big(v)},y:{min:1e-6,max:1e-1,log:true,label:'time per layer (s)'},
      series:cfgs.map(([nm,w,a,col])=>({pts:xs.map(x=>{ const tm=time(x,w,a); return [x,Math.max(tm.mem,tm.comp)]; }),color:col,width:nm===`W${wb}A${ab}`?3:1.4,label:nm})),legend:true,vlines:[{x:n,color:'#1B2433'}]});
    const tm=time(n,wb,ab), b16=time(n,16,16); const tt=Math.max(tm.mem,tm.comp), t16=Math.max(b16.mem,b16.comp);
    ro.innerHTML=`${n.toLocaleString()} token${n>1?'s':''}, W${wb}A${ab}: memory ${(tm.mem*1e6).toFixed(1)} µs, compute ${(tm.comp*1e6).toFixed(1)} µs → <b>${tm.mem>tm.comp?'memory-bound':'compute-bound'}</b>, ${(t16/tt).toFixed(2)}× faster than W16A16. ${n<=8?'Decode: reading weights dominates, so weight-only W4A16 pays off.':n>=512?'Prefill or large batch: arithmetic dominates; W4A16 dequantizes to 16-bit and gains little, native low-precision activations (W8A8, W4A4) pay.':''} Real kernels add unpacking and scaling overheads; these numbers are a first-order model.`; }
  draw();
});
</script>
