  6. Boot
  Search for "LECTURE TEMPLATE" to find a copy-paste skeleton.

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --mist:#F2F4F6;      /* page */
  --sheet:#FFFFFF;     /* widget surface */
  --ink:#1B2433;       /* text */
  --ink-2:#4A5568;     /* secondary text */
  --rule:#D3D9E0;      /* hairlines */
  --cardinal:#9B1C1C;  /* course identity, primary action, focus */
  --attn:#0F766E;      /* attention / information moving between tokens */
  --mlp:#B45309;       /* MLP / experts / per-token compute */
  --slate:#64748B;     /* norms, residuals, structure */
  --hi:#E7B416;        /* selection highlight */
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
  --sans:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --step--1:.875rem; --step-0:1.0625rem; --step-1:1.3rem; --step-2:1.65rem; --step-3:2.2rem; --step-4:3.1rem;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--serif);font-size:var(--step-0);line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:var(--cardinal)}
:focus-visible{outline:2px solid var(--cardinal);outline-offset:2px;border-radius:2px}
button,input,select{font-family:var(--sans);font-size:var(--step--1)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--ink);color:#DCE3EC;padding:1.4rem 1.1rem 2rem;font-family:var(--sans)}
.side .brand{display:block;text-decoration:none;color:#fff;margin-bottom:1.4rem}
.side .brand b{display:block;font-family:var(--serif);font-weight:500;font-size:1.45rem;line-height:1.15}
.side .brand span{font-size:.8rem;color:#9FB0C3}
.side h4{font-weight:500;font-size:.78rem;color:#9FB0C3;margin:1.2rem 0 .35rem;letter-spacing:.01em}
.side nav a{display:grid;grid-template-columns:1.6rem 1fr;gap:.2rem;padding:.38rem .5rem;border-radius:6px;color:#DCE3EC;text-decoration:none;font-size:.9rem;line-height:1.3}
.side nav a:hover{background:#26324A}
.side nav a.on{background:#fff;color:var(--ink)}
.side nav a.soon{color:#71829A;cursor:default}
.side nav a.soon:hover{background:none}
.side nav a .n{font-variant-numeric:tabular-nums;opacity:.8}
.side .util a{grid-template-columns:1fr}
.menu-btn{display:none}
main{min-width:0}
.page{max-width:1080px;margin:0 auto;padding:2.4rem 2.4rem 6rem}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;z-index:30;transform:translateX(-105%);transition:transform .2s;padding-top:3.6rem}
  .side.open{transform:none}
  .menu-btn{display:inline-flex;position:fixed;top:.7rem;left:.7rem;z-index:40;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:.5rem .8rem}
  .page{padding:3.6rem 1.1rem 5rem}
  h1{font-size:2.3rem}
  .prose table.t,.widget table.t{display:block;overflow-x:auto;max-width:100%}
  .widget{overflow-x:auto}
  .archwrap{overflow-x:auto}
  .archwrap svg.arch{min-width:780px}
  .lhead .map{overflow-x:auto}
  .lhead .map svg{min-width:640px}
  .parts>div{border-right:0!important;margin-right:0!important;border-bottom:1px solid var(--rule);padding-bottom:1rem}
}

/* ---------- type ---------- */
h1,h2,h3{font-weight:500;line-height:1.15;margin:0}
h1{font-size:var(--step-4);letter-spacing:-.015em}
h2{font-size:var(--step-2);margin:3.2rem 0 .8rem;scroll-margin-top:1rem}
h3{font-size:var(--step-1);margin:1.8rem 0 .5rem}
.prose>p,.prose>ul,.prose>ol,.prose>h3,.prose>.note,.prose>.src,.prose>div>p{max-width:68ch}
.prose>table.t{max-width:880px}
.prose .katex-display{max-width:68ch}
.prose p{margin:.75rem 0}
.prose ul,.prose ol{padding-left:1.25rem}
.prose li{margin:.3rem 0}
.lede{font-size:var(--step-1);line-height:1.45;color:var(--ink-2);max-width:60ch}
.small{font-family:var(--sans);font-size:var(--step--1);color:var(--ink-2)}
.src{font-family:var(--sans);font-size:.78rem;color:var(--slate);margin-top:.4rem}
.katex-display{margin:1rem 0;overflow-x:auto;overflow-y:hidden;padding:.2rem 0}

/* callouts: the left border colour says what kind of note it is */
.note{border-left:3px solid var(--slate);padding:.6rem 1rem;margin:1.2rem 0;background:#E8ECF0;border-radius:0 6px 6px 0}
.note.why{border-color:var(--attn);background:#E3F0EE}
.note.hw{border-color:var(--cardinal);background:#F6E6E6}
.note.hw::before{content:"Assignment link";display:block;font-family:var(--sans);font-size:.78rem;font-weight:600;color:var(--cardinal)}
.note.why::before{content:"Why it matters";display:block;font-family:var(--sans);font-size:.78rem;font-weight:600;color:var(--attn)}

/* ---------- lecture header ---------- */
.lhead{padding-bottom:1.4rem;border-bottom:1px solid var(--rule)}
.lhead .map{max-width:860px;margin-top:1.4rem;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:.4rem .6rem}
.lhead .map figcaption{font-family:var(--sans);font-size:.8rem;color:var(--ink-2);padding:0 .3rem .2rem}
.lhead .num{font-family:var(--sans);font-size:var(--step--1);color:var(--cardinal);font-weight:600}
.lhead .who{font-family:var(--sans);font-size:var(--step--1);color:var(--ink-2);margin-top:.6rem}

.toc{font-family:var(--sans);font-size:.88rem;display:flex;flex-wrap:wrap;gap:.35rem;margin:1.2rem 0 0;padding:0;list-style:none}
.toc a{display:block;padding:.25rem .65rem;border:1px solid var(--rule);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--sheet)}
.toc a:hover{border-color:var(--ink)}
.keyideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:2rem 0;border-radius:8px;overflow:hidden}
.keyideas div{background:var(--sheet);padding:1rem 1.1rem;font-size:.98rem;line-height:1.45}

/* ---------- widgets ---------- */
.widget{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;margin:1.6rem 0;padding:1.1rem 1.2rem 1.2rem;font-family:var(--sans);font-size:.92rem;line-height:1.45}
.widget>.wt{font-weight:600;font-size:.95rem;margin-bottom:.15rem}
.widget>.wd{color:var(--ink-2);margin-bottom:.9rem}
.ctrls{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;align-items:center;margin:.4rem 0 .8rem}
.ctrls label{display:flex;gap:.5rem;align-items:center;color:var(--ink-2)}
.ctrls output{font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.5ch;font-weight:500}
input[type=range]{accent-color:var(--cardinal);width:150px}
.btn{border:1px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:6px;padding:.38rem .8rem;cursor:pointer}
.btn:hover{background:var(--mist)}
.btn.primary{background:var(--cardinal);border-color:var(--cardinal);color:#fff}
.btn.primary:hover{background:#7E1515}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--ink);border-radius:6px;overflow:hidden;max-width:100%}
.ctrls label{flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:var(--sheet);padding:.36rem .7rem;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.readout{font-variant-numeric:tabular-nums;background:var(--mist);border-radius:6px;padding:.6rem .8rem;margin-top:.7rem}
.readout b{font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
svg text{font-family:var(--sans)}
svg.chart{width:100%;height:auto;display:block}
.widget>svg.chart{max-width:820px}
table.t{font-family:var(--sans)}
.prose .katex-display{max-width:880px!important}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}

.tok{display:inline-block;padding:.3rem .55rem;margin:.15rem;border:1px solid var(--rule);border-radius:5px;cursor:pointer;background:var(--sheet);font-family:var(--serif);font-size:1rem}
.tok.on{border-color:var(--attn);box-shadow:0 0 0 2px var(--attn) inset}
.tok.masked{opacity:.35;cursor:not-allowed}

/* search */
.sbox{position:relative;margin:-.4rem 0 1rem}
.sbox input{width:100%;padding:.55rem 2rem .55rem .7rem;border-radius:7px;border:1px solid #3A4A64;background:#26324A;color:#fff;font-size:.9rem}
.sbox input::placeholder{color:#9FB0C3}
.sbox input:focus{outline:2px solid #fff;outline-offset:1px;background:#2E3B57}
.sbox kbd{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);font:600 .72rem var(--sans);color:#9FB0C3;border:1px solid #4A5A74;border-radius:4px;padding:0 .35rem}
.spanel{position:fixed;z-index:60;max-height:min(70vh,560px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 32px rgba(27,36,51,.22);font-family:var(--sans);padding:.3rem}
.spanel a,.sres{display:grid;grid-template-columns:auto 1fr;column-gap:.55rem;row-gap:.1rem;padding:.55rem .6rem;border-radius:7px;text-decoration:none;color:var(--ink)}

.spanel b,.sres b{font-weight:600;font-size:.9rem}

.ssnip{grid-column:2;color:var(--ink-2);font-size:.8rem;line-height:1.4}
.stype{grid-row:span 3;align-self:start;font-size:.68rem;font-weight:600;padding:.12rem .4rem;border-radius:4px;background:#E8ECF0;color:var(--ink-2);margin-top:.12rem;min-width:5.6rem;text-align:center}
.t-Section{background:#E3F0EE;color:var(--attn)}.t-Interactive{background:#FBF0E1;color:var(--mlp)}.t-Homework{background:#F6E6E6;color:var(--cardinal)}.t-Lecture{background:var(--ink);color:#fff}
.spanel a.sall{display:block;text-align:center;color:var(--cardinal);font-weight:600;font-size:.85rem;border-top:1px solid var(--rule);border-radius:0 0 7px 7px;margin-top:.2rem}
.snone{padding:.8rem;color:var(--ink-2);font-size:.88rem}
mark{background:#FBE7A1;color:inherit;border-radius:2px;padding:0 .05em}
mark.shl{background:#F7D560;box-shadow:0 0 0 2px #F7D560}
.sbig input{width:100%;max-width:760px;font:1.15rem var(--sans);padding:.75rem 1rem;border:1px solid var(--ink);border-radius:8px;margin:1.2rem 0 .8rem;background:var(--sheet);color:var(--ink)}
.sfilt{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1rem;font-family:var(--sans)}
.sfilt button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.3rem .75rem;cursor:pointer;font-size:.85rem;color:var(--ink)}
.sfilt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sres{max-width:860px;border-bottom:1px solid var(--rule);border-radius:0;padding:.8rem .4rem;font-family:var(--sans)}
.sres b{font-size:1rem}.sres .ssnip{font-size:.88rem}
.hlbar{position:fixed;bottom:1rem;right:1rem;z-index:55;display:flex;gap:.7rem;align-items:center;background:var(--ink);color:#fff;font:.85rem var(--sans);padding:.45rem .5rem .45rem .9rem;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.hlbar .btn{background:#fff}
.hlbar[hidden],.spanel[hidden]{display:none}
.sbox input:not(:placeholder-shown)+kbd,.sbox input:focus+kbd{display:none}
.search-btn{left:auto!important;left:6.6rem!important}
.looptag{font-size:.75rem;color:var(--slate)}
.loopbtn{padding:.25rem .7rem}
/* homework */
.stmt{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--ink);border-radius:0 8px 8px 0;padding:.4rem 1.1rem;margin:1rem 0;max-width:820px}
details.sol,details.hint{max-width:820px;margin:.8rem 0;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
details.sol>summary,details.hint>summary{cursor:pointer;padding:.55rem 1rem;font-family:var(--sans);font-size:.92rem;font-weight:600;color:var(--cardinal)}
details.hint>summary{color:var(--attn)}
details.key{max-width:1000px}
details.key>summary{color:var(--ink)}
details.key table.t td{vertical-align:top;font-size:.86rem}
details.sol>div,details.hint>div{padding:0 1.1rem .8rem;border-top:1px solid var(--rule)}
.fix{border-left:3px solid var(--hi);background:#FBF5E1;padding:.5rem .9rem;margin:.8rem 0;border-radius:0 6px 6px 0}
.fix::before{content:"Note on the write-up";display:block;font-family:var(--sans);font-size:.78rem;font-weight:600;color:#8A6A00}
/* quiz */
.quiz .q{margin:1rem 0 1.4rem}
.quiz .q p{margin:.2rem 0 .5rem;font-family:var(--serif);font-size:1.02rem}
.quiz .opt{display:block;width:100%;text-align:left;margin:.3rem 0;padding:.5rem .75rem;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);cursor:pointer;color:var(--ink)}
.quiz .opt:hover{border-color:var(--ink)}
.quiz .opt.right{border-color:var(--attn);background:#E3F0EE}
.quiz .opt.wrong{border-color:var(--cardinal);background:#F6E6E6}
.quiz .why{display:none;color:var(--ink-2);margin-top:.4rem}
.quiz .q.done .why{display:block}

/* home */
.hero{display:grid;grid-template-columns:1fr;gap:1.2rem}
.hero h1{max-width:21ch}
.archwrap{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:1rem}
.arch .cmp{cursor:pointer}
.arch .cmp rect{transition:fill .15s, stroke-width .15s}
.arch .cmp:hover rect,.arch .cmp:focus rect{stroke-width:2.5}
.arch .dim{opacity:.28}
.archinfo{font-family:var(--sans);min-height:4.5rem;padding:.6rem .2rem 0;font-size:.95rem}
.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:2px solid var(--ink);margin-top:2.6rem}
.parts>div{padding:1rem .9rem 0 0;border-right:1px solid var(--rule);margin-right:.9rem}
.parts>div:last-child{border-right:0}
.parts .pn{font-family:var(--sans);font-size:.8rem;color:var(--cardinal);font-weight:600}
.parts h3{font-size:1.15rem;margin:.2rem 0 .5rem}
.parts ul{list-style:none;padding:0;margin:0;font-family:var(--sans);font-size:.86rem}
.parts li{padding:.25rem 0;border-bottom:1px dotted var(--rule)}
.parts li a{text-decoration:none}
.parts li.soon{color:var(--slate)}
@media (max-width:900px){.parts{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.parts{grid-template-columns:1fr}}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:4rem;padding-top:1.2rem;border-top:1px solid var(--rule);font-family:var(--sans)}
.pager a{text-decoration:none;max-width:45%}
.pager small{display:block;color:var(--ink-2)}
pre.code{background:var(--ink);color:#E6EDF5;padding:1rem 1.1rem;border-radius:8px;overflow:auto;font-size:.82rem;line-height:1.5}
@keyframes flow{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.flowline{stroke-dasharray:6 6;animation:flow 1.6s linear 2}

<script>
/* =====================================================================
   3. FRAMEWORK
   ===================================================================== */
const COURSE = {
  parts: [
    {id:'I',   title:'Pre-training',        blurb:'Turn a fixed budget of data and compute into transferable capability.'},
    {id:'II',  title:'Model architecture',  blurb:'Which tokens activate, which context is reachable, what state is kept.'},
    {id:'III', title:'Efficient inference', blurb:'Less memory, more speed, lower cost, same behaviour.'},
    {id:'IV',  title:'Post-training',       blurb:'From pretrained model to useful assistant.'},
    {id:'V',   title:'Risks and vulnerabilities', blurb:'How models fail under attack and what defences can guarantee.'}
  ],
  lectures: [],
  /* Topics announced in Lecture 1 that have no notes yet. When a lecture
     arrives, register it with registerLecture() and delete its line here. */
  roadmap: [
    {part:'I',  title:'Multi-token prediction', note:'Supervise several future positions; is the gain worth the compute?'},
    {part:'II', title:'FlashAttention', note:'Dense attention with less memory traffic (linear attention is covered in Lecture 7).'},
    {part:'III',title:'Speculative decoding', note:'Draft model proposes, target verifies in parallel, distribution unchanged.'},
    {part:'III',title:'Learned cache compression', note:'Train a compact representation of a reusable corpus.'},
    {part:'IV', title:'Supervised fine-tuning and LoRA', note:'Curated examples; low-rank trainable updates.'},
    {part:'IV', title:'Learning from preferences', note:'Reward models and policy optimisation, or direct preference training.'},
    {part:'IV', title:'Distillation and self-distillation', note:'Teacher targets; filtered self-generated data (STaR).'},
    {part:'IV', title:'Recursive improvement', note:'When models generate, judge and refine their own data.'},
    {part:'V',  title:'Jailbreaking as adaptive search', note:'GCG, PAIR, TAP; robustness as a curve over attacker budget.'},
    {part:'V',  title:'Model extraction', note:'What an API reveals about the model behind it.'},
    {part:'V',  title:'Text watermarking', note:'Secret-biased sampling and whether the signal survives edits.'}
  ]
};
const WIDGETS = {};
COURSE.assignments = [];
/* Assignments: registerAssignment({id:'hw1', number:1, title, problems:[{id, title, lectures:['l2'], statement, solution, notes}]}) */
function registerAssignment(A){ COURSE.assignments.push(A); COURSE.assignments.sort((a,b)=>a.number-b.number); }
/* Supplements: add material to a lecture after it is registered */
function appendTo(lectureId, sectionId, html){ const L=COURSE.lectures.find(l=>l.id===lectureId); const sx=L&&L.sections.find(x=>x.id===sectionId); if(!sx) throw new Error('appendTo: no section '+lectureId+'/'+sectionId); sx.body+=html; }
function prependTo(lectureId, sectionId, html){ const L=COURSE.lectures.find(l=>l.id===lectureId); const sx=L&&L.sections.find(x=>x.id===sectionId); if(!sx) throw new Error('prependTo: no section '+lectureId+'/'+sectionId); sx.body=html+sx.body; }
function insertSection(lectureId, afterId, section){ const L=COURSE.lectures.find(l=>l.id===lectureId); const i=afterId===null? -1 : L.sections.findIndex(x=>x.id===afterId); if(afterId!==null && i<0) throw new Error('insertSection: no section '+afterId); L.sections.splice(i+1,0,section); }
function registerLecture(L){ COURSE.lectures.push(L); COURSE.lectures.sort((a,b)=>a.number-b.number); }
function widget(name, fn){ WIDGETS[name] = fn; }

/* ---------- tiny DOM helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') e.className=v; else if (k==='html') e.innerHTML=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k,v);
  }
  for (const k of kids.flat()) if (k!=null) e.append(k.nodeType? k : document.createTextNode(k));
  return e;
}
const SVGNS='http://www.w3.org/2000/svg';
function s(tag, attrs={}, text){ const e=document.createElementNS(SVGNS,tag); for(const[k,v] of Object.entries(attrs)) e.setAttribute(k,v); if(text!=null) e.textContent=text; return e; }

/* Slider: returns {get, set, el}. fmt formats the displayed value. */
function slider(parent, {label, min, max, step=1, value, fmt=(v)=>v, oninput}){
  const out = h('output'); const inp = h('input',{type:'range',min,max,step,value,'aria-label':label});
  const set = v => { inp.value=v; out.textContent = fmt(+inp.value); };
  inp.addEventListener('input',()=>{ out.textContent=fmt(+inp.value); oninput && oninput(+inp.value); });
  set(value); parent.append(h('label',{}, label, inp, out));
  return {get:()=>+inp.value, set, el:inp};
}
/* Segmented control */
function seg(parent, options, value, onchange, label){
  const wrap = h('div',{class:'seg',role:'group','aria-label':label||'options'});
  options.forEach(o=>{
    const b = h('button',{type:'button'}, o.label);
    if (o.value===value) b.classList.add('on');
    b.onclick=()=>{ $$('button',wrap).forEach(x=>x.classList.remove('on')); b.classList.add('on'); onchange(o.value); };
    wrap.append(b);
  });
  parent.append(label? h('label',{},label, wrap) : wrap); return wrap;
}
function box(el, title, desc){ el.classList.add('widget'); el.innerHTML=''; el.append(h('div',{class:'wt'},title)); if(desc) el.append(h('div',{class:'wd',html:desc})); return el; }
function sci(x, d=2){
  if (!isFinite(x)) return '∞';
  if (x===0) return '0';
  const a=Math.abs(x);
  if (a>=1e4 || a<1e-3){ const e=Math.floor(Math.log10(a)); const m=x/10**e; return `${m.toFixed(d>1?1:d)}×10${sup(e)}`; }
  return a>=100? x.toFixed(0) : a>=10 ? x.toFixed(1) : x.toFixed(d);
}
function sup(n){ const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c=>m[c]).join(''); }
function big(x){ // 1.4T, 280B, 13M
  const u=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
  for(const [v,l] of u) if (Math.abs(x)>=v) return (x/v>=100?(x/v).toFixed(0):(x/v).toFixed(1)).replace(/\.0$/,'')+l;
  return x.toFixed(0);
}
function bytes(b){ const u=['B','KiB','MiB','GiB','TiB']; let i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;} return (b>=100?b.toFixed(0):b.toFixed(1))+' '+u[i]; }
function randn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function softmax(a, tau=1){ const m=Math.max(...a); const e=a.map(x=>Math.exp((x-m)/tau)); const z=e.reduce((p,q)=>p+q,0); return e.map(x=>x/z); }

/* ---------- chart(): a small SVG plotter used by every widget ----------
   cfg = {w,h, x:{min,max,log,label,fmt}, y:{...}, series:[{pts:[[x,y]...], color, width, dash, label}],
          marks:[{x,y,color,r,label,anchor}], vlines:[{x,color,label}], hlines:[{y,color,label}] }       */
function chart(svg, cfg){
  const W=cfg.w||640, H=cfg.h||300, m={l:58,r:16,t:14,b:44, ...(cfg.margin||{})};
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.classList.add('chart'); svg.innerHTML='';
  const ax = (a, lo, hi) => a.log ? (v => lo + (Math.log10(v)-Math.log10(a.min))/(Math.log10(a.max)-Math.log10(a.min))*(hi-lo))
                                   : (v => lo + (v-a.min)/(a.max-a.min)*(hi-lo));
  const X = ax(cfg.x, m.l, W-m.r), Y = ax(cfg.y, H-m.b, m.t);
  const lin = v => Number.isInteger(v)? (Math.abs(v)>=1e4? sci(v) : String(v)) : (Math.abs(v)<1e-3||Math.abs(v)>=1e4? sci(v) : String(+v.toPrecision(3)));
  const p10 = v => { const e=Math.round(Math.log10(v)); return e===0?'1':e===1?'10':'10'+sup(e); };
  const ticks = a => {
    if (a.ticks) return a.ticks;
    if (a.log){ const t=[]; for(let e=Math.ceil(Math.log10(a.min)); e<=Math.floor(Math.log10(a.max)); e++) t.push(10**e); return t; }
    const span=a.max-a.min, raw=span/5, p=10**Math.floor(Math.log10(raw)), st=[1,2,2.5,5,10].map(k=>k*p).find(k=>span/k<=6);
    const t=[]; for(let v=Math.ceil(a.min/st)*st; v<=a.max+1e-9; v+=st) t.push(+v.toFixed(10)); return t;
  };
  const g = s('g',{'font-size':11,fill:'#4A5568'}); svg.append(g);
  for (const t of ticks(cfg.x)){ const x=X(t); g.append(s('line',{x1:x,x2:x,y1:m.t,y2:H-m.b,stroke:'#E6EAEE'})); g.append(s('text',{x, y:H-m.b+16,'text-anchor':'middle'}, (cfg.x.fmt||(cfg.x.log?p10:lin))(t))); }
  for (const t of ticks(cfg.y)){ const y=Y(t); g.append(s('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,stroke:'#E6EAEE'})); g.append(s('text',{x:m.l-6, y:y+4,'text-anchor':'end'}, (cfg.y.fmt||(cfg.y.log?p10:lin))(t))); }
  g.append(s('line',{x1:m.l,x2:W-m.r,y1:H-m.b,y2:H-m.b,stroke:'#1B2433'}));
  g.append(s('line',{x1:m.l,x2:m.l,y1:m.t,y2:H-m.b,stroke:'#1B2433'}));
  if (cfg.x.label) g.append(s('text',{x:(m.l+W-m.r)/2,y:H-8,'text-anchor':'middle',fill:'#1B2433'},cfg.x.label));
  if (cfg.y.label) g.append(s('text',{x:14,y:(m.t+H-m.b)/2,'text-anchor':'middle',fill:'#1B2433',transform:`rotate(-90 14 ${(m.t+H-m.b)/2})`},cfg.y.label));
  const clipId='c'+Math.random().toString(36).slice(2);
  const defs=s('defs'); const cp=s('clipPath',{id:clipId}); cp.append(s('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b})); defs.append(cp); svg.append(defs);
  const plotG = s('g',{'clip-path':`url(#${clipId})`}); svg.append(plotG);
  const inX = v => v>=cfg.x.min && v<=cfg.x.max;
  for (const v of (cfg.vlines||[])){ if(!inX(v.x)) continue; const x=X(v.x); plotG.append(s('line',{x1:x,x2:x,y1:m.t,y2:H-m.b,stroke:v.color||'#64748B','stroke-dasharray':'4 4'})); if(v.label) svg.append(s('text',{x:x+4,y:m.t+12,'font-size':11,fill:v.color||'#64748B'},v.label)); }
  for (const v of (cfg.hlines||[])){ const y=Y(v.y); plotG.append(s('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,stroke:v.color||'#64748B','stroke-dasharray':'4 4'})); if(v.label) svg.append(s('text',{x:W-m.r-4,y:y-5,'font-size':11,'text-anchor':'end',fill:v.color||'#64748B'},v.label)); }
  for (const se of (cfg.series||[])){
    const pts = se.pts.filter(p=>isFinite(p[0])&&isFinite(p[1])&&(!cfg.y.log||p[1]>0)&&(!cfg.x.log||p[0]>0));
    if (pts.length<2) continue;
    const d = pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(Math.max(Math.min(p[1], cfg.y.max*50), cfg.y.log? cfg.y.min/50 : cfg.y.min-1e6)).toFixed(1)).join(' ');
    plotG.append(s('path',{d,fill:'none',stroke:se.color||'#1B2433','stroke-width':se.width||2,'stroke-dasharray':se.dash||'', 'stroke-linejoin':'round'}));
  }
  for (const mk of (cfg.marks||[])){
    if(!inX(mk.x)) continue;
    const x=X(mk.x), y=Y(mk.y);
    svg.append(s('circle',{cx:x,cy:y,r:mk.r||5,fill:mk.fill||mk.color||'#9B1C1C',stroke:mk.stroke||'#fff','stroke-width':1.5}));
    if (mk.label) svg.append(s('text',{x:x+(mk.dx??8),y:y+(mk.dy??-8),'font-size':12,'font-weight':600,fill:mk.color||'#9B1C1C','text-anchor':mk.anchor||'start'},mk.label));
  }
  if (cfg.legend){ let lx=m.l+10, ly=m.t+14;
    for (const se of cfg.series.filter(z=>z.label)){ svg.append(s('line',{x1:lx,x2:lx+18,y1:ly-4,y2:ly-4,stroke:se.color,'stroke-width':3,'stroke-dasharray':se.dash||''})); svg.append(s('text',{x:lx+24,y:ly,'font-size':11.5,fill:'#1B2433'},se.label)); ly+=17; } }
  return {X,Y};
}

/* ---------- the architecture map (home hero + lecture headers) ---------- */
const COMPONENTS = {
  embed:{name:'Token embeddings', color:'#64748B', text:'Each token id becomes a vector in ℝᵈ (d = 4,096 in Llama 3 8B). Learned position embeddings are added here.', lectures:['l2','l7']},
  norm: {name:'RMSNorm', color:'#64748B', text:'Rescales the state to a controlled size before each sublayer reads it.', lectures:['l2']},
  attn: {name:'Attention', color:'#0F766E', text:'The only step where tokens exchange information. Its cost grows with context length, and its cache dominates decoding memory. Position enters here too (RoPE, ALiBi), and recurrent layers replace it with a fixed-size state.', lectures:['l2','l5','l6','l7','l8','l9']},
  mlp:  {name:'MLP', color:'#B45309', text:'Acts on each token separately and holds most of the weights. A mixture of experts replaces it with many MLPs and a router; quantization stores its weights in fewer bits.', lectures:['l2','l4','l9']},
  resid:{name:'Residual stream', color:'#1B2433', text:'Each sublayer adds an update; information and gradients can bypass every sublayer.', lectures:['l2']},
  head: {name:'Vocabulary projection and softmax', color:'#64748B', text:'The last position’s vector becomes scores over the vocabulary, then probabilities.', lectures:['l2']},
  optim:{name:'Training: loss, gradients, optimizer', color:'#9B1C1C', text:'Next-token log loss, backpropagation, then an update rule: SGD, Adam, Muon.', lectures:['l2','l3']},
  scale:{name:'Scale: parameters N, tokens D', color:'#9B1C1C', text:'Training compute C ≈ 6ND. Scaling laws decide how to split it.', lectures:['l1','l2']}
};
function archSVG({highlight=null, interactive=false, animate=false}={}){
  const on = k => !highlight || highlight.includes(k);
  const box = (k,x,y,w,hh,label,sub) => {
    const c=COMPONENTS[k].color, dim=on(k)?'':' dim';
    return `<g class="cmp${dim}" data-k="${k}" ${interactive?'tabindex="0" role="button" aria-label="'+COMPONENTS[k].name+'"':''}>
      <rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="7" fill="${on(k)&&highlight?c+'22':'#fff'}" stroke="${c}" stroke-width="1.5"/>
      <text x="${x+w/2}" y="${y+hh/2+(sub?-2:4)}" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2433">${label}</text>
      ${sub?`<text x="${x+w/2}" y="${y+hh/2+13}" text-anchor="middle" font-size="10.5" fill="#4A5568">${sub}</text>`:''}</g>`;
  };
  const plus = (cx,cy) => `<g class="cmp${on('resid')?'':' dim'}" data-k="resid"><circle cx="${cx}" cy="${cy}" r="11" fill="#fff" stroke="#1B2433" stroke-width="1.5"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="16" fill="#1B2433">+</text></g>`;
  const Y=150;
  return `<svg class="arch" viewBox="0 0 1080 300" role="img" aria-label="Decoder-only transformer: tokens, embeddings, L blocks of RMSNorm, attention, RMSNorm and MLP with residual additions, final RMSNorm, vocabulary projection and softmax">
  <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1B2433"/></marker></defs>
  <rect x="208" y="28" width="500" height="160" rx="12" fill="none" stroke="#9AA6B4" stroke-dasharray="5 4"/>
  <text x="696" y="48" text-anchor="end" font-size="13" fill="#4A5568">×L blocks, separate weights</text>
  <g stroke="#1B2433" stroke-width="2" fill="none">
    <path d="M80 ${Y} H 94" marker-end="url(#ah)"/>
    <path class="${animate?"flowline":""}" d="M190 ${Y} H 707"/>
    <path d="M707 ${Y} H 722" marker-end="url(#ah)"/>
    <path d="M232 ${Y} V 102"/><path d="M286 82 H 302" marker-end="url(#ah)"/><path d="M398 82 H 430 V ${Y-12}" marker-end="url(#ah)"/>
    <path d="M462 ${Y} V 102"/><path d="M516 82 H 532" marker-end="url(#ah)"/><path d="M618 82 H 650 V ${Y-12}" marker-end="url(#ah)"/>
    <path d="M800 ${Y} H 812" marker-end="url(#ah)"/><path d="M898 ${Y} H 912" marker-end="url(#ah)"/>
  </g>
  ${box('embed',20,Y-22,60,44,'Tokens')}
  ${box('embed',96,Y-26,94,52,'Embed','token → ℝᵈ')}
  ${box('norm',208+2,62,78,40,'RMSNorm')}
  ${box('attn',302,58,96,48,'Attention','mixes tokens')}
  ${plus(430,Y)}
  ${box('norm',438+2,62,78,40,'RMSNorm')}
  ${box('mlp',532,58,86,48,'MLP','per token')}
  ${plus(650,Y)}
  ${box('norm',724,Y-22,76,44,'RMSNorm')}
  ${box('head',812,Y-26,86,52,'Vocab','projection')}
  ${box('head',914,Y-26,76,52,'Softmax','p(· | x₁:ₜ)')}
  <text x="330" y="${Y+26}" font-size="11" fill="#4A5568">residual stream: H′ = H + Attn(RMSNorm(H))</text>
  ${box('optim',96,226,420,44,'Training loop','log loss → backprop → optimizer update of θ')}
  ${box('scale',540,226,450,44,'Scale','N parameters, D tokens, compute C ≈ 6ND')}
  </svg>`;
}

function renderHome(app){

      <li><b>Foundations.</b> What is the mechanism and its assumptions? Is the argument an exact derivation, an approximation, or an empirical regularity?</li>

  if (pid){ const t=document.getElementById(pid); if(t) setTimeout(()=>t.scrollIntoView(),30); } else window.scrollTo(0,0);
}

function renderQuiz(root, qs){

function renderRoadmap(app){

function renderAdd(app){
  app.innerHTML = `<h1>Adding a lecture</h1>

  <ol>
    <li>Open this file in a text editor and search for <b>LECTURE TEMPLATE</b>.</li>
    <li>Copy the template below the last <code>registerLecture</code> call and fill it in. <code>part</code> places it in the sidebar; <code>components</code> lights up the matching boxes in the architecture map (choose from <code>${Object.keys(COMPONENTS).join(', ')}</code>).</li>
    <li>Write section bodies as HTML inside <code>String.raw\`…\`</code> so LaTeX backslashes survive. Use <code>$$…$$</code> for display math and <code>\\(…\\)</code> inline.</li>
    <li>To add an interactive element, put <code>&lt;div data-widget="my-widget" data-opts='{"k":1}'&gt;&lt;/div&gt;</code> in a body, then define <code>widget('my-widget', (el, opts) =&gt; { … })</code> in the widgets block. Use the shared helpers <code>box</code>, <code>slider</code>, <code>seg</code> and <code>chart</code>.</li>
    <li>Delete the topic’s line from <code>COURSE.roadmap</code> so it stops appearing as upcoming.</li>

function mountWidgets(root){
  $$('[data-widget]', root).forEach(el=>{
    const fn = WIDGETS[el.dataset.widget];
    let opts={}; try{ opts = JSON.parse(el.dataset.opts||'{}'); }catch(e){}
    if (fn){ try{ fn(el, opts); }catch(err){ console.error(err); el.textContent='This interactive element failed to load: '+err.message; } }

}
function renderMath(root){
  if (window.renderMathInElement) renderMathInElement(root,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false});
}
function parseRoute(){
  const p = location.hash.replace(/^#\/?/,'').split('/');
  if (p[0]==='lecture') return {page:'lecture', lecture:p[1], section:p[2]};
  if (p[0]==='roadmap'||p[0]==='add') return {page:p[0]};
  if (p[0]==='hw') return {page:'hw', hw:p[1], section:p[2]};

}
let lastLecture=null;
function route(){

  if (r.page==='lecture'){
    const L = lectureById(r.lecture);
    if (!L){ app.innerHTML='<h1>Lecture not found</h1><p class="lede">That lecture has no notes yet. <a href="#/roadmap">See the roadmap</a>.</p>'; return; }
    if (lastLecture===L.id && r.section){ const t=document.getElementById(r.section); if(t){ t.scrollIntoView(); return; } }
    lastLecture=L.id; renderLecture(app, L, r.section); document.title=`Lecture ${L.number}: ${L.title} — MS&E 319`;
  } else if (r.page==='hw'){
    lastLecture=null; const A=COURSE.assignments.find(a=>a.id===r.hw);
    if(!A){ app.innerHTML='<h1>Assignment not found</h1>'; return; }
    renderHW(app, A, r.section); document.title=`Homework ${A.number} — MS&E 319`;
  } else {
    lastLecture=null; window.scrollTo(0,0);
    if (r.page==='roadmap') renderRoadmap(app); else if (r.page==='add') renderAdd(app); else renderHome(app);
    renderMath(app); document.title='MS&E 319 — interactive notes';
  }
}

<script>
/* =====================================================================
   SITE-WIDE SEARCH
   Builds an index from everything registered (lectures, sections,
   interactive elements, quizzes, homework, roadmap) when the page loads,
   so new lectures and assignments are searchable with no extra work.
   ===================================================================== */
const SEARCH = { docs:[], pending:null };
const GREEK = {alpha:'α',beta:'β',gamma:'γ',delta:'δ',Delta:'Δ',theta:'θ',tau:'τ',sigma:'σ',Sigma:'Σ',mu:'μ',eta:'η',ell:'ℓ',varepsilon:'ε',epsilon:'ε',lambda:'λ',kappa:'κ',rho:'ρ',varphi:'φ',phi:'φ',Phi:'Φ',pi:'π',xi:'ξ',top:'ᵀ',odot:'⊙',le:'≤',leq:'≤',ge:'≥',geq:'≥',approx:'≈',propto:'∝',infty:'∞',sum:'Σ',prod:'Π',lt:'<',gt:'>',times:'×',cdot:'·',to:'→'};
const DROP = new Set(['operatorname','text','mathrm','mathbb','mathcal','mathbf','hat','tilde','underbrace','overbrace','frac','tfrac','dfrac','sqrt','left','right','big','Big','bigg','Bigg','quad','qquad','begin','end','aligned','cases','mid','iff','implies','Longrightarrow','Rightarrow','limits','displaystyle','boxed','star','prime']);
function plainText(html){
  let t = String(html||'')
    .replace(/<div[^>]*data-widget[^>]*><\/div>/g,' ')
    .replace(/<[^>]+>/g,' ')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&[a-z]+;/g,' ');
  t = t.replace(/\\([a-zA-Z]+)/g,(m,n)=> GREEK[n]? GREEK[n] : DROP.has(n)? ' ' : ' '+n+' ')
       .replace(/\\[(),;!{}\[\]| ]/g,' ').replace(/\\/g,' ').replace(/\$\$/g,' ').replace(/[{}^_&]/g,' ');
  return t.replace(/\s+/g,' ').trim();
}
function widgetMeta(){
  const out={};
  for (const [name,fn] of Object.entries(WIDGETS)){
    const m = fn.toString().match(/box\(el,\s*'((?:[^'\\]|\\.)*)'(?:,\s*'((?:[^'\\]|\\.)*)')?/);
    if (m) out[name] = {title:m[1], desc:plainText(m[2]||'')};
  }
  return out;
}
function buildSearchIndex(){
  const D=[]; const W=widgetMeta(); const add=d=>{ d.lt=d.title.toLowerCase(); d.lx=(d.text||'').toLowerCase(); D.push(d); };
  for (const L of COURSE.lectures){
    const crumb=`Lecture ${L.number}: ${L.title}`;
    add({type:'Lecture', title:crumb, crumb:`Part ${L.part}`, url:`#/lecture/${L.id}`, text:plainText([L.summary,L.oneLine,(L.keyIdeas||[]).join(' '),L.lecturer].join(' '))});
    for (const sx of L.sections){
      add({type:'Section', title:sx.title, crumb, url:`#/lecture/${L.id}/${sx.id}`, text:plainText(sx.body)});
      for (const m of sx.body.matchAll(/data-widget="([^"]+)"/g)){
        const w=W[m[1]]; if(!w) continue;
        add({type:'Interactive', title:w.title, crumb:`${crumb} › ${sx.title}`, url:`#/lecture/${L.id}/${sx.id}`, text:w.desc, widget:m[1]});
      }
    }
    (L.quiz||[]).forEach((q,i)=>add({type:'Quiz', title:plainText(q.q), crumb:`${crumb} › Check yourself`, url:`#/lecture/${L.id}/check`, text:plainText(q.options.join(' ')+' '+q.why)}));
    if (L.sources) add({type:'Sources', title:`Sources for Lecture ${L.number}`, crumb, url:`#/lecture/${L.id}`, text:L.sources.join('; ')});
  }
  for (const A of COURSE.assignments){
    add({type:'Homework', title:`Homework ${A.number}: ${A.title}`, crumb:'Assignments', url:`#/hw/${A.id}`, text:plainText(A.summary+' '+(A.intro||''))});
    for (const P of A.problems){
      add({type:'Homework', title:P.title, crumb:`Homework ${A.number}`, url:`#/hw/${A.id}/${P.id}`, text:plainText([P.statement,P.hint,P.solution,P.key].join(' '))});
      for (const m of (P.after||'').matchAll(/data-widget="([^"]+)"/g)){ const w=W[m[1]]; if(w) add({type:'Interactive', title:w.title, crumb:`Homework ${A.number} › ${P.title}`, url:`#/hw/${A.id}/${P.id}`, text:w.desc}); }
    }
  }
  COURSE.roadmap.forEach(r=>add({type:'Roadmap', title:r.title, crumb:`Upcoming, Part ${r.part}`, url:'#/roadmap', text:r.note}));
  for (const [k,c] of Object.entries(COMPONENTS)) add({type:'Component', title:c.name, crumb:'Architecture map (home)', url:`#/lecture/${c.lectures[c.lectures.length-1]}`, text:c.text});
  add({type:'Page', title:'Adding a lecture', crumb:'About these notes', url:'#/add', text:'template registerLecture widget extend future lectures how to add'});
  add({type:'Page', title:'Course roadmap', crumb:'About these notes', url:'#/roadmap', text:'upcoming topics status awaiting slides'});
  SEARCH.docs=D;
}
const TYPE_W = {Lecture:1.3, Section:1.15, Homework:1.15, Interactive:1.05, Component:1, Quiz:.8, Roadmap:.8, Sources:.6, Page:.7};
function terms(q){ return q.toLowerCase().normalize('NFKC').split(/[^\p{L}\p{N}ᵀ⊙≤≥≈∝∞Σ'-]+/u).filter(x=>x.length>1 || /[α-ωΑ-Ω0-9]/.test(x)); }
function countOcc(hay, n){ let c=0, i=hay.indexOf(n); while(i>=0 && c<20){ c++; i=hay.indexOf(n,i+n.length); } return c; }
function searchDocs(q){
  const T=terms(q); if(!T.length) return [];
  const phrase=q.toLowerCase().trim();
  const score=(d,all)=>{ let sc=0, hits=0;
    for (const t of T){ const inT=d.lt.includes(t), c=countOcc(d.lx,t);
      if(inT||c) hits++;
      if(inT) sc += 10 + (new RegExp('(^|[^\\p{L}])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'u').test(d.lt)?5:0);
      if(c) sc += 2 + Math.min(c,6); }
    if (all && hits<T.length) return 0; if(!hits) return 0;
    if (T.length>1){ if(d.lt.includes(phrase)) sc+=14; else if(d.lx.includes(phrase)) sc+=8; }
    return sc*(TYPE_W[d.type]||1)*(hits/T.length); };
  let R=SEARCH.docs.map(d=>({d,s:score(d,true)})).filter(x=>x.s>0);
  let partial=false; if(!R.length){ R=SEARCH.docs.map(d=>({d,s:score(d,false)})).filter(x=>x.s>0); partial=true; }
  R.sort((a,b)=>b.s-a.s); R.partial=partial; R.terms=T; return R;
}
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function markTerms(s, T){ let out=esc(s); for(const t of [...T].sort((a,b)=>b.length-a.length)){ const re=new RegExp('('+esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); out=out.replace(re,'\u0001$1\u0002'); } return out.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>'); }
function snippet(d, T, len=150){
  const x=d.text||''; if(!x) return ''; const lx=d.lx; let pos=-1;
  for(const t of T){ const i=lx.indexOf(t); if(i>=0 && (pos<0||i<pos)) pos=i; }
  if(pos<0) return markTerms(x.slice(0,len)+(x.length>len?'…':''),T);
  const a=Math.max(0,pos-55), b=Math.min(x.length,a+len);
  return (a>0?'…':'')+markTerms(x.slice(a,b),T)+(b<x.length?'…':'');
}

/* ---------- quick-results dropdown ---------- */
let sActive=-1, sResults=[];
function openSearchPanel(){ const p=$('#sPanel'), inp=$('#q'); const r=inp.getBoundingClientRect();
  p.style.left=Math.max(8,r.left)+'px'; p.style.top=(r.bottom+6)+'px'; p.style.width=Math.min(460, window.innerWidth-16-Math.max(8,r.left)+0)+'px'; p.hidden=false; inp.setAttribute('aria-expanded','true'); }
function closeSearchPanel(){ const p=$('#sPanel'); if(p){ p.hidden=true; $('#q').setAttribute('aria-expanded','false'); } sActive=-1; }
function renderQuick(){
  const q=$('#q').value.trim(), p=$('#sPanel');
  if(q.length<2){ closeSearchPanel(); return; }
  const R=searchDocs(q); sResults=R.slice(0,8); sActive=sResults.length?0:-1;
  p.innerHTML = sResults.length ? sResults.map((x,i)=>`<a role="option" id="sopt${i}" class="sopt${i===sActive?' on':''}" href="${x.d.url}" data-i="${i}"><span class="stype t-${x.d.type}">${x.d.type}</span><b>${markTerms(x.d.title,R.terms)}</b><small>${esc(x.d.crumb)}</small><span class="ssnip">${snippet(x.d,R.terms,110)}</span></a>`).join('')
      + `<a class="sall" href="#/search/${encodeURIComponent(q)}">See all ${R.length} result${R.length===1?'':'s'}${R.partial?' (partial matches)':''}</a>`
    : `<div class="snone">No matches for “${esc(q)}”. Try fewer or shorter words.</div>`;
  $$('a.sopt',p).forEach(a=>a.addEventListener('click',()=>{ SEARCH.pending=R.terms; closeSearchPanel(); if(a.getAttribute('href')===location.hash) setTimeout(route,0); }));
  $('#q').setAttribute('aria-activedescendant', sActive>=0?'sopt'+sActive:'');
  openSearchPanel();
}
function moveActive(dlt){ if(!sResults.length) return; sActive=(sActive+dlt+sResults.length)%sResults.length; $$('#sPanel a.sopt').forEach((a,i)=>a.classList.toggle('on',i===sActive)); $('#q').setAttribute('aria-activedescendant','sopt'+sActive); $('#sopt'+sActive).scrollIntoView({block:'nearest'}); }

/* ---------- full results page: #/search/<query> ---------- */
function renderSearchPage(app, q){
  const types=['All','Section','Interactive','Homework','Quiz','Lecture','Roadmap','Component','Sources'];
  app.innerHTML=`<h1>Search</h1><div class="sbig"><input id="q2" type="search" value="${esc(q)}" placeholder="Search every lecture, interactive element, quiz and homework problem" aria-label="Search the notes"></div><div class="sfilt" id="sfilt"></div><div id="sout"></div>`;
  let filt='All';
  const draw=()=>{ const qq=$('#q2').value.trim(); const R=qq?searchDocs(qq):[]; const counts={}; R.forEach(x=>counts[x.d.type]=(counts[x.d.type]||0)+1);
    $('#sfilt').innerHTML=types.filter(t=>t==='All'||counts[t]).map(t=>`<button type="button" class="${t===filt?'on':''}" data-t="${t}">${t==='Section'?'Lecture sections':t}${t==='All'?` (${R.length})`:` (${counts[t]})`}</button>`).join('');
    $$('#sfilt button').forEach(b=>b.onclick=()=>{ filt=b.dataset.t; draw(); });
    const S=R.filter(x=>filt==='All'||x.d.type===filt);
    $('#sout').innerHTML = !qq? '<p class="small">Type to search. Tip: press / anywhere to jump to the search box.</p>'
      : !S.length? `<p class="lede">No matches for “${esc(qq)}”.</p>`
      : (R.partial?'<p class="small">No result contains every word; showing partial matches.</p>':'') + S.map(x=>`<a class="sres" href="${x.d.url}"><span class="stype t-${x.d.type}">${x.d.type==='Section'?'Section':x.d.type}</span><b>${markTerms(x.d.title,R.terms)}</b><small>${esc(x.d.crumb)}</small><span class="ssnip">${snippet(x.d,R.terms,240)}</span></a>`).join('');
    $$('#sout a.sres').forEach(a=>a.addEventListener('click',()=>{ SEARCH.pending=R.terms; if(a.getAttribute('href')===location.hash) setTimeout(route,0); }));
    if (qq!==q) history.replaceState(null,'',`#/search/${encodeURIComponent(qq)}`); q=qq; };
  $('#q2').addEventListener('input',draw); draw(); $('#q2').focus();
  document.title=`Search: ${q} — MS&E 319`;
}

/* ---------- highlight matches on the destination page ---------- */
function highlightIn(root, T){
  if(!root||!T||!T.length) return null;
  const re=new RegExp('('+T.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|')+')','gi');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=> n.parentElement.closest('.katex,script,style,svg,button,input,textarea,mark,.widget .ctrls,details:not([open])')? NodeFilter.FILTER_REJECT : re.test(n.nodeValue)? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode); let first=null;
  nodes.slice(0,400).forEach(n=>{ re.lastIndex=0; const frag=document.createDocumentFragment(); let last=0, m; const v=n.nodeValue;
    while((m=re.exec(v))){ frag.append(v.slice(last,m.index)); const mk=document.createElement('mark'); mk.className='shl'; mk.textContent=m[0]; frag.append(mk); if(!first) first=mk; last=m.index+m[0].length; }
    frag.append(v.slice(last)); n.replaceWith(frag); });
  return first;
}
function applySearchHighlight(){
  const T=SEARCH.pending; if(!T) return; SEARCH.pending=null;
  setTimeout(()=>{ const r=parseRoute(); const root = r.section? document.getElementById(r.section) : $('#app');
    const first=highlightIn(root,T); if(first) first.scrollIntoView({block:'center'}); else if(root) root.scrollIntoView();
    const bar=$('#hlBar'); bar.hidden=false; bar.querySelector('span').textContent=`Highlighting “${T.join(' ')}”`; }, 120);
}
function clearHighlights(){ $$('mark.shl').forEach(m=>m.replaceWith(document.createTextNode(m.textContent))); $('#app').normalize(); $('#hlBar').hidden=true; }

/* ---------- wire into the router ---------- */
const _routeBase = route;
route = function(){
  const r=parseRoute(); $('#hlBar') && ($('#hlBar').hidden=true);
  if (r.page==='search'){ renderNav(r); $('#side').classList.remove('open'); lastLecture=null; renderSearchPage($('#app'), r.q||''); return; }
  _routeBase(); applySearchHighlight();
};
const _parseBase = parseRoute;
parseRoute = function(){ const p=location.hash.replace(/^#\/?/,'').split('/'); if(p[0]==='search') return {page:'search', q:decodeURIComponent(p.slice(1).join('/'))}; return _parseBase(); };

document.addEventListener('DOMContentLoaded',()=>{
  buildSearchIndex();
  const inp=$('#q');
  inp.addEventListener('input',renderQuick);
  inp.addEventListener('focus',()=>{ if(inp.value.trim().length>1) renderQuick(); });
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); moveActive(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); moveActive(-1); }
    else if(e.key==='Enter'){ e.preventDefault(); const q=inp.value.trim(); if(!q) return; const T=terms(q);
      if(sActive>=0 && sResults[sActive]){ SEARCH.pending=T; const u=sResults[sActive].d.url; if(location.hash===u) route(); else location.hash=u; }
      else location.hash=`#/search/${encodeURIComponent(q)}`; closeSearchPanel(); inp.blur(); }
    else if(e.key==='Escape'){ closeSearchPanel(); inp.blur(); } });
  document.addEventListener('click',e=>{ if(!e.target.closest('#sPanel,#q')) closeSearchPanel(); });
  window.addEventListener('resize',closeSearchPanel);
  $('#side').addEventListener('scroll',closeSearchPanel);
  document.addEventListener('keydown',e=>{
    const typing=e.target.closest('input,textarea,select,[contenteditable]');
    if((e.key==='/' && !typing) || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k')){ e.preventDefault();
      if(window.innerWidth<=900){ $('#side').classList.add('open'); $('#menuBtn').setAttribute('aria-expanded','true'); }
      inp.focus(); inp.select(); } });
  $('#hlBar button').addEventListener('click',clearHighlights);
  $('#searchBtn').addEventListener('click',()=>{ $('#side').classList.add('open'); $('#menuBtn').setAttribute('aria-expanded','true'); setTimeout(()=>inp.focus(),220); });
});
</script>
<script>
/* =====================================================================
   4. LECTURES — one registerLecture({...}) per lecture.
   ===================================================================== */

registerLecture({

  sections: [

/* ------------------------------------------------------------------ L1 */
registerLecture({
  id:'l1', number:1, part:'I', title:'Course Overview', short:'Course overview',
  lecturer:'Amin Saberi, with Anay Mehrotra, Amin Karbasi and Grigoris Velegkas',
  components:['scale','mlp','attn','optim'],

  keyIdeas:[
    'Experiments tell you what works where you tested; theory predicts what transfers outside that regime.',
    'For every method, ask what it saves, what approximation buys the saving, and how you would falsify a claimed extension.',
    'Many efficiency ideas trade one resource for another: training compute for inference cost, memory for compute, precision for bandwidth.'
  ],
  sections:[
    {id:'scaling', title:'Pre-training: compute is an allocation problem', body:String.raw`
      <p>Fix a training budget. Training compute is roughly \(C_{\text{train}} \approx \kappa N D\): parameter count times training tokens. Making the model larger forces it to see fewer tokens. An empirical loss model estimates the returns to each:</p>
      $$ L(N,D) = L_\infty + A N^{-\alpha} + B D^{-\beta} $$
      <p>Substituting \(D = C/(\kappa N)\) turns the question into a one-variable optimisation: the best split balances the marginal benefit of more parameters against the marginal benefit of more data. Lecture 2 works this out and tests it against real training runs.</p>
      <p>Deployment changes the answer. Lifetime compute is \(J = C_{\text{train}} + M\,c(N)\), where \(M\) is the number of future tokens served. A smaller model trained for longer pays more up front but accumulates inference cost more slowly, so heavy use favours it.</p>
      <div data-widget="lifetime" data-opts='{"compact":true}'></div>`},
    {id:'moe', title:'Architecture: decouple capacity from compute', body:String.raw`
      <p>In a dense transformer every token uses every feed-forward weight, so widening the MLP raises both what a layer can store and what every token must compute. A mixture of experts stores several feed-forward networks and sends each token to only a few. Mixtral, for example, has 8 experts per sparse layer and selects 2, giving 47 billion stored parameters but 13 billion active for any one token.</p>
      <div data-widget="router" data-opts='{"compact":true}'></div>
      <p>The router keeps the \(k\) largest scores, \(T(x) = \operatorname{TopK}(W_r x, k)\). Whether that works in practice depends on load balance, memory and communication, which set wall-clock time. Lecture 4 covers all three.</p>`},
    {id:'quant', title:'Inference: quantization and rotation', body:String.raw`
      <p>Inference repeatedly moves large arrays of numbers, so shorter numerical representations reduce both storage and memory traffic. A quantizer maps a real vector \(x \in \mathbb{R}^d\) to a short code \(Q(x)\) and reconstructs an approximation \(\hat x\). The design question is which information the code must keep. For attention, the answer is geometry: distances and inner products should change little.</p>
      $$ \|x-y\|_2 \approx \|\hat x - \hat y\|_2, \qquad \langle x, y\rangle \approx \langle \hat x, \hat y\rangle $$
      <p>A few unusually large coordinates can dominate rounding error. A random rotation \(z = Rx\) preserves lengths, angles and inner products exactly but spreads the vector’s energy across coordinates, which makes coordinatewise rounding far less fragile. Try it.</p>
      <div data-widget="rotation-quant"></div>
      <p>TurboQuant (Zandieh et al., 2025) puts this together: rotate, apply an optimised scalar quantizer per coordinate, then correct the residual with QJL. Theoretically its error decays within a small constant of the information-theoretic optimum. Experimentally it matched full-precision long-context performance at 3.5 bits per channel. <a href="#/lecture/l8">Lecture 8</a> builds all of this up step by step, and <a href="#/lecture/l9">Lecture 9</a> turns to weights and activations.</p>`},
    {id:'distill', title:'Post-training: distillation', body:String.raw`
      <p>A large teacher produces training targets and a smaller student learns to imitate them, spending more compute during training to use less at inference (Hinton, Vinyals and Dean, 2015). Paradoxically, a self-distilled student with the same architecture and no new labels can generalise better than its teacher. A simple spectral model shows why: after \(t\) rounds, predictions are \(\hat y^{(t)} = S^t y\), so repeated distillation progressively damps the directions the learning operator \(S\) shrinks, acting as regularisation.</p>
      <p>Self-distillation also improves through selection: the model generates candidate answers, a verifier keeps the strongest, and the model trains on the filtered set (STaR, Zelikman et al., 2022). Selection is what turns generated answers into useful supervision.</p>`},
    {id:'jailbreak', title:'Risks: jailbreaking is adaptive search', body:String.raw`
      <p>A refusal to one direct request measures one prompt, not robustness. An attacker \(A\) proposes prompts \(x_t\), the target system \(M\) responds, and an evaluator \(J\) scores the result; the attacker wins if some \(t \le Q\) gives \(J(x_t, M(x_t)) = 1\). Greedy Coordinate Gradient searches suffixes with gradients; PAIR follows one feedback-driven chain; TAP branches, scores and prunes.</p>
      $$ \text{ASR}(Q) = \frac{1}{n}\sum_{i} \mathbb{1}\{\exists\, t \le Q : J_i(x_{it}, M(x_{it})) = 1\} $$
      <div data-widget="asr-curve"></div>
      <p>Every reported number depends on the behaviour set, attacker access, query budget, decoding rule and safety wrapper, and the evaluator and its threshold. Report the whole curve.</p>`}
  ],
  quiz:[
    {q:'A mixture-of-experts layer with 8 experts, 2 active per token, mainly changes which quantity relative to a dense layer of the same per-token cost?', options:['Compute per token','Stored parameters','Context length'], answer:1, why:'Per-token compute stays tied to the 2 active experts; stored capacity grows with all 8.'},
    {q:'Why apply a random rotation before scalar quantization?', options:['It reduces the vector’s norm','It spreads energy evenly across coordinates while preserving inner products','It removes the need to store a scale'], answer:1, why:'Rotation is an isometry, so geometry is unchanged, but no single coordinate dominates rounding error.'},
    {q:'An attack success rate is reported as 2%. What is missing for it to mean anything?', options:['The model’s parameter count','The attacker’s access, query budget, behaviour set and evaluator','The training data'], answer:1, why:'Robustness is a curve over attacker capability; a single point hides the setup that produced it.'}
  ],
  sources:['Kaplan et al. (2020)','Hoffmann et al. (2022)','Sardana et al. (2024)','Shazeer et al. (2017)','Fedus, Zoph and Shazeer (2022)','Jiang et al. (2024)','Zandieh et al. (2025)','Hinton, Vinyals and Dean (2015)','Furlanello et al. (2018)','Mobahi, Farajtabar and Bartlett (2020)','Zelikman et al. (2022)','Mazeika et al. (2024)','Zou et al. (2023)','Chao et al. (2023)','Mehrotra et al. (2024)']
});

/* ------------------------------------------------------------------ L2 */
registerLecture({
  id:'l2', number:2, part:'I', title:'Architecture, Training, and Scaling Laws', short:'Architecture and scaling laws',
  lecturer:'Anay Mehrotra',
  components:['embed','norm','attn','mlp','resid','head','scale'],
  oneLine:'What a decoder-only transformer computes, how it is trained, and how to split compute between N and D.',
  summary:'What does a modern LLM with N parameters look like, how is it trained on D tokens, and how should a fixed budget be split between the two? The lecture ends with a decision: fund a 280B model on 300B tokens, or a 70B model on 1.4T tokens.',
  keyIdeas:[
    'Attention is the only step where tokens exchange information; the MLP then works on each token separately.',
    'Softmax is not arbitrary: monotonicity, symmetry, continuity, positivity and difference-only odds leave only the temperature free.',
    'Minimising expected log loss gives H(P) + KL(P‖Q), so the unique optimum is the true distribution.',
    'At fixed compute, the best allocation satisfies αAN⁻ᵅ = βBD⁻ᵝ. Chinchilla’s fit gives roughly 20 tokens per parameter.'
  ],
  sections:[
    {id:'blackbox', title:'A language model as a black box', body:String.raw`
      <p>A prefix determines a distribution over the next token, \(p_\theta(\cdot \mid x_{1:T})\). Generation chooses a token, appends it, and repeats, with the same parameters \(\theta\) at every step.</p>
      <div data-widget="next-token"></div>
      <p>The example comes from work on subject–verb agreement (Linzen, Dupoux and Goldberg, 2016): to predict “are”, the model must link the verb to “keys”, three tokens back, rather than to the nearer “cabinet”.</p>`},
    {id:'attention', title:'Attention', body:String.raw`
      <p>Attention takes \(T\) vectors and returns \(T\) vectors; output \(o_t\) may use inputs \(h_1,\dots,h_t\) only. Each hidden state produces three learned projections: a query (what it looks for), a key (what it is about) and a value (what it passes on).</p>
      $$ q_t = W_Q^\top h_t,\quad k_t = W_K^\top h_t,\quad v_t = W_V^\top h_t $$
      $$ s_{tj} = \frac{q_t^\top k_j}{\sqrt{d_k}},\qquad a_{tj} = \frac{e^{s_{tj}}}{\sum_{j'\le t} e^{s_{tj'}}}\ (j\le t),\qquad o_t = \sum_{j\le t} a_{tj} v_j $$
      <p>The causal mask sets \(a_{tj}=0\) for \(j>t\). Pick a query token below to see what it can read and how it weights it. The vectors are small hand-built examples, chosen so that “are” finds the plural subject.</p>
      <div data-widget="attention-map"></div>
      <h3>Why a dot product, and why divide by \(\sqrt{d_k}\)?</h3>
      <p>Dot products measure similarity: for unit vectors, \(\|q-k\|_2^2 = 2 - 2q^\top k\), so a larger dot product means a smaller distance. The scaling is about variance. If \(q, k \sim \mathcal N(0, I_{d_k})\) independently, then \(\operatorname{Var}(q^\top k) = d_k\). Without the division, scores grow with width, softmax saturates onto one key, and gradients vanish.</p>
      <div data-widget="scale-variance"></div>`},
    {id:'softmax', title:'Why softmax?', body:String.raw`
      <p>For finite scores and a temperature \(\tau>0\), define \(P_i(s) = e^{s_i/\tau} / \sum_j e^{s_j/\tau}\). The claim is that only softmax, for some \(\tau\), satisfies four properties together with one structural assumption:</p>
      <ul><li><b>Monotonicity:</b> higher score, higher probability.</li><li><b>Symmetry:</b> permuting scores permutes probabilities.</li><li><b>Continuity:</b> small score changes give small probability changes.</li><li><b>Positivity:</b> every option gets positive probability.</li><li><b>Odds depend on differences:</b> \(P_i(s)/P_j(s) = g(s_i - s_j)\) for some \(g>0\).</li></ul>
      <p>Take three scores \(s_A = x+y,\ s_B = y,\ s_C = 0\). Then</p>
      $$ g(x+y) = \frac{P_A}{P_C} = \frac{P_A}{P_B}\cdot\frac{P_B}{P_C} = g(x)\,g(y). $$
      <p>Let \(f = \log g\), so \(f(x+y) = f(x)+f(y)\). On rationals this forces \(f(m/n) = (m/n)c\) with \(c = f(1)\); continuity extends it to \(f(x) = cx\), so \(g(x) = e^{cx}\). Monotonicity gives \(g(1)>1\), hence \(c>0\); write \(\tau = 1/c\). Normalising the odds yields softmax. These properties leave only the temperature free.</p>
      <div class="note hw">Problem 1(c) differentiates this map: \(\partial p_i/\partial x_j = p_i(\delta_{ij} - p_j)\), so \(\nabla_x L = p \odot (g - (g^\top p)\mathbf 1)\), and with cross-entropy against a target \(y\) the gradient collapses to \(p - y\).</div>`},
    {id:'block', title:'MLP, normalisation and the full block', body:String.raw`
      <p>The same MLP acts separately on every position: \(\operatorname{MLP}(h) = W_2\,\varphi(W_1 h)\) with \(W_1 \in \mathbb R^{d_{\text{ff}}\times d}\), \(W_2 \in \mathbb R^{d\times d_{\text{ff}}}\) and a nonlinearity \(\varphi\). One block combines both sublayers with pre-normalisation and residual additions:</p>
      $$ H' = H + \operatorname{Attn}(\operatorname{RMSNorm}(H)),\qquad H'' = H' + \operatorname{MLP}(\operatorname{RMSNorm}(H')) $$
      <p>Residuals let information and gradients bypass each sublayer. Because updates accumulate, the state’s scale can drift, so each sublayer reads a normalised copy (Zhang and Sennrich, 2019):</p>
      $$ \operatorname{RMSNorm}(h) = \frac{g \odot h}{\sqrt{d^{-1}\|h\|_2^2 + \varepsilon}} $$
      <p>After \(L\) blocks the last position alone predicts the next token: \(z_T = \operatorname{RMSNorm}(h_T^{(L)})\), \(s_T = W_{\text{vocab}} z_T\), \(p_\theta = \operatorname{softmax}(s_T)\). Step through one prediction:</p>
      <div data-widget="one-prediction"></div>
      <table class="t"><thead><tr><th>Model</th><th class="r">Blocks L</th><th class="r">Width d</th><th class="r">Vocabulary |V|</th><th class="r">Output head |V|·d</th></tr></thead><tbody>
      <tr><td>Llama 3 8B</td><td class="r">32</td><td class="r">4,096</td><td class="r">128,256</td><td class="r">≈ 525M</td></tr>
      <tr><td>DeepSeek V4.1 Flash</td><td class="r">40</td><td class="r">5,120</td><td class="r">129,280</td><td class="r">≈ 662M</td></tr>
      <tr><td>DeepSeek V4 Pro</td><td class="r">61</td><td class="r">7,168</td><td class="r">129,280</td><td class="r">≈ 927M</td></tr>
      <tr><td>GLM-5.2</td><td class="r">78</td><td class="r">6,144</td><td class="r">154,880</td><td class="r">≈ 952M</td></tr>
      <tr><td>Kimi K3</td><td class="r">93</td><td class="r">7,168</td><td class="r">163,840</td><td class="r">≈ 1.17B</td></tr></tbody></table>
      <p class="src">Llama Team (2024), Table 3; model configurations as of 23 Sep. 2026, per the slides.</p>
      <div class="note why">Lectures 4, 5 and 6 each rebuild one box of this diagram: the MLP becomes a mixture of experts, attention becomes sparse or compressed, and the cached keys and values shrink.</div>`},
    {id:'training', title:'Training: next-token log loss', body:String.raw`
      <p>Training samples a batch, runs a forward pass, computes the loss, backpropagates gradients and updates \(\theta\), many times. One pass over \(T\) tokens gives \(T\) predictions, because the causal mask hides each target \(x_{t+1}\) from position \(t\). The targets come from the text itself, with no human labels.</p>
      $$ \hat{\mathcal L}(\theta) = -\frac1T\sum_{t=1}^T \log p_\theta(x_{t+1}\mid x_{1:t}) = -\frac1T \log p_\theta(x_2,\dots,x_{T+1}\mid x_1) $$
      <p>So minimising log loss maximises the probability of the observed text. Why is that the right target? If \(P\) is the true distribution and \(Q\) the model’s,</p>
      $$ \mathbb E_{X\sim P}[-\log Q(X)] = \underbrace{H(P)}_{\text{independent of }Q} + \underbrace{D_{\mathrm{KL}}(P\,\|\,Q)}_{\ge 0,\ =0 \text{ iff } Q=P} $$
      <div data-widget="loss-decomp"></div>
      <div class="note hw">Problem 3 derives Shannon entropy from continuity, monotonicity and additivity, proves \(\mathrm{KL}\ge 0\) from \(\log x \le x-1\), and shows the sequence KL splits into a sum of per-position next-token KLs. That is why per-token log loss is the right objective for whole sequences.</div>
      <p>Gradients come from backpropagation; an optimizer, typically Adam, turns them into updates. At fixed compute the learning rate alone can separate a good run from a bad one, which is the subject of Lecture 3.</p>`},
    {id:'scaling', title:'Scaling laws: which run would you fund?', body:String.raw`
      <p>The budget is about \(6\times 10^{23}\) FLOPs. Option A: a 280B-parameter model on 300B tokens. Option B: 70B parameters on 1.4T tokens. With \(C \approx 6ND\), A costs \(5.0\times10^{23}\) and B \(5.9\times10^{23}\). Training both is not an option: the final GPT-4 run alone cost on the order of $40M in hardware and energy (Cottier et al., 2025). The idea is to fit a trend on small runs and extrapolate.</p>
      <p>Physics has such laws with mechanisms (inverse-square gravity), biology and cities have them with fitted exponents (heart rate against body mass, walking speed against city size). On log–log axes each is a straight line, \(Y \propto X^a\). Power-law learning curves predate LLMs (Hestness et al., 2017), and LLM scaling laws predict well even though a general explanation of their exponents is still open.</p>
      <h3>Kaplan et al. (2020): put compute into parameters</h3>
      <p>Test loss falls smoothly with parameters, data and compute: \(\mathcal L \propto N^{-0.076}\), \(D^{-0.095}\), \(C_{\min}^{-0.050}\). Kaplan’s allocation was \(N^* \propto C^{0.88}\): ten times the compute buys about 7.6× the parameters and only 1.3× the tokens. Their fit scores A at 1.71 and B at 1.74, so it favours A.</p>
      <h3>Hoffmann et al. (2022), Chinchilla: balance them</h3>
      <p>IsoFLOP experiments fix the budget and vary \(N\); each curve’s minimum is the best size for that budget. Fitting \(\hat{\mathcal L}(N,D) = E + AN^{-\alpha} + BD^{-\beta}\) and substituting \(D = C/(6N)\), differentiate with respect to \(\log N\):</p>
      $$ \alpha A N^{-\alpha} = \beta B D^{-\beta} \quad\Longrightarrow\quad N^* \propto C^{\beta/(\alpha+\beta)},\qquad D^* \propto C^{\alpha/(\alpha+\beta)} $$
      <p>With \(\alpha\approx0.34,\ \beta\approx0.28\) this gives \(N^*\propto C^{0.45}\), \(D^*\propto C^{0.55}\), close to equal scaling and about 20 tokens per parameter. Move the budget and watch the optimum.</p>
      <div data-widget="isoflop"></div>
      <div data-widget="allocation"></div>
      <p>DeepMind trained both: A was Gopher, B was Chinchilla. Chinchilla scored 67.6% on five-shot MMLU against Gopher’s 60.0%, at a similar budget.</p>
      <div class="note hw">Problem 2(b) is this calculation with a loss target instead of a budget: the cost-minimising pair satisfies \(aN_0^{-\alpha}/(bD_0^{-\beta}) = \beta/\alpha\), the same balance condition rearranged.</div>
      <h3>Porian et al. (2024): why they disagreed</h3>
      <p>Reproduce a Kaplan-style setup, then change one ingredient at a time. Counting the output head, matching warmup to run length and tuning the optimizer at each scale move the exponent from 0.835 to 0.497. Small models had looked cheaper than they were, and large models had been handicapped by warmup that ate a big share of their short runs.</p>
      <div data-widget="porian"></div>`},
    {id:'beyond', title:'Beyond fresh data and training cost', body:String.raw`
      <p><b>Limited data.</b> With \(U\) unique tokens repeated for \(E\) passes, \(D = EU\) and \(C\approx 6NEU\): repeated tokens count fully toward compute. Up to about four passes is nearly as good as fresh data; after that returns diminish (Muennighoff et al., 2023). If only 350B unique tokens existed, B’s 1.4T tokens would be four passes, still near the fresh-data curve.</p>
      <p><b>Inference.</b> Lifetime cost is \(C_{\text{life}} \approx 6ND + 2NR\), where \(R\) counts every prompt and generated position ever served. Each served token costs A 560 GFLOPs and B 140 GFLOPs, and serving about 1T tokens costs A as much as its whole training run. That is why Llama 3 8B was trained on about 15T tokens, roughly 1,900 per parameter.</p>
      <div data-widget="lifetime"></div>
      <div class="note hw">Problem 2(c)–(d) formalises this: as expected inference demand \(T\) grows, the optimal model shrinks and trains on more tokens, and a smaller-than-Chinchilla model becomes cheaper beyond a break-even demand \(T_{\text{break}} > 0\).</div>
      <h3>How labs use scaling laws</h3>
      <table class="t"><thead><tr><th>Report</th><th>What they fit and used</th></tr></thead><tbody>
      <tr><td>GPT-4 (2023)</td><td>Final loss predicted from runs with up to 10⁴× less compute</td></tr>
      <tr><td>DeepSeek (2024)</td><td>Learning rate, batch size, N/D split; 7B and 67B loss</td></tr>
      <tr><td>Llama 3 (2024)</td><td>Flagship model size; benchmark accuracy via task loss</td></tr>
      <tr><td>Qwen2.5 (2024)</td><td>Learning rate and batch size against model and data size</td></tr></tbody></table>
      <p>The fits vary with setup: DeepSeek’s allocation exponent ranged from 0.45 to 0.58 across datasets. The working recipe is to run small pilots varying \(N\), \(D\) and recipe; fit the loss surface and record uncertainty; choose the allocation for the target budget; then test the prediction on held-out larger runs, and refit whenever the data or recipe changes.</p>`}
  ],
  quiz:[
    {q:'At fixed compute, Chinchilla’s fit says 10× more compute should buy roughly…', options:['7.6× parameters, 1.3× tokens','3.2× parameters, 3.2× tokens','10× parameters, same tokens'], answer:1, why:'With N* ∝ C^½ and D* ∝ C^½, each grows by √10 ≈ 3.2.'},
    {q:'Why divide attention scores by √dₖ?', options:['To make the dot product a cosine','To keep score variance near 1 as width grows, so softmax does not saturate','To make attention causal'], answer:1, why:'For independent standard normal q, k, Var(qᵀk) = dₖ.'},
    {q:'Which correction moved Porian et al.’s exponent the most?', options:['Counting the output head (0.835 → 0.706)','Tuning warmup (0.706 → 0.602)','Tuning the optimizer (0.602 → 0.497)'], answer:0, why:'All three matter; the head correction is the largest single step at 0.129.'},
    {q:'The expected log loss of model Q equals H(P) when…', options:['Q is uniform','Q = P','KL(P‖Q) is maximised'], answer:1, why:'The gap is KL(P‖Q), which is zero exactly when the distributions agree.'}
  ],
  sources:['Vaswani et al. (2017)','Linzen, Dupoux and Goldberg (2016)','Zhang and Sennrich (2019)','Llama Team (2024)','Cottier et al. (2025)','Bettencourt et al. (2007)','West (2017)','Hestness et al. (2017)','Kaplan et al. (2020)','Hoffmann et al. (2022)','Porian et al. (2024)','Muennighoff et al. (2023)','Sardana et al. (2024)','GPT-4, DeepSeek LLM, Llama 3, Qwen2.5 technical reports']
});
