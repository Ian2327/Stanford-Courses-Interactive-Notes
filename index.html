<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore my projects, including Efficient Generative Models.">
  <title>My Projects</title>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --surface: #ffffff;
      --text: #182235;
      --muted: #626c7e;
      --accent: #475ce5;
      --border: #dfe3ed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100% - 3rem, 800px);
      margin: 0 auto;
      padding: clamp(4rem, 12vw, 8rem) 0;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 1.25rem 0 3rem;
      color: var(--muted);
      font-size: 1.125rem;
    }

    .projects {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .project {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: clamp(1.5rem, 4vw, 2rem);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      color: inherit;
      text-decoration: none;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .project:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 28px rgb(0 0 0 / 6%);
    }

    .project:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }

    .project h2 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.2rem, 4vw, 1.5rem);
      line-height: 1.3;
      letter-spacing: -0.025em;
    }

    .project p {
      margin: 0;
      color: var(--muted);
    }

    .arrow {
      flex-shrink: 0;
      color: var(--accent);
      font-size: 1.75rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101420;
        --surface: #191f2e;
        --text: #edf0f7;
        --muted: #a6afc2;
        --accent: #a0adff;
        --border: #30394c;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .project { transition: none; }
    }
  </style>
</head>

<body>
  <main>
    <ul class="projects" aria-label="Projects">
      <li>
        <a class="project" href="efficient_generative_models/">
          <div>
            <h2>Efficient Generative Models</h2>
            <p>Explore the project →</p>
          </div>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
